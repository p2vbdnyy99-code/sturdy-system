healthy older people.","p":"Anti-dsDNA and anti-Smith are specific for SLE. Anti-histone antibodies suggest drug-induced lupus."},{"s":"me","t":"Endocrinology","st":"Adrenal","hy":2,"q":"The best initial screening test for phaeochromocytoma is:","o":["Plasma free metanephrines","Urinary vanillylmandelic acid","Serum cortisol","MIBG scan"],"a":0,"e":"Plasma free metanephrines (or 24-hour urinary fractionated metanephrines) have the highest sensitivity. Imaging (CT/MRI) is done only after biochemical confirmation.","p":"Before surgery, give alpha-blockade first (phenoxybenzamine) and add a beta-blocker only after it; unopposed alpha stimulation can cause a hypertensive crisis. Rule of 10s (traditional): ~10% bilateral, extra-adrenal or malignant."},{"s":"me","t":"Gastroenterology & Hepatology","st":"Liver","hy":3,"q":"A serum-ascites albumin gradient (SAAG) of 1.1 g/dL or more indicates:","o":["Portal hypertension","Peritoneal tuberculosis","Peritoneal carcinomatosis","Pancreatic ascites"],"a":0,"e":"A high SAAG reflects increased hydrostatic pressure in the portal circulation: cirrhosis, alcoholic hepatitis, cardiac ascites, Budd-Chiari syndrome. Low SAAG (<1.1) suggests peritoneal disease such as TB, malignancy or pancreatitis.","p":"Spontaneous bacterial peritonitis = ascitic fluid neutrophil count ≥250 cells/mm³. Cefotaxime is commonly used; albumin reduces the risk of renal failure."},{"s":"su","t":"General Surgery","st":"Burns","hy":3,"q":"A 60 kg adult has 30% total body surface area burns. By the Parkland formula, how much crystalloid is needed in the first 8 hours from the time of the burn?","o":["3600 mL","7200 mL","2400 mL","4800 mL"],"a":0,"e":"Parkland: 4 mL × weight (kg) × %TBSA = 4 × 60 × 30 = 7200 mL in 24 hours. Half (3600 mL) is given in the first 8 hours from the time of injury and the rest over the next 16 hours. Ringer's lactate is used.","p":"Titrate fluid to urine output (about 0.5 mL/kg/h in adults, 1 mL/kg/h in children). Rule of nines: each upper limb 9%, each lower limb 18%, anterior trunk 18%, posterior trunk 18%, head 9%, perineum 1%."},{"s":"su","t":"Hepatobiliary & Pancreas","st":"Gallbladder & biliary","hy":3,"q":"Charcot's triad of ascending cholangitis consists of fever with rigors, jaundice and:","o":["Right upper quadrant pain","Hypotension","Mental confusion","Palpable gallbladder"],"a":0,"e":"Charcot's triad is fever, jaundice and right upper quadrant pain. Adding hypotension and altered mental status gives Reynolds' pentad, which indicates severe (suppurative) cholangitis.","p":"Management: resuscitation, antibiotics, and biliary drainage by ERCP. Courvoisier's law: a palpable gallbladder with jaundice is unlikely to be due to stones."},{"s":"su","t":"Breast & Endocrine","st":"Thyroid","hy":3,"q":"The most common malignancy of the thyroid gland is:","o":["Papillary carcinoma","Follicular carcinoma","Medullary carcinoma","Anaplastic carcinoma"],"a":0,"e":"Papillary carcinoma accounts for most thyroid cancers. It spreads by lymphatics and has an excellent prognosis. Nuclear features include Orphan Annie eye nuclei, grooves and pseudo-inclusions.","p":"Follicular carcinoma spreads by blood (bone, lung) and needs capsular or vascular invasion for diagnosis, so FNAC cannot tell it from adenoma. Medullary carcinoma arises from C cells, secretes calcitonin, and occurs in MEN 2."},{"s":"su","t":"GI Surgery","st":"Hernia","hy":3,"q":"A hernia that protrudes through Hesselbach's triangle is a:","o":["Direct inguinal hernia","Indirect inguinal hernia","Femoral hernia","Obturator hernia"],"a":0,"e":"Hesselbach's triangle is bounded by the inferior epigastric vessels laterally, the lateral border of rectus abdominis medially and the inguinal ligament inferiorly. A direct hernia passes through it, medial to the inferior epigastric vessels.","p":"An indirect hernia passes through the deep ring, lateral to the inferior epigastric vessels. A femoral hernia lies below and lateral to the pubic tubercle and is the most likely to strangulate."},{"s":"su","t":"Trauma","st":"Abdominal trauma","hy":3,"q":"In a haemodynamically STABLE patient with blunt abdominal trauma, the investigation of choice is:","o":["Contrast-enhanced CT of the abdomen","FAST ultrasound","Diagnostic peritoneal lavage","Plain X-ray abdomen"],"a":0,"e":"CECT defines solid-organ injury grade and retroperitoneal injury in stable patients, guiding non-operative management. FAST is the bedside tool in UNSTABLE patients; a positive FAST with instability warrants laparotomy.","p":"The spleen is the most commonly injured organ in blunt abdominal trauma; the liver is the most common in penetrating trauma."},{"s":"su","t":"GI Surgery","st":"Anorectal","hy":2,"q":"According to Goodsall's rule, a fistula-in-ano with an external opening behind a transverse line through the anus usually:","o":["Follows a curved track to an internal opening in the posterior midline","Runs straight radially to the nearest crypt","Opens anteriorly at 12 o'clock","Has no internal opening"],"a":0,"e":"Posterior external openings usually follow a curved track to the posterior midline. Anterior openings, within about 3 cm of the anus, usually run radially in a straight line to the nearest crypt.","p":"MRI pelvis is the investigation of choice for complex fistulas. A seton is used for high fistulas to preserve sphincter function."},{"s":"su","t":"Trauma","st":"Head injury","hy":3,"q":"On the Glasgow Coma Scale, a patient whose best motor response is withdrawal from a painful stimulus scores:","o":["M4","M5","M3","M2"],"a":0,"e":"Motor scale: 6 obeys commands, 5 localises pain, 4 withdraws (normal flexion), 3 abnormal flexion (decorticate), 2 extension (decerebrate), 1 none.","p":"GCS 8 or less = consider securing the airway (intubation). Eye opening is scored out of 4 and verbal response out of 5, so total GCS ranges from 3 to 15."},{"s":"su","t":"Urology","st":"Testis","hy":3,"q":"A 15-year-old boy presents with sudden severe scrotal pain for 3 hours. The testis is high-riding with a horizontal lie, and the cremasteric reflex is absent. The next step is:","o":["Urgent scrotal exploration","Antibiotics and observation","Wait for a Doppler scan the next morning","Elevation and analgesia only"],"a":0,"e":"This is testicular torsion until proven otherwise. Salvage rates are highest within about 6 hours, so clinical suspicion warrants immediate exploration. Detorsion and bilateral orchidopexy are done if viable; a non-viable testis is removed.","p":"Prehn sign (pain relief on elevation) suggests epididymitis but is unreliable. The 'blue dot sign' is torsion of the appendix testis."},{"s":"ob","t":"Obstetrics","st":"Hypertensive disorders","hy":3,"q":"The drug of choice to control and prevent convulsions in eclampsia is:","o":["Magnesium sulphate","Diazepam","Phenytoin","Labetalol"],"a":0,"e":"Magnesium sulphate is superior to diazepam and phenytoin in preventing recurrent eclamptic fits. Pritchard and Zuspan regimens are commonly used.","p":"Monitor for MgSO4 toxicity: loss of patellar reflex (first sign), respiratory rate <12/min, urine output <30 mL/h. Antidote: 10% calcium gluconate IV."},{"s":"ob","t":"Obstetrics","st":"Postpartum haemorrhage","hy":3,"q":"The most common cause of primary postpartum haemorrhage is:","o":["Uterine atony","Genital tract trauma","Retained placental tissue","Coagulation disorders"],"a":0,"e":"Atony accounts for most cases of PPH. The '4 Ts' are Tone (atony), Trauma, Tissue (retained products) and Thrombin (coagulopathy).","p":"Active management of the third stage of labour (uterotonic, controlled cord traction, uterine massage) prevents PPH. Oxytocin 10 IU IM is the uterotonic of choice. Tranexamic acid within 3 hours reduces deaths from bleeding."},{"s":"ob","t":"Obstetrics","st":"Labour","hy":2,"q":"Which of the following is NOT a component of the Bishop score?","o":["Fetal heart rate","Cervical dilatation","Station of the head","Consistency of the cervix"],"a":0,"e":"The Bishop score assesses cervical dilatation, effacement (or length), consistency, position and station of the presenting part. A score of 8 or more suggests a favourable cervix for induction.","p":"An unfavourable cervix is ripened before induction with prostaglandins (dinoprostone, misoprostol) or a Foley catheter."},{"s":"ob","t":"Obstetrics","st":"Physiology of pregnancy","hy":2,"q":"The hormone detected by a standard urine pregnancy test is:","o":["Human chorionic gonadotropin","Human placental lactogen","Progesterone","Estriol"],"a":0,"e":"Pregnancy tests detect the beta subunit of hCG, made by the syncytiotrophoblast. It peaks at about 8-10 weeks. In a viable early intrauterine pregnancy, serum beta-hCG roughly doubles every 48 hours.","p":"Very high hCG suggests molar pregnancy or multiple gestation. The discriminatory zone for a TVS-visible intrauterine sac is about 1500-2000 mIU/mL (thresholds vary)."},{"s":"ob","t":"Gynaecology","st":"Menstrual disorders & PCOS","hy":3,"q":"Under the Rotterdam criteria, polycystic ovary syndrome is diagnosed when how many of the three features are present (after excluding other causes)?","o":["Any two","All three","Any one","Only ovarian morphology plus raised LH"],"a":0,"e":"The three Rotterdam features are oligo- or anovulation, clinical or biochemical hyperandrogenism, and polycystic ovarian morphology on ultrasound. Two of three are required, after excluding thyroid disease, hyperprolactinaemia, non-classic CAH and others.","p":"Letrozole is now generally first-line for ovulation induction in PCOS. Metformin helps insulin resistance. Unopposed oestrogen from anovulation raises the risk of endometrial hyperplasia."},{"s":"ob","t":"Gynaecology","st":"Contraception","hy":2,"q":"The Copper-T 380A intrauterine device is approved for use for:","o":["10 years","3 years","5 years","1 year"],"a":0,"e":"CuT 380A is licensed for 10 years (studies show effectiveness for even longer). Cu 375 is approved for 5 years. The LNG-IUS is approved for 5 years or more depending on the product.","p":"An IUCD can be inserted within 5 days of unprotected intercourse as emergency contraception, the most effective method for that purpose."},{"s":"ob","t":"Obstetrics","st":"Ectopic & abortion","hy":3,"q":"The most common site of ectopic pregnancy is the:","o":["Ampulla of the fallopian tube","Isthmus of the fallopian tube","Ovary","Cervix"],"a":0,"e":"Most ectopic pregnancies are tubal, and the ampulla is the most common site. Interstitial (cornual) ectopics rupture later but bleed catastrophically.","p":"Methotrexate is suitable for a stable patient with an unruptured ectopic, low beta-hCG and no fetal cardiac activity. A haemodynamically unstable patient needs surgery."},{"s":"ob","t":"Gynaecology","st":"Gynae oncology","hy":3,"q":"The HPV types most strongly associated with cervical carcinoma are:","o":["16 and 18","6 and 11","1 and 2","31 and 33 only"],"a":0,"e":"High-risk HPV 16 and 18 cause about 70% of cervical cancers. Their E6 and E7 proteins inactivate p53 and Rb respectively. Types 6 and 11 cause genital warts.","p":"The transformation zone is where most cervical cancers arise. WHO recommends HPV DNA testing as the preferred primary screening test. HPV vaccination is best given before sexual debut."},{"s":"pe","t":"Growth & Development","st":"Milestones","hy":3,"q":"A child can copy a circle at about:","o":["3 years","2 years","4 years","5 years"],"a":0,"e":"Typical drawing milestones: vertical line at about 2 years, circle at 3 years, cross at 4 years, square at 4-5 years, triangle at 5 years.","p":"Also at 3 years: rides a tricycle, knows full name and gender, and goes up stairs with alternating feet."},{"s":"pe","t":"Growth & Development","st":"Milestones","hy":3,"q":"Social smile is expected to appear by:","o":["2 months","4 months","6 months","9 months"],"a":0,"e":"A responsive social smile emerges at about 6-8 weeks. Its absence by 3 months warrants assessment of vision, hearing and development.","p":"Laughs aloud at about 4 months. Stranger anxiety at about 7-9 months. Waves bye-bye at about 9-10 months."},{"s":"pe","t":"Neonatology","st":"Neonatal jaundice","hy":3,"q":"Neonatal jaundice is most likely to be pathological when it:","o":["Appears within the first 24 hours of life","Appears on day 3 in a term baby","Is unconjugated and below phototherapy thresholds","Resolves by 10 days of age"],"a":0,"e":"Jaundice within 24 hours suggests haemolysis (Rh or ABO incompatibility, G6PD deficiency) or infection, and needs urgent evaluation. Physiological jaundice appears after 24 hours, peaks on days 3-5 in term babies and resolves by about 2 weeks.","p":"Other red flags: conjugated bilirubin above 1 mg/dL (or more than 20% of total), pale stools, rapidly rising bilirubin, or jaundice persisting beyond 2 weeks in a term baby (3 weeks in preterm)."},{"s":"pe","t":"Paediatric Cardiology","st":"Congenital heart disease","hy":3,"q":"Which is NOT one of the four classic components of tetralogy of Fallot?","o":["Atrial septal defect","Ventricular septal defect","Right ventricular outflow tract obstruction","Overriding aorta"],"a":0,"e":"The four features are VSD, RVOT obstruction (pulmonary stenosis), overriding aorta and right ventricular hypertrophy. The addition of an ASD is called pentalogy of Fallot.","p":"Chest X-ray shows a 'boot-shaped' heart. Hypercyanotic (tet) spells: knee-chest position, oxygen, morphine, IV fluids, phenylephrine, propranolol."},{"s":"pe","t":"Infections & Immunisation","st":"Exanthems","hy":3,"q":"Small white spots on a red base on the buccal mucosa opposite the molars, appearing before the rash, are pathognomonic of:","o":["Measles","Rubella","Scarlet fever","Varicella"],"a":0,"e":"Koplik spots appear 1-2 days before the measles rash and fade as it appears. The rash starts behind the ears and along the hairline and spreads downwards.","p":"Vitamin A reduces measles mortality and complications. Subacute sclerosing panencephalitis (SSPE) is a late complication. Rubella: postauricular lymphadenopathy, Forchheimer spots."},{"s":"pe","t":"Growth & Development","st":"Growth","hy":2,"q":"A healthy term infant's birth weight approximately TRIPLES by:","o":["1 year","6 months","2 years","3 years"],"a":0,"e":"Birth weight roughly doubles by 4-5 months, triples by 1 year and quadruples by 2 years.","p":"Length increases by about 50% by 1 year. Head circumference rises from about 35 cm at birth to about 45 cm at 1 year."},{"s":"pe","t":"Infections & Immunisation","st":"Respiratory infections","hy":3,"q":"A 2-year-old has a barking cough, inspiratory stridor and hoarseness, and a neck X-ray shows a 'steeple sign'. The most common causative agent is:","o":["Parainfluenza virus","Haemophilus influenzae type b","Respiratory syncytial virus","Streptococcus pyogenes"],"a":0,"e":"Croup (laryngotracheobronchitis) is mostly caused by parainfluenza virus type 1. Subglottic narrowing produces the steeple sign on AP neck X-ray.","p":"Treat with a single dose of oral dexamethasone; nebulised adrenaline for moderate to severe stridor. Thumb sign on lateral X-ray = epiglottitis (Hib)."},{"s":"pe","t":"Nutrition","st":"Malnutrition","hy":3,"q":"The feature that distinguishes kwashiorkor from marasmus is the presence of:","o":["Bilateral pitting oedema","Weight below 60% of expected","Muscle wasting","Hunger"],"a":0,"e":"Kwashiorkor is characterised by oedema, flaky-paint dermatosis, hair changes, a fatty liver and apathy. Marasmus shows severe wasting with no oedema and the child is often alert and hungry.","p":"Bilateral pitting oedema of nutritional origin classifies a child as having severe acute malnutrition regardless of weight. Other SAM criteria: weight-for-height below -3 SD, or MUAC below 11.5 cm."},{"s":"or","t":"Upper Limb Trauma","st":"Elbow & forearm","hy":3,"q":"The nerve most commonly injured in a supracondylar fracture of the humerus in children is the:","o":["Anterior interosseous nerve","Ulnar nerve","Radial nerve","Musculocutaneous nerve"],"a":0,"e":"The anterior interosseous branch of the median nerve is most commonly affected in extension-type fractures. Patients cannot make an 'OK' sign because flexor pollicis longus and the index FDP are weak. Ulnar nerve injury is most common after medial pin placement.","p":"Volkmann's ischaemic contracture can complicate supracondylar fractures. Pain on passive finger extension is the earliest sign of compartment syndrome."},{"s":"or","t":"Lower Limb Trauma","st":"Hip & femur","hy":2,"q":"The Garden classification is used for:","o":["Fractures of the femoral neck","Intertrochanteric fractures","Fractures of the femoral shaft","Fractures of the tibial plateau"],"a":0,"e":"Garden grades femoral neck fractures I-IV by displacement. Grades III and IV (displaced) have a high risk of avascular necrosis and non-union, and are often treated with arthroplasty in older patients.","p":"Pauwels classification uses the angle of the femoral neck fracture line. Schatzker classification is for tibial plateau fractures."},{"s":"or","t":"Bone Tumours","st":"Malignant","hy":3,"q":"Sunburst appearance and Codman's triangle on X-ray around the knee in a teenager suggest:","o":["Osteosarcoma","Ewing sarcoma","Giant cell tumour","Osteochondroma"],"a":0,"e":"Osteosarcoma arises in the metaphysis around the knee in adolescents. It produces aggressive periosteal reaction: radiating spicules (sunburst) and Codman's triangle.","p":"Ewing sarcoma: diaphysis, 'onion-peel' periosteal reaction, t(11;22). Lungs are the most common site of metastasis for osteosarcoma."},{"s":"or","t":"Bone Tumours","st":"Benign","hy":3,"q":"An eccentric, lytic, 'soap-bubble' lesion at the end of a long bone in a 30-year-old, after closure of the growth plate, is most likely a:","o":["Giant cell tumour","Simple bone cyst","Osteoid osteoma","Chondroblastoma"],"a":0,"e":"Giant cell tumour is epiphyseal, extending to the subchondral bone in skeletally mature patients, most commonly around the knee (distal femur, proximal tibia) and distal radius.","p":"Chondroblastoma is epiphyseal but occurs BEFORE growth plate closure. Osteoid osteoma causes night pain relieved by aspirin or NSAIDs, with a nidus under 2 cm."},{"s":"or","t":"Infections & Spine","st":"Tuberculosis of spine","hy":2,"q":"Tuberculosis of the spine (Pott's disease) most commonly affects the:","o":["Lower thoracic and upper lumbar (thoracolumbar) region","Cervical spine","Sacrum","Coccyx"],"a":0,"e":"Spinal TB most commonly involves the lower thoracic and upper lumbar vertebrae. The paradiscal type (adjacent vertebral bodies and the disc between them) is the commonest.","p":"Spinal TB is the most common site of skeletal TB. Pott's paraplegia may need surgical decompression. Cold abscess can track to form a psoas abscess."},{"s":"or","t":"Paediatric Orthopaedics","st":"CTEV & DDH","hy":3,"q":"The preferred initial treatment for idiopathic congenital talipes equinovarus (clubfoot) in a newborn is:","o":["Ponseti serial casting","Immediate posteromedial soft tissue release","Triple arthrodesis","Observation until walking age"],"a":0,"e":"The Ponseti method uses gentle manipulation and serial long-leg casts, usually followed by percutaneous tenotomy of the Achilles tendon and then foot abduction braces. It corrects most clubfeet.","p":"Order of correction in Ponseti (CAVE): Cavus, Adductus, Varus, Equinus. Equinus is corrected last. Brace compliance prevents relapse."},{"s":"or","t":"Peripheral Nerve Injuries","st":"Lower limb nerves","hy":3,"q":"Foot drop after a fracture of the neck of the fibula is due to injury of the:","o":["Common peroneal nerve","Tibial nerve","Sciatic nerve trunk","Femoral nerve"],"a":0,"e":"The common peroneal (fibular) nerve winds superficially around the fibular neck. Injury paralyses the ankle and toe dorsiflexors and the evertors, causing foot drop and a high-stepping gait, with sensory loss over the dorsum of the foot.","p":"The common peroneal is the most commonly injured nerve in the lower limb. A tight plaster cast at the fibular neck is also a cause."},{"s":"or","t":"Upper Limb Trauma","st":"Elbow & forearm","hy":3,"q":"A fracture of the proximal third of the ulna with dislocation of the radial head is called:","o":["Monteggia fracture-dislocation","Galeazzi fracture-dislocation","Colles fracture","Smith fracture"],"a":0,"e":"Monteggia: proximal ulna fracture with radial head dislocation. Galeazzi: distal radius shaft fracture with distal radioulnar joint dislocation.","p":"Mnemonic MUGR: Monteggia = Ulna fracture; Galeazzi = Radius fracture. Posterior interosseous nerve injury can complicate a Monteggia fracture."},{"s":"de","t":"Papulosquamous Disorders","st":"Psoriasis","hy":3,"q":"Pinpoint bleeding on scraping off the scales of a well-defined erythematous plaque is called:","o":["Auspitz sign","Nikolsky sign","Darier sign","Dermographism"],"a":0,"e":"Removing psoriatic scales exposes dilated capillaries in elongated dermal papillae beneath a thin suprapapillary epidermis, producing pinpoint bleeding.","p":"Other psoriasis signs: candle-grease sign, Koebner phenomenon (lesions at sites of trauma), nail pitting, oil-drop sign. Munro microabscesses lie in the stratum corneum."},{"s":"de","t":"Vesiculobullous Disorders","st":"Pemphigus & pemphigoid","hy":3,"q":"Flaccid blisters, painful oral erosions and a positive Nikolsky sign in a middle-aged adult suggest pemphigus vulgaris. The target antigen is:","o":["Desmoglein 3","BP180 (collagen XVII)","Collagen VII","Tissue transglutaminase"],"a":0,"e":"Pemphigus vulgaris is caused by IgG against desmoglein 3 (plus desmoglein 1 in mucocutaneous disease). Loss of keratinocyte adhesion (acantholysis) produces suprabasal intraepidermal blisters. Direct IF shows a 'fishnet' intercellular pattern.","p":"Bullous pemphigoid: elderly, tense subepidermal blisters, BP180/BP230, linear IgG and C3 along the basement membrane. Pemphigus foliaceus: desmoglein 1, superficial blisters, no oral lesions."},{"s":"de","t":"Papulosquamous Disorders","st":"Lichen planus","hy":3,"q":"Fine white lines (Wickham's striae) on the surface of violaceous, flat-topped, polygonal, itchy papules are seen in:","o":["Lichen planus","Psoriasis","Pityriasis rosea","Secondary syphilis"],"a":0,"e":"Lichen planus lesions are described by the 6 Ps: purple, polygonal, planar, pruritic papules and plaques. Wickham's striae reflect focal thickening of the granular layer.","p":"Histology shows a band-like lymphocytic infiltrate at the dermo-epidermal junction, and Civatte (colloid) bodies. Associated with hepatitis C. Oral lesions have a lacy, reticular pattern."},{"s":"de","t":"Infections & Infestations","st":"Scabies & lice","hy":3,"q":"The topical treatment of choice for scabies is:","o":["Permethrin 5% cream","Clotrimazole cream","Hydrocortisone 1% cream","Mupirocin ointment"],"a":0,"e":"Permethrin 5% is applied from the neck down (including the scalp in infants and the elderly), left overnight and repeated after 1 week. All close contacts are treated at the same time.","p":"Oral ivermectin is used for crusted (Norwegian) scabies and institutional outbreaks. Burrows are typical in finger webs, wrists and genitalia, with itch that is worse at night."},{"s":"de","t":"Leprosy","st":"Classification & treatment","hy":3,"q":"Under WHO multidrug therapy, the standard duration of treatment for multibacillary leprosy in adults is:","o":["12 months","6 months","24 months","3 months"],"a":0,"e":"WHO recommends rifampicin, clofazimine and dapsone for 12 months for MB leprosy. The same three drugs are recommended for 6 months for PB leprosy.","p":"Type 1 (reversal) reaction affects nerves and skin; treat with steroids. Type 2 reaction (ENL) is immune complex mediated. Single-dose rifampicin is used as post-exposure prophylaxis for contacts."},{"s":"de","t":"Vesiculobullous Disorders","st":"Dermatitis herpetiformis","hy":3,"q":"Intensely itchy grouped vesicles on the elbows, knees and buttocks with granular IgA deposits in the dermal papillae are associated with:","o":["Gluten-sensitive enteropathy","Hepatitis C infection","Penicillin allergy","Systemic lupus erythematosus"],"a":0,"e":"Dermatitis herpetiformis is the skin manifestation of coeliac disease. Antibodies target epidermal transglutaminase (TG3).","p":"Dapsone controls the itch quickly. A gluten-free diet treats both skin and gut disease and lowers lymphoma risk."},{"s":"de","t":"Infections & Infestations","st":"Fungal","hy":2,"q":"A boggy, painful, pustular swelling of the scalp with hair loss in a child is most likely:","o":["Kerion (inflammatory tinea capitis)","Alopecia areata","Seborrhoeic dermatitis","Bacterial folliculitis only"],"a":0,"e":"Kerion is a severe inflammatory host response to dermatophytes, often zoophilic species. It needs systemic antifungals (griseofulvin or terbinafine); topical agents alone do not reach the hair follicle.","p":"Untreated kerion can cause scarring alopecia. Wood's lamp shows green fluorescence with Microsporum infection but not with most Trichophyton infections."},{"s":"de","t":"Infections & Infestations","st":"Viral","hy":3,"q":"In herpes zoster ophthalmicus, vesicles on the tip of the nose (Hutchinson's sign) indicate involvement of the:","o":["Nasociliary nerve, with high risk of ocular involvement","Maxillary nerve","Frontal nerve only","Facial nerve"],"a":0,"e":"The nasociliary branch of the ophthalmic division supplies both the tip of the nose and the globe. Its involvement predicts eye complications such as keratitis and uveitis.","p":"Start oral antivirals (acyclovir, valacyclovir) within 72 hours of rash onset, and refer to an ophthalmologist. Ramsay Hunt syndrome = zoster of the geniculate ganglion with facial palsy and vesicles in the ear."},{"s":"ps","t":"Psychotic Disorders","st":"Schizophrenia","hy":2,"q":"'First-rank symptoms' of schizophrenia were described by:","o":["Kurt Schneider","Eugen Bleuler","Emil Kraepelin","Sigmund Freud"],"a":0,"e":"Schneider's first-rank symptoms include audible thoughts, third-person voices discussing or commenting on the patient, thought insertion, withdrawal and broadcasting, delusional perception, and made (passivity) experiences.","p":"Bleuler coined the term 'schizophrenia' and the 4 As. Kraepelin called it 'dementia praecox'."},{"s":"ps","t":"Psychopharmacology & Therapies","st":"Mood stabilisers","hy":3,"q":"Polyuria and polydipsia in a patient on long-term lithium are most often due to:","o":["Nephrogenic diabetes insipidus","Central diabetes insipidus","Hyperglycaemia","Primary polydipsia"],"a":0,"e":"Lithium accumulates in collecting duct cells and reduces their response to ADH (downregulating aquaporin-2), causing nephrogenic DI. Amiloride can reduce lithium entry into these cells.","p":"Other lithium effects: hypothyroidism, tremor, weight gain, Ebstein anomaly if used in the first trimester. Toxicity is increased by thiazides, NSAIDs, ACE inhibitors and dehydration."},{"s":"ps","t":"Substance Use","st":"Alcohol","hy":3,"q":"Delirium tremens typically begins how long after the last drink?","o":["48-72 hours","Within 6 hours","2 weeks","24 hours exactly, with no variation"],"a":0,"e":"Simple withdrawal (tremor, sweating, anxiety) starts within 6-24 hours. Withdrawal seizures peak at 12-48 hours. Delirium tremens, with confusion, hallucinations and autonomic hyperactivity, usually begins at 48-72 hours.","p":"Benzodiazepines (chlordiazepoxide, or lorazepam in liver disease) are the treatment. Give thiamine before glucose to prevent Wernicke encephalopathy."},{"s":"ps","t":"Psychopharmacology & Therapies","st":"Antipsychotics","hy":3,"q":"The adverse effect of clozapine that requires regular blood count monitoring is:","o":["Agranulocytosis","Hyperprolactinaemia","Tardive dyskinesia","Hypothyroidism"],"a":0,"e":"Clozapine can cause potentially fatal neutropenia and agranulocytosis, so absolute neutrophil counts are monitored (weekly at first). Clozapine is the drug of choice for treatment-resistant schizophrenia.","p":"Other clozapine effects: hypersalivation, seizures (dose-related), myocarditis, constipation and ileus, weight gain. It rarely causes extrapyramidal symptoms."},{"s":"ps","t":"Child Psychiatry","st":"ADHD & autism","hy":2,"q":"The first-line drug for ADHD in school-age children is:","o":["Methylphenidate","Haloperidol","Fluoxetine","Lithium"],"a":0,"e":"Stimulants (methylphenidate, amphetamines) are first-line for ADHD. Atomoxetine (a non-stimulant) is an alternative, especially where there is a risk of substance misuse.","p":"Stimulant effects to monitor: appetite suppression, insomnia, growth slowing, raised heart rate and BP."},{"s":"ps","t":"Psychopharmacology & Therapies","st":"ECT","hy":3,"q":"The treatment of choice for severe depression with active suicidal risk or catatonia is:","o":["Electroconvulsive therapy","Low-dose SSRI with weekly review","Benzodiazepine alone","Supportive psychotherapy only"],"a":0,"e":"ECT acts quickly and is highly effective in severe depression with suicidality, psychotic features, food refusal or catatonia. Benzodiazepines (lorazepam) are first-line for catatonia, with ECT if they fail.","p":"ECT has no absolute contraindications. Raised intracranial pressure is the most important relative contraindication. Common side effects are transient memory impairment and headache."},{"s":"ps","t":"Substance Use","st":"Alcohol","hy":3,"q":"The classic triad of Wernicke encephalopathy is:","o":["Confusion, ophthalmoplegia and ataxia","Confabulation, amnesia and apathy","Tremor, rigidity and bradykinesia","Fever, rigidity and altered sensorium"],"a":0,"e":"Wernicke encephalopathy results from thiamine deficiency. The complete triad is present in a minority of patients, so treat on clinical suspicion with parenteral thiamine.","p":"Korsakoff syndrome follows if untreated: anterograde amnesia with confabulation. The mammillary bodies are characteristically affected."},{"s":"ps","t":"Psychopharmacology & Therapies","st":"Antipsychotics","hy":3,"q":"A patient on haloperidol develops high fever, generalised 'lead-pipe' rigidity, fluctuating BP and a markedly raised creatine kinase. The diagnosis is:","o":["Neuroleptic malignant syndrome","Serotonin syndrome","Acute dystonia","Tardive dyskinesia"],"a":0,"e":"Neuroleptic malignant syndrome is caused by dopamine D2 blockade. It develops over days with rigidity, hyperthermia, autonomic instability and altered consciousness. Stop the antipsychotic, cool and hydrate the patient; dantrolene and bromocriptine may be used.","p":"Serotonin syndrome develops within hours of a serotonergic drug, with clonus and hyperreflexia, and is treated with cyproheptadine."},{"s":"as","t":"Inhalational Agents","st":"Pharmacology","hy":3,"q":"Which inhalational anaesthetic has the lowest blood:gas partition coefficient (fastest induction and recovery)?","o":["Desflurane","Sevoflurane","Isoflurane","Halothane"],"a":0,"e":"Desflurane has a blood:gas coefficient of about 0.42, lower than nitrous oxide (about 0.47), sevoflurane (about 0.65), isoflurane (about 1.4) and halothane (about 2.4). A lower coefficient means faster induction and recovery.","p":"Sevoflurane is the agent of choice for inhalational induction because it is sweet and non-irritant. Desflurane irritates the airways and needs a heated vaporiser."},{"s":"as","t":"Monitoring & Complications","st":"Malignant hyperthermia","hy":3,"q":"The specific drug for treatment of malignant hyperthermia is:","o":["Dantrolene","Succinylcholine","Neostigmine","Paracetamol"],"a":0,"e":"Dantrolene blocks ryanodine receptor (RyR1) calcium release from the sarcoplasmic reticulum. Also stop the triggering agent, hyperventilate with 100% oxygen, and cool the patient.","p":"Triggers: volatile anaesthetics and succinylcholine. The earliest sign is often an unexplained rise in end-tidal CO2. It is linked to RYR1 mutations (autosomal dominant)."},{"s":"as","t":"IV Agents & Muscle Relaxants","st":"Muscle relaxants","hy":3,"q":"Succinylcholine should be avoided in a patient with:","o":["Major burns 3 weeks old","An elective appendicectomy in a healthy adult","Rapid sequence intubation with a full stomach","A short procedure under GA"],"a":0,"e":"After burns, crush injury, denervation or prolonged immobilisation, extrajunctional acetylcholine receptors proliferate. Succinylcholine can then cause life-threatening hyperkalaemia. The risk is highest from about 48 hours to many months after injury.","p":"Succinylcholine is a depolarising relaxant with the fastest onset and shortest duration. Prolonged block occurs with pseudocholinesterase deficiency (dibucaine number)."},{"s":"as","t":"Local & Regional","st":"Local anaesthetics","hy":3,"q":"Which local anaesthetic is the most cardiotoxic?","o":["Bupivacaine","Lignocaine","Ropivacaine","Chloroprocaine"],"a":0,"e":"Bupivacaine binds cardiac sodium channels avidly and dissociates slowly, so it can cause refractory arrhythmias and cardiovascular collapse. Ropivacaine and levobupivacaine are less cardiotoxic.","p":"Treat LA systemic toxicity with 20% lipid emulsion. Maximum doses: plain lignocaine 3 mg/kg, lignocaine with adrenaline 7 mg/kg, bupivacaine 2 mg/kg."},{"s":"as","t":"Airway & Pre-op","st":"Airway assessment","hy":3,"q":"The Mallampati classification assesses:","o":["Visibility of oropharyngeal structures with the mouth open, to predict difficult intubation","Laryngoscopic view of the glottis","Neck mobility","Thyromental distance"],"a":0,"e":"With the patient sitting, mouth fully open and tongue protruded, class I shows soft palate, fauces, uvula and pillars, while class IV shows the hard palate only. Higher classes predict difficult laryngoscopy.","p":"Cormack-Lehane grades the glottic view at laryngoscopy. A thyromental distance under 6 cm suggests difficult intubation."},{"s":"as","t":"IV Agents & Muscle Relaxants","st":"Induction agents","hy":3,"q":"In a hypotensive trauma patient, the induction agent that best maintains blood pressure is:","o":["Ketamine","Propofol","Thiopentone","Midazolam in high doses"],"a":0,"e":"Ketamine stimulates the sympathetic nervous system, maintaining heart rate and blood pressure. It is also a bronchodilator. Propofol and thiopentone cause vasodilation and myocardial depression.","p":"Ketamine produces dissociative anaesthesia with analgesia. Emergence reactions are reduced by benzodiazepines. It increases salivation and has traditionally been avoided with raised intracranial pressure."},{"s":"as","t":"Monitoring & Complications","st":"Monitoring","hy":3,"q":"The most reliable method of confirming correct endotracheal tube placement is:","o":["Sustained waveform capnography","Auscultation of the chest","Visible chest rise","Misting of the tube"],"a":0,"e":"A persistent CO2 waveform over several breaths confirms tracheal placement. Clinical signs such as chest rise and breath sounds can be misleading. During cardiac arrest, CO2 may be low but a waveform is still seen with good CPR.","p":"Sudden loss of ETCO2: circuit disconnection, oesophageal intubation, tube dislodgement or cardiac arrest. A rising ETCO2 during CPR suggests return of spontaneous circulation."},{"s":"as","t":"CPR","st":"Basic & advanced life support","hy":3,"q":"In adult CPR, chest compressions should be delivered at a rate of:","o":["100-120 per minute","60-80 per minute","80-100 per minute","120-150 per minute"],"a":0,"e":"Current guidelines recommend 100-120 compressions per minute at a depth of 5-6 cm, allowing full recoil and minimising interruptions. The compression-to-ventilation ratio without an advanced airway is 30:2.","p":"Shockable rhythms: VF and pulseless VT. Adrenaline 1 mg every 3-5 minutes. Amiodarone 300 mg after the third shock."},{"s":"ra","t":"Physics & Radiation Protection","st":"Radiobiology","hy":3,"q":"The most radiosensitive phase of the cell cycle is:","o":["G2/M","S phase","G1","G0"],"a":0,"e":"Cells are most radiosensitive in late G2 and mitosis, and most radioresistant in late S phase.","p":"Law of Bergonié and Tribondeau: tissues with high mitotic rate and less differentiation are more radiosensitive. The 4 Rs of radiobiology are Repair, Reoxygenation, Redistribution and Repopulation."},{"s":"ra","t":"Neuroimaging","st":"Brain","hy":3,"q":"The initial investigation of choice for suspected acute subarachnoid haemorrhage is:","o":["Non-contrast CT of the head","Contrast-enhanced MRI","Digital subtraction angiography","Lumbar puncture"],"a":0,"e":"NCCT is highly sensitive in the first hours after SAH, showing hyperdense blood in the basal cisterns and sulci. If CT is negative and suspicion is high, lumbar puncture looks for xanthochromia. Angiography (CTA or DSA) then locates the aneurysm.","p":"Nimodipine is given to reduce delayed cerebral ischaemia from vasospasm. A 'thunderclap headache' (worst headache of life) is the classic presentation."},{"s":"ra","t":"Physics & Radiation Protection","st":"Units & protection","hy":3,"q":"The SI unit of equivalent (and effective) dose is the:","o":["Sievert","Gray","Becquerel","Roentgen"],"a":0,"e":"Sievert accounts for the biological effect of the radiation type (and, for effective dose, the tissue). The Gray is the unit of absorbed dose (1 J/kg). The Becquerel measures radioactivity (1 disintegration per second).","p":"ICRP occupational dose limit: 20 mSv per year averaged over 5 years. Public limit: 1 mSv per year."},{"s":"ra","t":"Chest Imaging","st":"Chest X-ray signs","hy":3,"q":"A perihilar 'bat-wing' pattern of opacity on chest X-ray is classically seen in:","o":["Pulmonary oedema","Pneumothorax","Miliary tuberculosis","Bronchiectasis"],"a":0,"e":"Alveolar pulmonary oedema fills the central (perihilar) airspaces bilaterally, sparing the periphery and producing a bat-wing or butterfly pattern.","p":"Other CXR signs of cardiac failure: upper lobe diversion, Kerley B lines, cardiomegaly, pleural effusions and peribronchial cuffing."},{"s":"ra","t":"Abdominal Imaging","st":"GI signs","hy":3,"q":"The best plain radiograph for detecting a small amount of free intraperitoneal air is:","o":["Erect chest X-ray","Supine abdominal X-ray","Lateral cervical spine X-ray","Prone abdominal X-ray"],"a":0,"e":"On an erect chest film, gas collects under the domes of the diaphragm and as little as 1-2 mL can be seen. Keeping the patient upright for about 10 minutes before the film improves sensitivity. CT is the most sensitive test overall.","p":"If the patient cannot stand, use a left lateral decubitus film. Rigler's sign (both sides of the bowel wall visible) is seen on supine films with a large pneumoperitoneum."},{"s":"ra","t":"Musculoskeletal Imaging","st":"Bone & joint","hy":3,"q":"The most sensitive imaging test for early acute osteomyelitis is:","o":["MRI","Plain X-ray","Ultrasound","CT"],"a":0,"e":"MRI detects marrow oedema within days of infection. Plain X-ray changes (periosteal reaction, lysis) usually take 10-14 days to appear.","p":"Sequestrum = dead bone. Involucrum = new periosteal bone around it. Staphylococcus aureus is the most common cause; Salmonella is classically associated with sickle cell disease."},{"s":"ra","t":"Nuclear Medicine","st":"Isotopes & scans","hy":2,"q":"The physical half-life of technetium-99m is about:","o":["6 hours","6 days","8 days","110 minutes"],"a":0,"e":"Tc-99m emits 140 keV gamma rays with a 6-hour half-life, which is ideal for imaging. It is obtained from a molybdenum-99 generator.","p":"I-131 has a half-life of about 8 days. F-18 (FDG-PET) has a half-life of about 110 minutes."},{"s":"ra","t":"Abdominal Imaging","st":"GI signs","hy":3,"q":"A 'coffee bean' sign on an abdominal radiograph of an elderly man with abdominal distension suggests:","o":["Sigmoid volvulus","Caecal volvulus","Small bowel obstruction","Intussusception"],"a":0,"e":"A massively dilated, twisted sigmoid loop forms an inverted-U 'coffee bean' shape arising from the pelvis. Contrast enema shows a 'bird's beak' at the point of twist.","p":"For sigmoid volvulus without peritonitis, the first-line treatment is endoscopic (flexible sigmoidoscopic) decompression, followed by elective resection because of recurrence."}],"seed-img-1.json":[{"s":"pe","t":"Infections & Immunisation","st":"Exanthems","hy":3,"img":"img/koplik.jpg","credit":"Image: CDC, public domain, via Wikimedia Commons","q":"A 3-year-old has had high fever, cough, coryza and red watery eyes for 3 days. There is no rash yet. The buccal mucosa is shown. What is the most likely diagnosis?","o":["Measles","Hand, foot and mouth disease","Herpetic gingivostomatitis","Oral candidiasis"],"a":0,"e":"Small white-grey spots on a red base on the buccal mucosa opposite the molars are Koplik spots. With the prodrome of cough, coryza and conjunctivitis, they indicate measles. The spots appear 1-2 days before the rash. Candida plaques can be wiped off, and herpetic stomatitis causes painful ulcers across the gums and mouth.","p":"Measles prodrome = the 3 Cs (cough, coryza, conjunctivitis) plus Koplik spots. The rash starts behind the ears and spreads downwards. Give vitamin A to every child with measles."},{"s":"su","t":"GI Surgery","st":"Oesophagus & stomach","hy":3,"img":"img/pneumoperitoneum.jpg","credit":"Image: Cerevisae, CC BY-SA 4.0, via Wikimedia Commons","q":"The chest radiograph and CT shown are from an adult with sudden severe abdominal pain and a rigid abdomen, with no history of trauma or recent surgery. The finding labelled is most commonly caused by:","o":["Perforated peptic ulcer","Perforated sigmoid diverticulum","Acute pancreatitis","Ruptured ectopic pregnancy"],"a":0,"e":"The images show free intraperitoneal gas (pneumoperitoneum) under the diaphragm and anterior to the liver. In a patient without recent surgery or trauma, a perforated duodenal or gastric ulcer is the most common cause. Pancreatitis and a ruptured ectopic cause free fluid, not free gas. Diverticular perforation does cause free gas, but less often.","p":"Free gas under the diaphragm is best seen on an erect chest X-ray. CT is the most sensitive test. Recent laparotomy or laparoscopy can leave benign free gas for days."},{"s":"ra","t":"Abdominal Imaging","st":"GI signs","hy":3,"img":"img/sigmoid-volvulus.jpg","credit":"Image: Mont4nha, CC0, via Wikimedia Commons","q":"A patient presents with gross abdominal distension and absolute constipation. The abdominal radiograph is shown. What is the most likely diagnosis?","o":["Sigmoid volvulus","Caecal volvulus","Small bowel obstruction","Paralytic ileus"],"a":0,"e":"A hugely distended, gas-filled loop of large bowel arises from the pelvis and extends up towards the diaphragm in an inverted-U ('coffee bean') shape. This is sigmoid volvulus. Caecal volvulus produces a dilated loop that typically points to the left upper quadrant. Small bowel obstruction produces multiple central loops with valvulae conniventes.","p":"For sigmoid volvulus without peritonitis, the first-line treatment is endoscopic decompression with a flatus tube, then elective sigmoid colectomy because it often recurs. Contrast enema shows a 'bird's beak' at the twist."},{"s":"de","t":"Infections & Infestations","st":"Viral","hy":3,"img":"img/hz-ophthalmicus.jpg","credit":"Image: Milorad Dimic MD, CC BY-SA 3.0, via Wikimedia Commons","q":"A 68-year-old man has had burning pain on one side of the forehead for 2 days, followed by the eruption shown, which stops at the midline. Which nerve is involved?","o":["Ophthalmic division of the trigeminal nerve","Maxillary division of the trigeminal nerve","Facial nerve","Greater occipital nerve"],"a":0,"e":"Grouped vesicles and crusts on the forehead, scalp and upper lid, with swelling of the eyelids, follow the dermatome of the ophthalmic division (V1). The rash does not cross the midline. This is herpes zoster ophthalmicus from reactivated varicella-zoster virus in the trigeminal ganglion.","p":"Lesions on the tip or side of the nose (Hutchinson sign) mean the nasociliary nerve is involved and the eye is at high risk. Start oral acyclovir or valacyclovir within 72 hours and refer to an ophthalmologist."}],"taxonomy.json":[{"id":"an","name":"Anatomy","topics":[{"name":"General Anatomy & Embryology","subs":["General embryology","Pharyngeal arches","Histology","Genetics"]},{"name":"Upper Limb","subs":["Brachial plexus","Nerve injuries","Muscles & joints","Vessels"]},{"name":"Lower Limb","subs":["Lumbosacral plexus","Gluteal region & hip","Knee, leg & foot","Vessels"]},{"name":"Thorax","subs":["Heart & coronaries","Lungs & pleura","Mediastinum"]},{"name":"Abdomen & Pelvis","subs":["Peritoneum","GI tract","Kidney & posterior wall","Pelvis & perineum"]},{"name":"Head & Neck","subs":["Skull & cranial cavity","Cranial nerves","Neck","Larynx & pharynx","Orbit"]},{"name":"Neuroanatomy","subs":["Brainstem","Cerebrum & white matter","Spinal cord tracts","Blood supply & ventricles"]},{"name":"Back","subs":["Vertebral column","Spinal nerves"]}]},{"id":"ph","name":"Physiology","topics":[{"name":"General & Cell Physiology","subs":["Membrane transport","Body fluids"]},{"name":"Nerve & Muscle","subs":["Action potential","Neuromuscular junction","Muscle contraction"]},{"name":"Blood","subs":["RBC & haemoglobin","Haemostasis","Immunity"]},{"name":"Cardiovascular","subs":["Cardiac cycle","ECG","Blood pressure regulation","Cardiac output"]},{"name":"Respiratory","subs":["Mechanics","Gas transport","Ventilation-perfusion","Regulation"]},{"name":"Renal","subs":["GFR & clearance","Tubular function","Acid-base"]},{"name":"Gastrointestinal","subs":["GI hormones","Secretions","Digestion & absorption"]},{"name":"Endocrine","subs":["Hormone mechanisms","Pituitary","Thyroid & adrenal","Calcium"]},{"name":"Reproductive","subs":["Male","Female","Pregnancy"]},{"name":"Neurophysiology","subs":["Sensory system","Motor system & reflexes","Sleep & EEG","Special senses"]}]},{"id":"bc","name":"Biochemistry","topics":[{"name":"Carbo <script>
"use strict";
// ---------- constants ----------
const GOAL = 35000;
const NEET = { sections: 5, perSection: 36, minutes: 42, plus: 4, minus: 1 }; // NEET-PG 2026 bulletin
const ICONS = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  subjects:'<path d="M4 5h6v14H4zM14 5h6v6h-6zM14 15h6v4h-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  test:'<circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9v4l3 2M9 2h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  revise:'<path d="M12 3l2.6 5.6L20 9.3l-4 4.1.9 5.6L12 16.3 7.1 19l.9-5.6-4-4.1 5.4-.7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  library:'<path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 4.5l3.8 1 -3.6 15-3.8-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
  stats:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  more:'<circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/>',
  plan:'<rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  pyq:'<path d="M4 19h16M6 16V9M11 16V5M16 16v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="6" r="2" fill="none" stroke="currentColor" stroke-width="2"/>'
};
const NAV = [["home","Home"],["subjects","Subjects"],["test","Tests"],["plan","Study plan"],["pyq","PYQ insights"],["revise","Revise"],["library","Build bank"],["stats","Progress"],["more","More"]];
const TABNAV = ["home","subjects","test","plan","more"];

// ---------- helpers ----------
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b) => b ? Math.round(100*a/b) : 0;
const fmt = n => Number(n).toLocaleString("en-IN");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const LS = {
  get(k, d){ try { const v = localStorage.getItem("pgq:"+k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem("pgq:"+k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem("pgq:"+k); } catch {} },
  keys(prefix){ try { return Object.keys(localStorage).filter(k=>k.startsWith("pgq:"+prefix)).map(k=>k.slice(4)); } catch { return []; } }
};
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 3200); }
function slug(s){ return s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }

// ---------- state ----------
const S = {
  tx: [], subj: {},                 // taxonomy
  Q: new Map(),                     // id -> question
  prog: {},                         // sid -> {r:{qid:[pick,ok,ts]}, b:{qid:1}, x:{qid:1}, f:{qid:note}}
  settings: { tier:"complex", strict:true, verify:true },
  pyq: null, plan: null,
  hist: [],                         // test history
  lib: [],                          // uploaded documents meta
  sess: null, run: null, result: null,
  cap: { db:null, uid:null, sample:null, assets:null, downloads:null, ready:false },
  openTopics: {}
};

// ---------- storage: claude db when available, else this browser ----------
const Store = {
  dirty: new Set(), timer: null, chain: Promise.resolve(),
  base(){ return S.cap.db && S.cap.uid ? `data/users/${S.cap.uid}` : null; },
  async getDoc(name){
    const b = this.base();
    if (b) { try { const s = await S.cap.db.doc(`${b}/${name}`).get(); return s.exists ? s.data() : null; } catch { return null; } }
    return LS.get("doc:"+name, null);
  },
  async setDoc(name, data){
    const b = this.base();
    LS.set("doc:"+name, data);
    if (b) await S.cap.db.doc(`${b}/${name}`).set(data);
  },
  // collections live under a per-user doc: data/users/<uid>/<parent>/<col>/<id>
  async list(parent, col){
    const b = this.base();
    if (b) { try { const snap = await S.cap.db.doc(`${b}/${parent}`).collection(col).limit(1000).get(); return snap.docs.map(d=>({id:d.id, ...d.data()})); } catch { return []; } }
    return LS.keys(`col:${parent}/${col}/`).map(k => ({ id: k.split("/").pop(), ...LS.get(k, {}) }));
  },
  async getIn(parent, col, id){
    const b = this.base();
    if (b) { try { const s = await S.cap.db.doc(`${b}/${parent}`).collection(col).doc(id).get(); return s.exists ? s.data() : null; } catch { return null; } }
    return LS.get(`col:${parent}/${col}/${id}`, null);
  },
  async put(parent, col, id, data){
    const b = this.base();
    if (b) await S.cap.db.doc(`${b}/${parent}`).collection(col).doc(id).set(data);
    else LS.set(`col:${parent}/${col}/${id}`, data);
  },
  async remove(parent, col, id){
    const b = this.base();
    if (b) await S.cap.db.doc(`${b}/${parent}`).collection(col).doc(id).delete();
    else LS.del(`col:${parent}/${col}/${id}`);
  },
  markProg(sid){ this.dirty.add(sid); clearTimeout(this.timer); this.timer = setTimeout(()=>this.flush(), 900); },
  flush(){
    const ids = [...this.dirty]; this.dirty.clear();
    for (const sid of ids) {
      const data = S.prog[sid];
      this.chain = this.chain.then(()=>this.setDoc("p-"+sid, data)).catch(e=>{
        if (e && e.code === "quota_exceeded") toast("Storage is full. Export a backup from More.");
      });

// ---------- data loading ----------
function prog(sid){ return S.prog[sid] || (S.prog[sid] = { r:{}, b:{}, x:{}, f:{} }); }
function addQuestion(q){
  if (!S.subj[q.s]) return false;
  const subj = S.subj[q.s];
  const topic = subj.topics.find(t => t.name === q.t) || null;
  if (!topic || !topic.subs.includes(q.st)) return false;
  if (!Array.isArray(q.o) || q.o.length !== 4 || !(q.a>=0 && q.a<4) || !q.q) return false;
  S.Q.set(q.id, q);
  return true;
}
// Data and images are packed into the page by build.py, because some viewers (the Claude iOS app) block fetching sibling files.
let BUNDLE = null;
try { BUNDLE = JSON.parse(document.getElementById("bundle")?.textContent || "null"); } catch {}
function getData(name){ return BUNDLE?.data?.[name] !== undefined ? Promise.resolve(BUNDLE.data[name]) : fetch("data/"+name).then(r=>r.json()); }
function imgSrc(p){ return BUNDLE?.img?.[p] || p; }
async function loadStatic(){
  const [tx, man] = await Promise.all([getData("taxonomy.json"), getData("manifest.json")]);
  S.tx = tx; tx.forEach(s => S.subj[s.id] = s);
  const files = await Promise.all(man.files.map(f => getData(f.file).then(qs=>({f, qs}))));
  for (const {f, qs} of files) qs.forEach((q,i) => addQuestion({ ...q, id: `${f.key}-${i}`, src: f.src || "seed" }));
  // explanation layers (option-wise reasons, mind map, walkthrough, source) keyed by question id
  const [enrich, pyq] = await Promise.all([
    Promise.all((man.enrich||[]).map(f => getData(f).catch(()=>({})))),
    man.pyq ? getData(man.pyq).catch(()=>null) : null
  ]);
  enrich.forEach(e => Object.entries(e).forEach(([id, x]) => applyEnrich(id, x)));
  S.pyq = pyq;
}
const RICH = ["w","mm","tb","steps","mn","ref","pyq"];
function applyEnrich(id, x){ const q = S.Q.get(id); if (!q || !x) return; for (const k of RICH) if (x[k] != null) q[k] = x[k]; }
function loadBatch(b){
  (b.qs || []).forEach((q,i) => addQuestion({ ...q, s: q.s || b.s, id: `g${b.id}-${i}`, src: b.src || "ai", img: q.img || (q.asset ? "/_blob/"+q.asset : undefined) }));
}
async function loadUser(){
  const subjIds = S.tx.map(s=>s.id);
  const [settings, hist, ...progs] = await Promise.all([Store.getDoc("settings"), Store.getDoc("hist"), ...subjIds.map(id=>Store.getDoc("p-"+id))]);
  if (settings) Object.assign(S.settings, settings);
  S.hist = hist?.items || [];
  subjIds.forEach((id,i) => { if (progs[i]) S.prog[id] = Object.assign({r:{},b:{},x:{},f:{}}, progs[i]); });
  const batches = (await Promise.all(subjIds.map(id => Store.list("bank", id)))).flat();
  batches.forEach(loadBatch);
  const enr = (await Promise.all(subjIds.map(id => Store.list("enr", id)))).flat();
  enr.forEach(e => applyEnrich(e.qid || e.id, e));
  S.lib = await Store.list("lib", "docs");
  S.plan = await Store.getDoc("plan");
}
async function initCaps(){
  if (!window.claude?.use) return;
  const [db, user, sample, assets, downloads] = await Promise.all(["db","user","sample","assets","downloads"].map(n => window.claude.use(n).catch(()=>null)));

// ---------- derived ----------
function visible(q){ return !prog(q.s).x[q.id]; }
function questionsWhere(fn){ const out=[]; for (const q of S.Q.values()) if (visible(q) && fn(q)) out.push(q); return out; }
function statsOf(qs){
  let att=0, cor=0;
  for (const q of qs){ const r = prog(q.s).r[q.id]; if (r){ att++; if (r[1]) cor++; } }
  return { n: qs.length, att, cor };
}
function subjectQs(sid){ return questionsWhere(q=>q.s===sid); }
function todayCount(){
  const t0 = new Date(); t0.setHours(0,0,0,0); let n=0;
  for (const sid in S.prog) for (const k in S.prog[sid].r) if (S.prog[sid].r[k][2] >= t0.getTime()) n++;
  return n;
}
function record(q, pick){
  const ok = pick === q.a;
  prog(q.s).r[q.id] = [pick, ok?1:0, Date.now()];
  Store.markProg(q.s);
  return ok;
}

function weakSubtopics(limit){

function orderUnattemptedFirst(qs){ const P = q => prog(q.s).r[q.id]; return [...shuffle(qs.filter(q=>!P(q))), ...shuffle(qs.filter(q=>P(q)))]; }
// Old NBE 300-question blueprint scaled to 180. Splits inside the Medicine group (me/de/ps) and Surgery group (su/or/as/ra) are estimates.
const MOCK_W = { an:10, ph:10, bc:10, pa:15, pm:12, mi:12, fm:6, cm:15, en:6, op:6, me:17, de:5, ps:5, su:15, or:5, as:4, ra:3, ob:18, pe:6 };
function pickMock(all, n){
  const by = {}; S.tx.forEach(s=>by[s.id]=[]); all.forEach(q=>by[q.s].push(q));
  for (const k in by) by[k] = orderUnattemptedFirst(by[k]);
  const out = [];
  for (const k in by){ const want = Math.round(MOCK_W[k]/180*n); out.push(...by[k].splice(0, want)); }
  // fill any shortfall (thin subjects) from whatever is left, round-robin
  let added = true;
  while (out.length < n && added){ added = false; for (const k in by){ if (by[k].length && out.length < n){ out.push(by[k].shift()); added = true; } } }
  return shuffle(out.slice(0, n));

function isDue(q){

  const r = prog(q.s).r[q.id]; if (!r) return false;
  const age = Date.now() - r[2];

}

function finishTest(){

const DAY = 864e5;
const dayStart = d => { const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); };
function buildPlan({ exam, hours, weak }){
  const start = dayStart(Date.now()), end = dayStart(exam);
  const days = Math.max(14, Math.round((end - start)/DAY));
  const p1 = Math.round(days*0.55), p2 = Math.round(days*0.30);
  // phase 1 blocks: every subject, days in proportion to exam weight, weak subjects get 30% extra
  const w = S.tx.map(s => ({ sid:s.id, w: MOCK_W[s.id] * (weak.includes(s.id) ? 1.3 : 1) }));
  const tot = w.reduce((a,b)=>a+b.w,0);
  let alloc = w.map(x => ({ sid:x.sid, d: Math.max(1, Math.round(x.w/tot*p1)) }));
  // order: high-priority subjects first, weak ones before strong ones within a priority
  const pri = sid => (S.pyq?.subjects?.[sid]?.pri || 1) + (weak.includes(sid) ? 0.5 : 0);
  alloc.sort((a,b) => pri(b.sid) - pri(a.sid));
  const blocks = []; let cur = start;
  for (const a of alloc){ blocks.push({ sid:a.sid, from:cur, to:cur + a.d*DAY - 1, phase:"Cover" }); cur += a.d*DAY; }
  const p1end = cur;
  // phase 2: rotate through subjects again, faster
  const r2 = Math.max(1, Math.floor(p2 / S.tx.length));
  for (const a of alloc){ if (cur >= end) break; blocks.push({ sid:a.sid, from:cur, to:cur + r2*DAY - 1, phase:"Revise" }); cur += r2*DAY; }
  return { exam:end, start, hours, weak, blocks, p1end, p3start: cur, created: Date.now() };
}
function planToday(){
  const P = S.plan; if (!P || !P.blocks) return null;
  const now = dayStart(Date.now()); const daysLeft = Math.max(0, Math.round((P.exam - now)/DAY));
  const target = Math.max(20, Math.round((P.hours||6) * 15));
  const dow = new Date().getDay();
  if (now >= P.p3start){
    // final phase: grand test every third day, weakest subject on the others
    const weak = weakSubtopics(1)[0];
    const sid = weak?.s || P.weak?.[0] || "me";
    return { sid, focus: weak?.st || "", phase:"Final tests", target, daysLeft, test: daysLeft % 3 === 0 ? "Grand test" : "" };
  }
  const b = P.blocks.find(x => now >= x.from && now <= x.to) || P.blocks[P.blocks.length-1];
  const s = S.subj[b.sid];
  // walk subtopics in order across the block's days
  const subs = s.topics.flatMap(t => t.subs.map(st => `${t.name} › ${st}`));
  const span = Math.max(1, Math.round((b.to - b.from + 1)/DAY)); const idx = Math.round((now - b.from)/DAY);
  const per = Math.ceil(subs.length / span);
  const focus = subs.slice(idx*per, idx*per+per).slice(0,2).join(", ");
  return { sid: b.sid, focus, phase: b.phase==="Cover" ? "Cover all subjects" : "Revision", target, daysLeft, test: dow===0 ? (b.phase==="Cover" ? "Mini mock" : "Grand test") : "" };
}

    const o = Array.isArray(x.o) ? x.o.map(String) : []; const a = Number(x.a);

    const q = { s:sid, t, st, q:String(x.q), o, a, e:String(x.e||""), p:String(x.p||""), hy:Math.max(1,Math.min(3,Number(x.hy)||2)) };
    if (Number(x.conf) < 0.85) q.verify = 1;
    if (x.img) q.img = x.img; if (x.asset) q.asset = x.asset; if (x.credit) q.credit = x.credit;
    out.push(Object.assign(q, cleanRich(x)));
  }
  return out;
}
async function saveBatch(sid, qs, src){
  const id = rid();
  const b = { s:sid, src, created:Date.now(), qs };
  await Store.put("bank", sid, id, b);

let genCtl = null;
async function runGen({ prompt, sid, src, fixed, images, status, btn, patch }){
  const sample = S.cap.sample; if (!sample){ status.className="note warn"; status.textContent = "Generation works when this page is opened on claude.ai (it uses your Claude account)."; return; }
  genCtl = new AbortController(); btn.disabled = true; status.className = "note"; status.textContent = "Thinking… (good questions take 30-90 seconds)";
  const stop = document.createElement("button"); stop.className="btn sm"; stop.textContent="Stop"; stop.onclick=()=>genCtl.abort(); btn.after(stop);
  try {
    const opts = { modelTier: S.settings.tier, signal: genCtl.signal, cache:false,
      onText: ({text}) => { const n = (text.match(/"q"\s*:/g)||[]).length; status.textContent = `Writing… ${n} question${n===1?"":"s"} so far`; } };
    if (images) opts.images = images;
    const arr = await sample.json(prompt, opts);
    let qs = cleanGenerated(arr, sid, src, fixed);
    if (patch) qs = qs.map(patch);
    if (!qs.length){ status.className="note bad"; status.textContent = "No usable questions came back. Try again, or add a hint about what the material shows."; return; }
    qs = await verifyBatch(qs, status);
    const bid = await saveBatch(sid, qs, src);
    const flagged = qs.filter(q=>q.verify).length;
    status.className = "note good"; status.innerHTML = `Added ${qs.length} questions to ${esc(S.subj[sid].name)}.${flagged?` ${flagged} marked VERIFY (Claude was less sure).`:""} <a href="#" class="pnow">Practise them now</a>`;
    $(".pnow", status).onclick = (e) => { e.preventDefault(); startSession("New questions", qs.map((_,i)=>S.Q.get(`g${bid}-${i}`)).filter(Boolean)); };
    return qs.length;
  } catch (e) {
    status.className = "note bad"; status.textContent = sampleError(e);
    if (e?.code === "quota_exceeded") status.textContent = "Your saved bank is full. Export a backup from More, then remove old batches.";
  } finally { btn.disabled = false; stop.remove(); }
}

let pdfReady = null;
function loadScript(src){ return new Promise((res, rej) => { const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.append(s); }); }
async function pdfText(file, onProgress){
  pdfReady ||= (async () => {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  })();
  await pdfReady;
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  let out = "";
  for (let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p); const tc = await page.getTextContent();
    out += tc.items.map(i=>i.str + (i.hasEOL?"\n":" ")).join("") + "\n\n";
    if (p%5===0 || p===pdf.numPages) onProgress({ page:p, pages:pdf.numPages });
  }
  return out;
}
function downscale(file, max, quality=0.86){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(b => b?res(b):rej(), "image/jpeg", quality); };
    img.onerror = rej; img.src = url;
  });
}
function blobToDataURL(b){ return new Promise(res => { const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); }); }

      for (const b of d.batches||[]){ if (!S.subj[b.s]) continue; const { id, ...body } = b; const nid = id || rid(); if (![...S.Q.keys()].some(k=>k.startsWith(`g${nid}-`))){ await Store.put("bank", b.s, nid, body); loadBatch({ id:nid, ...body }); nb++; } }
      for (const sid in d.prog||{}){ const P = prog(sid), Q = d.prog[sid]; for (const k of ["r","b","x","f"]) Object.assign(P[k], Q[k]||{}); Store.markProg(sid); }
      if (Array.isArray(d.hist)){ S.hist = [...S.hist, ...d.hist.filter(h=>!S.hist.some(x=>x.at===h.at))].sort((a,b)=>a.at-b.at); Store.setDoc("hist",{items:S.hist}).catch(()=>{}); }
      st.className="note good"; st.textContent = `Restored ${nb} question batches and your progress.`;
    } catch { st.className="note bad"; st.textContent="That file isn't a backup from this app."; }
  };
};

// ---------- boot ----------
(async function boot(){
  $("#view").innerHTML = `<p class="muted">Loading your bank…</p>`;
  try { await loadStatic(); } catch { $("#view").innerHTML = `<p class="note bad">The question files didn't load. Reload the page.</p>`; return; }
  try { const cached = LS.get("doc:settings", null); if (cached) Object.assign(S.settings, cached); } catch {}
  // local cache first so the page is usable at once
  S.tx.forEach(s => { const p = LS.get("doc:p-"+s.id, null); if (p) S.prog[s.id] = Object.assign({r:{},b:{},x:{},f:{}}, p); });
  render();
  await initCaps();
  try { await loadUser(); } catch {}
  if (!["run","practice"].includes((location.hash.slice(1)||"home").split("-")[0])) render();
})();
</script>
