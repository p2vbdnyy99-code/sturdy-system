["Rising ETCO2 = ROSC"]}]},"steps":["Only exhaled CO2 proves tracheal placement.","Look for a sustained waveform.","Clinical signs can mislead.","During CPR a rise suggests ROSC."]},"s1-143":{"pyq":1,"ref":"AHA BLS/ACLS guidelines","w":["Correct. 100-120 compressions per minute.","60-80 is too slow.","80-100 is too slow.","120-150 is too fast."],"mm":{"c":"High-quality CPR","n":[{"t":"Rate","k":["100-120/min"]},{"t":"Depth","k":["5-6 cm"]},{"t":"Ratio","k":["30:2"]},{"t":"Other","k":["Full recoil","Minimal interruptions"]}]},"steps":["Rate: 100-120 per minute.","Depth: 5-6 cm.","Allow full recoil.","30:2 without an advanced airway."]},"s1-144":{"pyq":1,"ref":"Khan's Physics of Radiation Therapy; Hall's Radiobiology","w":["Correct. G2/M is the most radiosensitive phase.","Late S phase is the most radioresistant.","G1 is intermediate.","G0 is resting and relatively resistant."],"mm":{"c":"Radiosensitivity","n":[{"t":"Most sensitive","k":["G2/M"]},{"t":"Most resistant","k":["Late S"]},{"t":"Law","k":["Bergonié-Tribondeau"]},{"t":"4 Rs","k":["Repair","Reoxygenation","Redistribution","Repopulation"]}]},"steps":["Cells are most vulnerable when dividing.","G2/M is the peak.","Late S phase is the most resistant.","Fractionation exploits redistribution."]},"s1-145":{"pyq":1,"ref":"Harrison's; Grainger & Allison's Diagnostic Radiology","w":["Correct. Non-contrast CT is the first investigation for acute SAH.","Contrast MRI is not first-line in the emergency.","DSA locates aneurysms after diagnosis.","LP is done if CT is negative."],"mm":{"c":"Subarachnoid haemorrhage","n":[{"t":"Symptom","k":["Thunderclap headache"]},{"t":"First test","k":["NCCT head"]},{"t":"If CT negative","k":["LP: xanthochromia"]},{"t":"Then","k":["CTA or DSA"]},{"t":"Drug","k":["Nimodipine"]}]},"steps":["Sudden worst headache.","First: non-contrast CT.","If negative: lumbar puncture.","Then angiography for the aneurysm."]},"s1-146":{"ref":"Khan's Physics of Radiation Therapy; ICRP recommendations","w":["Correct. Sievert is the unit of equivalent and effective dose.","Gray is the unit of absorbed dose.","Becquerel is the unit of radioactivity.","Roentgen is an old unit of exposure."],"mm":{"c":"Radiation units","n":[{"t":"Gray","k":["Absorbed dose","1 J/kg"]},{"t":"Sievert","k":["Equivalent/effective dose"]},{"t":"Becquerel","k":["Activity"]},{"t":"Limits","k":["Worker: 20 mSv/yr","Public: 1 mSv/yr"]}]},"steps":["Absorbed dose = gray.","Biological effect = sievert.","Activity = becquerel.","Limits are in mSv."]},"s1-147":{"pyq":1,"ref":"Grainger & Allison's Diagnostic Radiology","w":["Correct. Bat-wing perihilar opacity is classic for pulmonary oedema.","Pneumothorax shows a lucent area without lung markings.","Miliary TB shows fine nodules.","Bronchiectasis shows tram lines and ring shadows."],"mm":{"c":"Pulmonary oedema on CXR","n":[{"t":"Signs","k":["Bat wing","Upper lobe diversion","Kerley B lines","Cardiomegaly","Effusions"]},{"t":"Mnemonic","k":["ABCDE"]}]},"steps":["Bilateral perihilar opacity.","Bat-wing pattern.","Classic for alveolar pulmonary oedema.","Look for other heart failure signs."],"mn":"CXR heart failure 'ABCDE': Alveolar oedema, Kerley B lines, Cardiomegaly, Dilated upper vessels, Effusion."},"s1-148":{"pyq":1,"ref":"Grainger & Allison's Diagnostic Radiology; Bailey & Love","w":["Correct. Erect chest X-ray is the best plain film for free air.","Supine film is less sensitive.","Lateral cervical spine X-ray is irrelevant.","Prone film is not used."],"mm":{"c":"Pneumoperitoneum","n":[{"t":"Best plain film","k":["Erect CXR"]},{"t":"Most sensitive","k":["CT"]},{"t":"If cannot stand","k":["Left lateral decubitus"]},{"t":"Supine sign","k":["Rigler's sign"]}]},"steps":["Free air rises.","Erect chest film shows it under the diaphragm.","As little as 1-2 mL can be seen.","CT is most sensitive overall."]},"s1-149":{"pyq":1,"ref":"Grainger & Allison's Diagnostic Radiology; Harrison's","w":["Correct. MRI is the most sensitive early test for osteomyelitis.","X-ray changes take 10-14 days.","Ultrasound is limited for bone.","CT is better for sequestra later."],"mm":{"c":"Osteomyelitis imaging","n":[{"t":"Earliest","k":["MRI"]},{"t":"X-ray","k":["10-14 days"]},{"t":"Terms","k":["Sequestrum","Involucrum"]},{"t":"Organism","k":["Staph aureus","Salmonella in sickle cell"]}]},"steps":["Early bone infection = marrow oedema.","MRI detects it within days.","X-ray changes come later.","Staph aureus is the commonest cause."]},"s1-150":{"ref":"Grainger & Allison's Diagnostic Radiology","w":["Correct. Tc-99m half-life is about 6 hours.","6 days is too long.","8 days is the half-life of I-131.","110 minutes is the half-life of F-18."],"mm":{"c":"Isotope half-lives","n":[{"t":"Tc-99m","k":["6 h","140 keV"]},{"t":"I-131","k":["8 days"]},{"t":"F-18","k":["110 min"]},{"t":"Source","k":["Mo-99 generator"]}]},"steps":["Tc-99m is the workhorse isotope.","Its half-life is 6 hours.","It emits 140 keV gamma rays.","Made from a Mo-99 generator."]},"s1-151":{"pyq":1,"ref":"Grainger & Allison's Diagnostic Radiology; Bailey & Love","w":["Correct. Coffee bean sign = sigmoid volvulus.","Caecal volvulus points to the left upper quadrant.","SBO shows central loops with valvulae.","Intussusception shows target sign on USG."],"mm":{"c":"Sigmoid volvulus","n":[{"t":"Sign","k":["Coffee bean","Bird's beak on enema"]},{"t":"Who","k":["Elderly","Constipated"]},{"t":"Treatment","k":["Endoscopic decompression","Elective resection"]}]},"steps":["Dilated inverted-U loop from the pelvis.","Coffee bean sign.","Sigmoid volvulus.","Decompress endoscopically first."]},"i1-0":{"pyq":1,"ref":"Ghai Essential Pediatrics; Nelson","w":["Correct. Koplik spots with prodromal 3 Cs = measles.","Hand, foot and mouth disease has vesicles on hands and feet.","Herpetic gingivostomatitis has painful gingival ulcers.","Candida plaques can be scraped off."],"mm":{"c":"Measles image clue","n":[{"t":"Look","k":["White spots on red base","Opposite molars"]},{"t":"Timing","k":["Before rash"]},{"t":"Treatment","k":["Vitamin A"]}]},"steps":["See white spots on buccal mucosa.","With fever and 3 Cs.","These are Koplik spots.","Diagnosis: measles."]},"i1-1":{"pyq":1,"ref":"Bailey & Love's Short Practice of Surgery","w":["Correct. Perforated peptic ulcer is the commonest cause of spontaneous pneumoperitoneum.","Sigmoid perforation causes free air but less often.","Pancreatitis causes fluid, not free air.","Ruptured ectopic causes haemoperitoneum."],"mm":{"c":"Free gas under diaphragm","n":[{"t":"Commonest","k":["Perforated peptic ulcer"]},{"t":"Others","k":["Diverticular perforation","Post-surgery"]},{"t":"Imaging","k":["Erect CXR","CT most sensitive"]}]},"steps":["Image shows free intraperitoneal gas.","Without trauma or surgery.","Commonest cause: perforated peptic ulcer.","Urgent surgical repair."]},"i1-2":{"pyq":1,"ref":"Grainger & Allison's Diagnostic Radiology","w":["Correct. Coffee bean loop from the pelvis = sigmoid volvulus.","Caecal volvulus points to the LUQ.","SBO shows multiple central loops.","Paralytic ileus shows diffuse dilatation."],"mm":{"c":"Volvulus on X-ray","n":[{"t":"Sigmoid","k":["Coffee bean","From pelvis"]},{"t":"Caecal","k":["Points LUQ"]},{"t":"Treatment","k":["Flatus tube","Resection"]}]},"steps":["Massive inverted-U loop.","Arises from pelvis.","Coffee bean sign.","Sigmoid volvulus."]},"i1-3":{"pyq":1,"ref":"IADVL Textbook of Dermatology; Khurana","w":["Correct. Forehead and upper lid dermatome = ophthalmic division (V1).","Maxillary division covers cheek and upper lip.","Facial nerve is motor.","Greater occipital nerve covers the back of the scalp."],"mm":{"c":"Zoster dermatome","n":[{"t":"V1","k":["Forehead","Upper lid","Nose tip"]},{"t":"Risk","k":["Eye involvement"]},{"t":"Treatment","k":["Antivirals within 72 h"]}]},"steps":["Rash on forehead and upper lid.","Stops at the midline.","Follows V1 dermatome.","Herpes zoster ophthalmicus."]}},"manifest.json":{"files":[{"key":"s1","file":"seed-1.json","src":"seed"},{"key":"i1","file":"seed-img-1.json","src":"seed"}],"enrich":["enrich-1.json","enrich-2.json","enrich-3.json"],"pyq":"pyq.json"},"pyq.json":{"meta":{"updated":"2026-10-27","pattern":"NEET-PG 2026 (NBEMS bulletin, 1 Jul 2026): 180 MCQs, 5 sections × 36, 42 min each, sections lock, +4 / −1. The NEET-PG 2027 bulletin is not out yet (expected mid-2027); reports expect the 2026 structure to continue.","official":"NBEMS does not publish the question paper or a subject-wise question count. All PYQ data below comes from memory-based recalls compiled by coaching platforms and candidates.","trends":["Clinical, application-based questions dominate; long vignettes with close options (2025 and 2026 reports).","Repeats: coaching analyses of 2023-2025 claim about 30% of questions are direct or modified repeats of earlier topics.","Image questions vary a lot by year: about 18-25% claimed for 2025 by PrepLadder (about 50% by another recall blog), but candidates reported very few image questions in 2026.","Video questions: none reported in NEET PG 2026.","Basic sciences are increasingly asked inside clinical scenarios (nerve injuries, enzyme defects, applied physiology)."],"imageSources":"NBEMS does not say where images come from. Reports describe classic, textbook-style images: ECGs, peripheral smears, chest and bone X-rays, CT, CTG and obstetric USG, histopathology slides, gross specimens, clinical photographs (skin, eye, ENT), instruments and specimens. Practise recognising the classic appearance of each, not rare variants.","sources":[{"tag":"NBEMS","what":"NEET-PG 2026 Information Bulletin: pattern and marking"},{"tag":"Blueprint","what":"Older NBE 300-question syllabus weightage (reproduced by DigiNerve, Nov 2025), scaled here to 180"},{"tag":"PL","what":"PrepLadder, Most Expected Topics for NEET PG 2026 (PYQ analysis 2023-2025)"},{"tag":"MEP","what":"MedExamsPrep, NEET PG 2025 recall analysis (its table totals 195 of 200, so treat as approximate)"},{"tag":"Fornix","what":"Fornix Academy, NEET PG 2026 exam analysis (31 Aug 2026)"}]},"subjects":{"an":{"bp":"10","rr":"9 (MEP 2025)","pri":2,"img":"Cross-sectional anatomy, nerve-injury hand/limb postures, surface anatomy photos, CT/MRI landmarks","hot":[["Upper Limb","Nerve injuries","Nerve injury with fracture site; claw hand, wrist drop, ape thumb; Erb and Klumpke palsy"],["Upper Limb","Brachial plexus","Roots, trunks, cords; branches and their muscles"],["Lower Limb","Gluteal region & hip","Trendelenburg sign; gluteal injection site; hip blood supply"],["Lower Limb","Knee, leg & foot","Foot drop; knee ligaments and menisci; arches of the foot"],["Head & Neck","Cranial nerves","Cranial nerve lesions, nuclei, foramina"],["Head & Neck","Larynx & pharynx","Laryngeal nerves and muscles; piriform fossa"],["Neuroanatomy","Brainstem","Brainstem syndromes (medial/lateral medullary, Weber); INO"],["Neuroanatomy","Blood supply & ventricles","Circle of Willis; artery-territory strokes"],["General Anatomy & Embryology","Pharyngeal arches","Arch derivatives and nerves; pouch derivatives"],["Thorax","Heart & coronaries","Coronary dominance; venous drainage; conduction system supply"]],"how":"Learn every nerve as a clinical picture: site of injury → muscles lost → deformity → sensory loss. Use diagrams and cross-sections, and solve image questions.","skip":"Detailed origins and insertions of minor muscles, and rare embryological anomalies, beyond the classic ones."},"ph":{"bp":"10","rr":"5 (MEP 2025)","pri":2,"img":"ECG strips, pressure-volume loops, O2 dissociation curve, spirometry graphs","hot":[["Cardiovascular","Cardiac cycle","JVP waves; heart sounds; pressure-volume loops"],["Cardiovascular","ECG","Normal intervals; axis"],["Respiratory","Gas transport","O2 dissociation curve shifts; CO poisoning"],["Respiratory","Mechanics","Lung volumes, compliance, surfactant"],["Renal","GFR & clearance","Clearance concepts, inulin/PAH, filtration fraction"],["Renal","Acid-base","ABG interpretation, anion gap"],["Endocrine","Hormone mechanisms","Receptor and second-messenger types"],["Nerve & Muscle","Action potential","Ion channels, refractory periods"],["Neurophysiology","Sleep & EEG","Sleep stages and EEG waves"],["Neurophysiology","Sensory system","Receptors, tracts, pain pathways"]],"how":"Understand graphs (cardiac cycle, O2 curve, pressure-volume loops) well enough to redraw them. Most questions are applied: what happens to X when Y changes.","skip":"Historical experiments, and numerical values that are never clinically used."},"bc":{"bp":"10","rr":"15 (MEP 2025)","pri":2,"img":"Electrophoresis patterns, chromatography, clinical photos of metabolic disease","hot":[["Carbohydrate Metabolism","Glycogen storage diseases","GSD types with enzyme and key feature"],["Amino Acid Metabolism","Urea cycle","Urea cycle defects; orotic aciduria"],["Amino Acid Metabolism","Aminoacidopathies","PKU, alkaptonuria, homocystinuria, MSUD"],["Lipid Metabolism","Lipid storage disorders","Gaucher, Niemann-Pick, Tay-Sachs, Fabry"],["Lipid Metabolism","Cholesterol & lipoproteins","Lipoprotein disorders; statin target"],["Vitamins & Minerals","Water-soluble vitamins","Thiamine, B12, folate deficiency and tests"],["Vitamins & Minerals","Fat-soluble vitamins","Vitamin A, D, K functions and deficiency"],["Molecular Biology","Techniques","PCR types, blotting, CRISPR, microarray"],["Nucleotide Metabolism","Purines","Lesch-Nyhan, gout, ADA deficiency"],["Enzymes","Enzyme kinetics","Inhibition types and Km/Vmax"]],"how":"Learn each disorder as enzyme → blocked step → what accumulates → clinical clue. Make one table per pathway.","skip":"Full structural formulas, and every intermediate of long pathways (learn the rate-limiting and regulated steps)."},"pa":{"bp":"15","rr":"15-20 (PL)","pri":3,"img":"Histopathology slides, gross specimens, peripheral smears, bone marrow","hot":[["General Pathology","Neoplasia","Oncogenes and tumour suppressors; tumour markers; psammoma bodies"],["General Pathology","Cell injury","Reversible vs irreversible injury; necrosis types; apoptosis"],["General Pathology","Inflammation","Mediators; chemotaxis; granuloma"],["General Pathology","Immunopathology & amyloidosis","Amyloid types and stains"],["Haematology","Leukaemias","AML M3 t(15;17); CML t(9;22); cytochemistry"],["Haematology","Lymphomas","Follicular t(14;18), Burkitt t(8;14), Hodgkin RS cells"],["Haematology","Anaemias","Peripheral smear findings; HS; thalassaemia vs iron deficiency"],["Haematology","Bleeding disorders","PT/aPTT interpretation; DIC"],["Systemic Pathology","Kidney","Glomerular diseases on EM/IF"],["Systemic Pathology","GIT & liver","IBD; hepatitis; PBC (AMA)"]],"how":"Pair every disease with its image (slide or smear) and its genetic or marker association. Practise image questions on slides and smears.","skip":"Rare tumour subtypes and grading minutiae beyond what has been asked before."},"pm":{"bp":"12","rr":"15 (MEP 2025)","pri":3,"img":"Rarely image-based; occasionally drug-reaction photos (SJS, gum hypertrophy)","hot":[["Chemotherapy","Antibacterials","Mechanisms and toxicities (aminoglycosides, vancomycin, fluoroquinolones)"],["Chemotherapy","Antitubercular","ATT adverse effects; MDR-TB regimens"],["Chemotherapy","Antifungal & antiviral","Azoles vs amphotericin; HIV and hepatitis drugs"],["Cardiovascular & Renal","Heart failure","Guideline-directed HF therapy; SGLT2 inhibitors"],["Cardiovascular & Renal","Antihypertensives","Drug choice by comorbidity; contraindications"],["CNS","Antiepileptics","Drug of choice by seizure type; teratogenicity"],["Autonomic Nervous System","Cholinergic drugs","Organophosphate poisoning; atropine, oximes"],["Blood","Anticoagulants & antiplatelets","Antidotes; DAPT"],["General Pharmacology","Pharmacokinetics","Zero-order kinetics; half-life; bioavailability"],["Endocrine","Antidiabetics","Metformin, SGLT2, GLP-1 actions and side effects"]],"how":"Learn drug of choice, mechanism, signature adverse effect and antidote for each group. Recent guideline changes are asked often.","skip":"Exact doses (except a few classic ones such as MgSO4 regimens), and brand names."},"mi":{"bp":"12","rr":"15-18 (PL)","pri":3,"img":"Gram/ZN stains, culture plates and colony morphology, fungal KOH mounts, parasite eggs and smears","hot":[["General Microbiology","Culture media","Specific media for specific organisms (highest-yield per PL)"],["General Microbiology","Sterilisation & disinfection","Biological indicators; autoclave"],["Bacteriology","Gram-positive cocci","Staph vs Strep tests (CAMP, bacitracin, optochin)"],["Bacteriology","Gram-negative bacteria","Enterobacteriaceae, Pseudomonas"],["Bacteriology","Mycobacteria","TB diagnosis (CBNAAT), NTM, leprosy"],["Virology","Hepatitis viruses","HBV serology interpretation"],["Virology","HIV","Window period, diagnosis, viral load"],["Mycology","Opportunistic mycoses","Aspergillus vs Mucor hyphae; Candida"],["Parasitology","Helminths","Egg identification; cysticercosis; hydatid"],["Immunology","Hypersensitivity","Hypersensitivity types with examples"]],"how":"Image-heavy subject: learn the look of each stain, colony, hypha and egg. Tabulate media, special tests and serology.","skip":"Taxonomy history, and rare organisms without a classic clinical picture."},"fm":{"bp":"6","rr":"5-8 (PL)","pri":1,"img":"Injury photos (bruise ageing, firearm wounds, ligature marks), poisonous plants and snakes, weapons, skull and bone","hot":[["Thanatology","Postmortem changes","Rigor, livor, algor mortis; adipocere, mummification"],["Asphyxial Deaths","Hanging & strangulation","Hanging vs strangulation features"],["Asphyxial Deaths","Drowning","Diatom test; signs of drowning"],["Injuries","Firearm injuries","Range of fire; entry vs exit"],["Toxicology","Plant & animal poisons","Dhatura, oleander, snake bite"],["Toxicology","Metallic poisons","Arsenic, lead, mercury signs"],["Identification","Age estimation","Ossification and teeth"],["Legal Medicine & Ethics","Legal procedures","BNS/BNSS eal abscess"],["Larynx","Vocal cord lesions","Nerve palsies and cord positions"]],"how":"Learn instruments and the classic otoscopy and audiogram images. Short subject, high return per hour.","skip":"Operative step-by-step details of rare surgeries."},"op":{"bp":"6","rr":"8-10 (PL)","pri":2,"img":"Fundus photos, slit-lamp images, visual-field charts, squint photos","hot":[["Retina","Retinal vascular disease","CRAO, CRVO, hypertensive retinopathy fundus"],["Retina","Diabetic retinopathy","Grading and management"],["Glaucoma","Angle closure","Acute angle closure; drugs to avoid"],["Uvea","Uveitis","Anterior uveitis signs; HLA-B27"],["Neuro-ophthalmology","Visual pathway","Field defects by lesion site"],["Neuro-ophthalmology","Pupil","RAPD, Argyll Robertson, Horner"],["Conjunctiva & Cornea","Keratitis","Fungal vs bacterial keratitis"],["Lens","Cataract","Types and surgery"]],"how":"Image-driven subject: learn the classic fundus and slit-lamp pictures. Draw the visual pathway with each lesion's field defect.","skip":"Detailed optics calculations beyond the basics."},"me":{"bp":"27 incl. Derm and Psych (Blueprint)","rr":"25-30 (PL)","pri":3,"img":"ECGs, chest X-rays, peripheral smears, CT brain, clinical signs","hot":[["Cardiology","Arrhythmias","ECG diagnosis; AF, heart blocks, SVT management"],["Cardiology","Ischaemic heart disease","STEMI recognition and management"],["Cardiology","Heart failure","Guideline-directed medical therapy"],["Respiratory","Pneumonia","CURB-65, CAP antibiotics; ARDS ventilation"],["Gastroenterology & Hepatology","Liver","Cirrhosis scoring, variceal bleeding, SAAG"],["Nephrology","Electrolytes","Hyponatraemia algorithm, hyperkalaemia"],["Endocrinology","Adrenal","Addison disease, Cushing, phaeochromocytoma"],["Endocrinology","Diabetes","DKA management"],["Infectious Diseases","HIV & opportunistic","IRIS, ART timing in TB"],["Infectious Diseases","Tropical infections","Dengue warning signs, malaria"],["Haematology","Anaemia","Smear-based diagnosis"],["Rheumatology","Arthritis","RA, gout, spondyloarthritis"]],"how":"Think in management algorithms (first step, drug of choice, next best step). Learn ECG and X-ray patterns from images. Follow the current guideline versions.","skip":"Rare syndromes with no exam history, and outdated treatment regimens."},"su":{"bp":"27 incl. Ortho, Anaes and Radio (Blueprint)","rr":"18 (MEP 2025)","pri":3,"img":"Abdominal X-rays, CT abdomen, clinical photos (swellings, ulcers), instruments","hot":[["GI Surgery","Small & large bowel","Intestinal obstruction on X-ray; volvulus"],["Hepatobiliary & Pancreas","Gallbladder & biliary","Cholecystitis, cholangitis, Courvoisier law"],["Trauma","Head injury","GCS; EDH vs SDH; diffuse axonal injury"],["Trauma","Abdominal trauma","FAST vs CT; organ injury"],["GI Surgery","Anorectal","Fistula-in-ano (Parks, Goodsall), fissure, haemorrhoids"],["GI Surgery","Hernia","Types and repairs"],["Breast & Endocrine","Breast","Triple assessment; breast cancer management"],["Breast & Endocrine","Thyroid","Thyroid cancers and surgery complications"],["General Surgery","Burns","Parkland formula; rule of nines"],["Urology","Testis","Torsion and other urological emergencies"]],"how":"Combine anatomy, imaging and the decision (operate or not). Learn named signs and laws with their meaning. Practise X-ray and CT recognition.","skip":"Detailed operative steps of rarely asked procedures, and instrument trivia beyond the common ones."},"ob":{"bp":"18","rr":"25-30 (PL); 20 (MEP 2025)","pri":3,"img":"CTG traces, obstetric USG, partograph, instruments, specimens","hot":[["Obstetrics","Postpartum haemorrhage","Atonic PPH steps; uterotonics; Bakri balloon (every year per PL)"],["Obstetrics","Hypertensive disorders","Pre-eclampsia criteria, HELLP, MgSO4 regimens"],["Obstetrics","Labour","Partograph, shoulder dystocia (McRoberts), cord prolapse, CTG"],["Obstetrics","Antenatal care","IUGR, Doppler, screening tests"],["Obstetrics","Ectopic & abortion","Ectopic diagnosis and methotrexate criteria"],["Gynaecology","Menstrual disorders & PCOS","AUB evaluation, PCOS, POI (high FSH, low AMH)"],["Gynaecology","Contraception","Methods, contraindications, emergency contraception"],["Gynaecology","Gynae oncology","Cervical screening, staging, ovarian tumour markers"],["Gynaecology","Fibroids & endometriosis","Adenomyosis on MRI; fibroid management"]],"how":"Learn emergencies as stepwise algorithms. CTG and USG images are frequent. One of the highest-weight subjects in recent recalls.","skip":"Rare congenital anomalies of the genital tract beyond the classic ones."},"pe":{"bp":"6","rr":"5 (MEP 2025)","pri":2,"img":"Clinical photos of syndromes and rashes, growth charts, X-rays (e.g. rickets)","hot":[["Growth & Development","Milestones","Milestones by age (every year per PL)"],["Infections & Immunisation","Immunisation","National schedule (every year per PL)"],["Neonatology","Neonatal resuscitation & sepsis","Apgar, NRP, early vs late-onset sepsis"],["Neonatology","Neonatal jaundice","Physiological vs pathological"],["Infections & Immunisation","Exanthems","Measles, rubella and other rash illnesses"],["Nutrition","Malnutrition","SAM criteria and management"],["Paediatric Cardiology","Congenital heart disease","TOF, VSD, PDA features"],["Genetics & Syndromes","Chromosomal disorders","Down, Turner, Klinefelter"]],"how":"Milestones and the immunisation schedule appear almost every year: learn them cold. Use photos for syndromes and rashes.","skip":"Rare inborn errors already covered in Biochemistry."},"or":{"bp":"(within Surgery group)","rr":"8-10 (PL)","pri":2,"img":"Fracture X-rays, bone-tumour X-rays, clinical deformity photos","hot":[["Upper Limb Trauma","Elbow & forearm","Supracondylar fracture; Monteggia vs Galeazzi"],["Lower Limb Trauma","Hip & femur","Neck of femur fractures, Garden classification"],["Bone Tumours","Benign","GCT, osteochondroma, osteoid osteoma"],["Bone Tumours","Malignant","Osteosarcoma vs Ewing on X-ray"],["Peripheral Nerve Injuries","Upper limb nerves","Nerve injury with fracture"],["Paediatric Orthopaedics","CTEV & DDH","Ponseti method; DDH tests"],["Infections & Spine","Tuberculosis of spine","Pott spine"]],"how":"X-ray recognition is key: learn the classic fracture and tumour images. Use eponyms with their pictures.","skip":"Implant brand details and complex fixation techniques."},"de":{"bp":"(within Medicine group)","rr":"8-10 (PL); 8 (MEP 2025)","pri":2,"img":"Clinical photographs of classic lesions (per PL)","hot":[["Papulosquamous Disorders","Psoriasis","Signs (Auspitz, Koebner) and treatment"],["Papulosquamous Disorders","Lichen planus","6 Ps; Wickham striae"],["Vesiculobullous Disorders","Pemphigus & pemphigoid","Antigens and immunofluorescence"],["Infections & Infestations","Fungal","Tinea types and treatment"],["Infections & Infestations","Scabies & lice","Scabies treatment"],["Leprosy","Classification & treatment","Cardinal signs; WHO MDT"],["STIs","Syphilis","Stages and tests"]],"how":"Almost entirely photo recognition: go through a good image atlas repeatedly. Pair each lesion with one sign and one drug.","skip":"Rare genodermatoses."},"ps":{"bp":"(within Medicine group)","rr":"5-8 (PL)","pri":1,"img":"Rarely image-based","hot":[["Psychotic Disorders","Schizophrenia","Schneider first-rank symptoms; treatment"],["Mood Disorders","Bipolar disorder","Lithium and its toxicity"],["Psychopharmacology & Therapies","Antipsychotics","Clozapine monitoring; NMS vs serotonin syndrome"],["Substance Use","Alcohol","Withdrawal timeline; Wernicke-Korsakoff"],["Anxiety & Related","OCD","Treatment (SSRIs, ERP)"],["Child Psychiatry","ADHD & autism","Diagnosis and drugs"]],"how":"Short subject: drug side effects and defence mechanisms are classic. Learn DSM-5/ICD-11 key criteria only.","skip":"Psychoanalytic theory detail."},"as":{"bp":"(within Surgery group)","rr":"5-8 (PL)","pri":1,"img":"Airway equipment, laryngoscopy views, capnography traces, circuits","hot":[["Inhalational Agents","Pharmacology","Blood:gas coefficients; MAC; agent of choice"],["IV Agents & Muscle Relaxants","Muscle relaxants","Succinylcholine contraindications; reversal"],["IV Agents & Muscle Relaxants","Induction agents","Ketamine, propofol, etomidate uses"],["Local & Regional","Local anaesthetics","LA toxicity and lipid emulsion"],["Monitoring & Complications","Malignant hyperthermia","Dantrolene"],["Airway & Pre-op","Airway assessment","Mallampati, Cormack-Lehane"],["CPR","Basic & advanced life support","Compression rate and depth; shockable rhythms"]],"how":"Learn equipment images and capnography patterns. Most questions are drug comparisons.","skip":"Vaporiser engineering details."},"ra":{"bp":"(within Surgery group)","rr":"5-8 (PL)","pri":1,"img":"X-ray, CT and MRI signs (the subject itself is images)","hot":[["Chest Imaging","Chest X-ray signs","Classic CXR signs (bat wing, silhouette)"],["Abdominal Imaging","GI signs","Pneumoperitoneum, obstruction, volvulus signs"],["Neuroimaging","Brain","SAH, EDH vs SDH on CT"],["Physics & Radiation Protection","Units & protection","Units, dose limits, most radiosensitive tissues"],["Nuclear Medicine","Isotopes & scans","Isotopes and their uses"]],"how":"Learn named signs with an image beside each. Radiation units and limits are easy marks.","skip":"Detailed physics of MRI sequences."}}},"seed-1.json":[{"s":"an","t":"Upper Limb","st":"Nerve injuries","hy":3,"q":"A 28-year-old man falls on his shoulder and sustains a fracture of the surgical neck of the humerus. He cannot abduct the arm beyond the first few degrees, and sensation is lost over the lower half of the deltoid. Which nerve is injured?","o":["Axillary nerve","Suprascapular nerve","Radial nerve","Musculocutaneous nerve"],"a":0,"e":"The axillary nerve (C5, C6) winds round the surgical neck of the humerus. It supplies deltoid and teres minor, and through the upper lateral cutaneous nerve of the arm it supplies the skin over the lower deltoid (the 'regimental badge' area). The first ~15 degrees of abduction come from supraspinatus (suprascapular nerve), so only that small arc survives.","p":"Humerus fracture → nerve: surgical neck = axillary; spiral groove (midshaft) = radial; supracondylar = median (anterior interosseous branch); medial epicondyle = ulnar."},{"s":"an","t":"Upper Limb","st":"Nerve injuries","hy":2,"q":"Clawing of the ring and little fingers is more marked when the ulnar nerve is cut at the wrist than when it is cut at the elbow. This is called:","o":["Ulnar paradox","Froment sign","Wartenberg sign","Benediction attitude"],"a":0,"e":"A lesion at the elbow also paralyses the medial half of flexor digitorum profundus, so the distal interphalangeal joints flex less and the claw looks milder. A lesion at the wrist spares FDP, so the unopposed long flexors produce more obvious clawing.","p":"Froment sign = adductor pollicis weakness (thumb IP flexion by FPL substitutes). Wartenberg sign = abducted little finger (palmar interossei weak)."},{"s":"an","t":"Thorax","st":"Heart & coronaries","hy":2,"q":"In most individuals, the artery to the sinoatrial node arises from the:","o":["Right coronary artery","Left anterior descending artery","Left circumflex artery","Posterior interventricular artery"],"a":0,"e":"The SA nodal artery arises from the right coronary artery in about 60% of people and from the circumflex branch of the left coronary artery in the rest.","p":"The AV nodal artery comes from the artery that gives the posterior interventricular branch, which is the RCA in right-dominant hearts (most people). So inferior MI (RCA) often causes heart block."},{"s":"an","t":"Neuroanatomy","st":"Brainstem","hy":3,"q":"A 30-year-old woman with multiple sclerosis cannot adduct her right eye on looking to the left, and her left eye shows nystagmus when abducting. Convergence is normal. The lesion lies in the:","o":["Right medial longitudinal fasciculus","Left abducens nucleus","Right oculomotor nerve","Left paramedian pontine reticular formation"],"a":0,"e":"This is internuclear ophthalmoplegia. The medial longitudinal fasciculus links the abducens nucleus of one side to the medial rectus subnucleus of the other side. A lesion of the right MLF stops the right eye adducting on left gaze. Convergence is intact because it uses a separate pathway to the oculomotor nucleus, which shows the oculomotor nerve itself is fine.","p":"INO is named for the side that fails to adduct. Bilateral INO in a young adult suggests multiple sclerosis; in an older person, think brainstem stroke."},{"s":"an","t":"Head & Neck","st":"Larynx & pharynx","hy":3,"q":"Which intrinsic muscle of the larynx is supplied by the external laryngeal nerve?","o":["Cricothyroid","Posterior cricoarytenoid","Lateral cricoarytenoid","Thyroarytenoid"],"a":0,"e":"All intrinsic laryngeal muscles are supplied by the recurrent laryngeal nerve except cricothyroid, which is supplied by the external branch of the superior laryngeal nerve. Cricothyroid tenses the vocal cords.","p":"The external laryngeal nerve runs close to the superior thyroid artery, so it is at risk when that artery is ligated in thyroidectomy. Injury gives a weak, low-pitched voice. Posterior cricoarytenoid is the only abductor of the vocal cords."},{"s":"an","t":"Abdomen & Pelvis","st":"Peritoneum","hy":2,"q":"The anterior boundary of the epiploic foramen (foramen of Winslow) is formed by the:","o":["Free border of the lesser omentum","Inferior vena cava","Caudate process of the liver","First part of the duodenum"],"a":0,"e":"Anteriorly lies the free edge of the lesser omentum (hepatoduodenal ligament) containing the portal vein, hepatic artery proper and common bile duct. Posteriorly lies the IVC, superiorly the caudate process of the liver, and inferiorly the first part of the duodenum.","p":"Pringle manoeuvre = compressing the hepatoduodenal ligament at the epiploic foramen to control bleeding from the liver."},{"s":"an","t":"General Anatomy & Embryology","st":"Pharyngeal arches","hy":3,"q":"The stapes is derived from which pharyngeal arch?","o":["Second arch","First arch","Third arch","Fourth arch"],"a":0,"e":"Reichert cartilage of the second arch forms the stapes, styloid process, stylohyoid ligament, and the lesser horn and upper body of the hyoid. Meckel cartilage of the first arch forms the malleus and incus.","p":"Arch nerves: 1st = mandibular (V3), 2nd = facial (VII), 3rd = glossopharyngeal (IX), 4th and 6th = vagus (X). The 3rd arch forms the greater horn and lower body of the hyoid."},{"s":"an","t":"Lower Limb","st":"Gluteal region & hip","hy":2,"q":"A patient stands on the right leg and the pelvis drops on the left side. The nerve most likely damaged is the:","o":["Right superior gluteal nerve","Left superior gluteal nerve","Right inferior gluteal nerve","Right femoral nerve"],"a":0,"e":"This is a positive Trendelenburg sign. Gluteus medius and minimus of the stance (right) side normally hold the pelvis level, and both are supplied by the superior gluteal nerve. When they are weak, the unsupported opposite side drops.","p":"The side that drops is the normal side; the lesion is on the stance side. Inferior gluteal nerve injury weakens gluteus maximus, so climbing stairs and rising from a chair are hard."},{"s":"ph","t":"Cardiovascular","st":"Cardiac cycle","hy":3,"q":"Cannon 'a' waves in the jugular venous pulse are characteristically seen in:","o":["Complete heart block","Atrial fibrillation","Tricuspid regurgitation","Constrictive pericarditis"],"a":0,"e":"The 'a' wave is produced by atrial contraction. In complete heart block the atrium sometimes contracts against a closed tricuspid valve (AV dissociation), giving intermittent large cannon waves. In atrial fibrillation there is no 'a' wave at all.","p":"Large 'v' wave = tricuspid regurgitation. Steep 'y' descent (Friedreich sign) = constrictive pericarditis. Absent 'a' wave = atrial fibrillation."},{"s":"ph","t":"Respiratory","st":"Ventilation-perfusion","hy":2,"q":"In an upright person, the ventilation-perfusion (V/Q) ratio is highest at the:","o":["Apex of the lung","Base of the lung","Mid-zone","It is equal throughout"],"a":0,"e":"Both ventilation and perfusion increase from apex to base, but perfusion rises more steeply. So V/Q is highest at the apex (about 3) and lowest at the base (about 0.6).","p":"High V/Q and high PO2 at the apex suit Mycobacterium tuberculosis, which is why reactivation TB favours the apices."},{"s":"ph","t":"Renal","st":"GFR & clearance","hy":3,"q":"The substance considered the gold standard for measuring glomerular filtration rate is:","o":["Inulin","Para-aminohippuric acid","Creatinine","Urea"],"a":0,"e":"Inulin is freely filtered and is neither secreted nor reabsorbed, so its clearance equals GFR. Creatinine is slightly secreted and overestimates GFR. PAH is used to measure renal plasma flow.","p":"Clearance = UV/P. Glucose clearance is normally zero; PAH clearance is roughly equal to effective renal plasma flow."},{"s":"ph","t":"Endocrine","st":"Hormone mechanisms","hy":2,"q":"Which hormone acts through the JAK-STAT pathway?","o":["Growth hormone","Insulin","Glucagon","Aldosterone"],"a":0,"e":"Growth hormone, prolactin, erythropoietin and many cytokines bind receptors that activate JAK kinases. Insulin uses a receptor tyrosine kinase, glucagon uses Gs-cAMP, and aldosterone uses an intracellular nuclear receptor.","p":"Receptors for prolactin, EPO, GH, thrombopoietin, G-CSF and the interleukins all signal through JAK-STAT."},{"s":"ph","t":"Nerve & Muscle","st":"Action potential","hy":2,"q":"The absolute refractory period of a nerve fibre is mainly due to:","o":["Inactivation of voltage-gated sodium channels","Opening of voltage-gated potassium channels","Activity of the Na+/K+ pump","Closure of chloride channels"],"a":0,"e":"After opening, voltage-gated Na+ channels enter an inactivated state (inactivation gate closed) and cannot reopen until the membrane repolarises. During this time no stimulus, however strong, can trigger a new action potential.","p":"Relative refractory period = some Na+ channels have recovered, and K+ conductance is still high. A stronger-than-normal stimulus can fire the nerve."},{"s":"ph","t":"Gastrointestinal","st":"GI hormones","hy":2,"q":"Cholecystokinin is secreted by which cells?","o":["I cells of the duodenum and jejunum","S cells of the duodenum","G cells of the gastric antrum","K cells of the duodenum"],"a":0,"e":"I cells release CCK in response to fatty acids and amino acids. CCK contracts the gallbladder, relaxes the sphincter of Oddi and stimulates pancreatic enzyme secretion.","p":"S cells = secretin (bicarbonate). G cells = gastrin. K cells = GIP. L cells = GLP-1. D cells = somatostatin."},{"s":"ph","t":"Respiratory","st":"Gas transport","hy":3,"q":"Which of the following shifts the oxygen-haemoglobin dissociation curve to the LEFT?","o":["Carbon monoxide poisoning","Increased 2,3-BPG","Hypercapnia","Fever"],"a":0,"e":"Carbon monoxide raises haemoglobin's affinity for the oxygen it still carries, shifting the curve left and impairing oxygen release to tissues. Raised CO2, H+, temperature and 2,3-BPG all shift the curve to the right (Bohr effect).","p":"Right shift = 'CADET face Right': CO2, Acid, 2,3-DPG, Exercise, Temperature. Left shift: fetal Hb, CO, methaemoglobin, alkalosis, hypothermia."},{"s":"ph","t":"Neurophysiology","st":"Sleep & EEG","hy":2,"q":"Sleep spindles and K-complexes are characteristic of which sleep stage?","o":["N2","N1","N3","REM"],"a":0,"e":"Stage N2 shows sleep spindles (12-14 Hz bursts) and K-complexes. N1 shows theta waves, N3 shows delta (slow-wave) activity, and REM shows a low-voltage mixed pattern with sawtooth waves.","p":"Most of an adult's sleep is spent in N2. Night terrors and sleepwalking occur in N3; nightmares occur in REM."},{"s":"bc","t":"Carbohydrate Metabolism","st":"Glycogen storage diseases","hy":3,"q":"An infant has hepatomegaly, severe fasting hypoglycaemia, lactic acidosis, hyperuricaemia and hyperlipidaemia. The deficient enzyme is most likely:","o":["Glucose-6-phosphatase","Lysosomal acid maltase","Muscle glycogen phosphorylase","Debranching enzyme"],"a":0,"e":"Von Gierke disease (GSD type I) blocks the final step of both glycogenolysis and gluconeogenesis, so the liver cannot release free glucose. The accumulated glucose-6-phosphate is diverted to lactate, uric acid and triglycerides.","p":"Pompe (II) = acid maltase, cardiomegaly. Cori (III) = debranching enzyme, milder with no lactic acidosis. McArdle (V) = muscle phosphorylase, exercise cramps and myoglobinuria."},{"s":"bc","t":"Lipid Metabolism","st":"Cholesterol & lipoproteins","hy":3,"q":"The rate-limiting enzyme of cholesterol synthesis is:","o":["HMG-CoA reductase","HMG-CoA synthase","Squalene epoxidase","Mevalonate kinase"],"a":0,"e":"HMG-CoA reductase converts HMG-CoA to mevalonate. It is the committed, regulated step and the target of statins.","p":"The same intermediate, HMG-CoA, is made by mitochondrial HMG-CoA synthase for ketone body synthesis, while cytosolic HMG-CoA feeds cholesterol synthesis."},{"s":"bc","t":"Amino Acid Metabolism","st":"Urea cycle","hy":3,"q":"A 3-day-old boy becomes lethargic and is found to have hyperammonaemia, low plasma citrulline and increased urinary orotic acid. The most likely deficiency is:","o":["Ornithine transcarbamoylase","Carbamoyl phosphate synthetase I","Argininosuccinate synthetase","Arginase"],"a":0,"e":"In OTC deficiency, carbamoyl phosphate builds up and spills into the cytosol, where it enters pyrimidine synthesis and produces orotic acid. CPS-I deficiency has hyperammonaemia without orotic aciduria. OTC deficiency is X-linked and is the most common urea cycle disorder.","p":"Orotic aciduria with hyperammonaemia = OTC deficiency. Orotic aciduria without hyperammonaemia but with megaloblastic anaemia = UMP synthase deficiency (hereditary orotic aciduria)."},{"s":"bc","t":"Vitamins & Minerals","st":"Water-soluble vitamins","hy":2,"q":"Thiamine status is best assessed by measuring the activity of which red cell enzyme?","o":["Transketolase","Glutathione reductase","Aspartate aminotransferase","Pyruvate kinase"],"a":0,"e":"Transketolase in the HMP shunt needs thiamine pyrophosphate. Low erythrocyte transketolase activity, rising with added TPP, indicates thiamine deficiency.","p":"Erythrocyte glutathione reductase measures riboflavin (B2). Erythrocyte aminotransferase measures pyridoxine (B6). FIGLU excretion after a histidine load reflects folate status."},{"s":"bc","t":"Nucleotide Metabolism","st":"Purines","hy":3,"q":"A boy with developmental delay, choreoathetosis, self-biting of lips and fingers, and gouty arthritis most likely has a deficiency of:","o":["HGPRT","Adenosine deaminase","Xanthine oxidase","PRPP synthetase"],"a":0,"e":"Lesch-Nyhan syndrome is an X-linked absence of HGPRT. The purine salvage pathway fails, de novo purine synthesis increases, and uric acid is overproduced. It presents with self-mutilation and neurological features.","p":"ADA deficiency causes severe combined immunodeficiency (SCID). Xanthine oxidase deficiency lowers uric acid and can cause xanthine stones."},{"s":"bc","t":"Molecular Biology","st":"Techniques","hy":2,"q":"Western blotting is used to detect:","o":["Proteins","DNA","RNA","Lipids"],"a":0,"e":"Western blot separates proteins by gel electrophoresis and detects them with antibodies. Southern blot detects DNA and Northern blot detects RNA.","p":"Mnemonic SNOW DROP: Southern = DNA, Northern = RNA, Western = Protein. South-Western = DNA-binding proteins."},{"s":"bc","t":"Lipid Metabolism","st":"Lipid storage disorders","hy":2,"q":"Macrophages with 'crumpled tissue paper' cytoplasm in the bone marrow are seen in deficiency of:","o":["Glucocerebrosidase","Sphingomyelinase","Hexosaminidase A","Alpha-galactosidase A"],"a":0,"e":"Gaucher disease is the most common lysosomal storage disorder. Glucocerebroside accumulates in macrophages (Gaucher cells), causing hepatosplenomegaly, bone pain and pancytopenia.","p":"Sphingomyelinase = Niemann-Pick (foamy cells, cherry-red spot). Hexosaminidase A = Tay-Sachs (cherry-red spot, no hepatosplenomegaly). Alpha-galactosidase A = Fabry (X-linked)."},{"s":"bc","t":"Enzymes","st":"Enzyme kinetics","hy":3,"q":"A competitive inhibitor alters enzyme kinetics by:","o":["Increasing Km with no change in Vmax","Decreasing Vmax with no change in Km","Decreasing both Km and Vmax","Increasing Vmax with no change in Km"],"a":0,"e":"A competitive inhibitor competes for the active site. Enough substrate overcomes it, so Vmax is unchanged, but more substrate is needed to reach half-maximal velocity, so the apparent Km rises.","p":"Non-competitive: Vmax falls, Km unchanged. Uncompetitive: both Km and Vmax fall. On a Lineweaver-Burk plot, competitive inhibitor lines meet on the y-axis."},{"s":"pa","t":"General Pathology","st":"Inflammation","hy":2,"q":"Which mediator acts on the hypothalamus to raise the thermoregulatory set point in fever?","o":["Prostaglandin E2","Bradykinin","Histamine","Leukotriene B4"],"a":0,"e":"Pyrogens such as IL-1 and TNF induce cyclo-oxygenase in the hypothalamus. The resulting prostaglandin E2 raises the set point. NSAIDs reduce fever by blocking prostaglandin synthesis.","p":"Pain = PGE2 + bradykinin. Leukotriene B4 = neutrophil chemotaxis. Histamine = the main mediator of the immediate increase in vascular permeability."},{"s":"pa","t":"General Pathology","st":"Neoplasia","hy":3,"q":"Psammoma bodies are characteristically seen in all of the following EXCEPT:","o":["Follicular carcinoma of thyroid","Papillary carcinoma of thyroid","Serous cystadenocarcinoma of ovary","Meningioma"],"a":0,"e":"Psammoma bodies are concentric, laminated calcifications (dystrophic calcification) typical of papillary architecture. They are seen in papillary thyroid carcinoma, serous ovarian tumours, meningioma and mesothelioma, but not in follicular carcinoma.","p":"Mnemonic PSaMMoma: Papillary thyroid, Serous ovarian, Meningioma, Mesothelioma."},{"s":"pa","t":"Haematology","st":"Anaemias","hy":2,"q":"The most common protein defect in hereditary spherocytosis involves:","o":["Ankyrin","Glycophorin","Band 3 only","Alpha-spectrin only"],"a":0,"e":"Ankyrin mutations are the most frequent cause of hereditary spherocytosis, followed by band 3, spectrin and protein 4.2. Loss of vertical membrane linkages makes the cells spherical, and they are trapped in the spleen.","p":"In HS, MCHC is raised and osmotic fragility is increased. The eosin-5-maleimide (EMA) binding test is highly sensitive. Splenectomy is curative for the anaemia."},{"s":"pa","t":"Haematology","st":"Leukaemias","hy":3,"q":"The translocation t(15;17) is associated with:","o":["Acute promyelocytic leukaemia","Chronic myeloid leukaemia","Burkitt lymphoma","Follicular lymphoma"],"a":0,"e":"t(15;17) produces the PML-RARA fusion protein, which blocks myeloid differentiation at the promyelocyte stage. Patients often present with DIC. All-trans retinoic acid and arsenic trioxide induce differentiation.","p":"t(9;22) = CML (BCR-ABL). t(8;14) = Burkitt (MYC). t(14;18) = follicular lymphoma (BCL2). t(11;14) = mantle cell lymphoma (cyclin D1)."},{"s":"pa","t":"General Pathology","st":"Immunopathology & amyloidosis","hy":3,"q":"Apple-green birefringence under polarised light is seen with which stain in amyloidosis?","o":["Congo red","Periodic acid-Schiff","Prussian blue","Masson trichrome"],"a":0,"e":"Amyloid takes up Congo red, appearing pink-red under ordinary light and apple-green under polarised light. This reflects its cross-beta-pleated sheet structure.","p":"Abdominal fat pad aspiration is a simple first biopsy. AL amyloid = light chains (myeloma). AA amyloid = serum amyloid A (chronic inflammation)."},{"s":"pa","t":"General Pathology","st":"Cell injury","hy":2,"q":"Which ultrastructural change indicates IRREVERSIBLE cell injury?","o":["Large flocculent amorphous densities in mitochondria","Cellular swelling","Detachment of ribosomes from the endoplasmic reticulum","Formation of membrane blebs"],"a":0,"e":"Flocculent densities in mitochondria reflect severe mitochondrial damage and mark the point of no return, along with membrane rupture and nuclear changes (pyknosis, karyorrhexis, karyolysis). Swelling, blebbing and ribosome detachment are reversible.","p":"The two hallmarks of irreversibility are inability to restore mitochondrial function and profound plasma membrane damage."},{"s":"pa","t":"Systemic Pathology","st":"Kidney","hy":3,"q":"In minimal change disease, the characteristic finding on electron microscopy is:","o":["Diffuse effacement of podocyte foot processes","Subepithelial 'spike and dome' deposits","Subendothelial 'wire-loop' deposits","Splitting of the glomerular basement membrane"],"a":0,"e":"Minimal change disease is the most common cause of nephrotic syndrome in children. Light microscopy is normal, and EM shows diffuse effacement of foot processes. It responds well to steroids.","p":"Spike and dome = membranous nephropathy. Wire loops = lupus nephritis (class IV). 'Basket-weave' GBM splitting = Alport syndrome."},{"s":"pa","t":"Haematology","st":"Lymphomas","hy":3,"q":"Classic Reed-Sternberg cells of classical Hodgkin lymphoma typically express:","o":["CD15 and CD30","CD20 and CD45","CD3 and CD4","CD10 and BCL6"],"a":0,"e":"Classical RS cells are CD15+ and CD30+ and are usually negative for CD45 and CD20. In nodular lymphocyte-predominant Hodgkin lymphoma, the 'popcorn' (LP) cells are CD20+ and negative for CD15 and CD30.","p":"Nodular sclerosis is the most common subtype of classical Hodgkin lymphoma. Mixed cellularity is associated with EBV. Lymphocyte-depleted has the worst prognosis."},{"s":"pm","t":"CNS","st":"Antiepileptics","hy":3,"q":"A 7-year-old has typical absence seizures with 3 Hz spike-and-wave discharges on EEG and no other seizure types. The preferred first-line drug is:","o":["Ethosuximide","Carbamazepine","Phenytoin","Gabapentin"],"a":0,"e":"Ethosuximide blocks T-type calcium channels in thalamic neurons, which drive absence seizures. Valproate is preferred if generalised tonic-clonic seizures also occur. Carbamazepine and phenytoin can worsen absence seizures.","p":"Drugs that can aggravate absence or myoclonic seizures: carbamazepine, oxcarbazepine, phenytoin, gabapentin, vigabatrin."},{"s":"pm","t":"Blood","st":"Anticoagulants & antiplatelets","hy":3,"q":"The specific antidote for heparin overdose is:","o":["Protamine sulfate","Vitamin K","Idarucizumab","Fresh frozen plasma"],"a":0,"e":"Protamine is strongly basic and binds the acidic heparin to form an inactive complex. It fully reverses unfractionated heparin and only partly reverses LMWH.","p":"Warfarin = vitamin K, plus prothrombin complex concentrate when urgent. Dabigatran = idarucizumab. Factor Xa inhibitors = andexanet alfa."},{"s":"pm","t":"General Pharmacology","st":"Pharmacokinetics","hy":3,"q":"Which drug shows zero-order (saturation) kinetics within or near its therapeutic range?","o":["Phenytoin","Gentamicin","Digoxin","Lithium"],"a":0,"e":"Phenytoin's metabolising enzymes saturate near therapeutic concentrations. A small dose increase can then cause a disproportionate rise in plasma level and toxicity. Therapeutic drug monitoring is used.","p":"Zero-order kinetics: phenytoin, ethanol, high-dose aspirin. A fixed AMOUNT of drug is eliminated per unit time, not a fixed fraction."},{"s":"pm","t":"Chemotherapy","st":"Antibacterials","hy":2,"q":"Flushing and an erythematous rash over the face, neck and upper trunk during a rapid intravenous infusion is characteristic of:","o":["Vancomycin","Ceftriaxone","Gentamicin","Metronidazole"],"a":0,"e":"Vancomycin infusion reaction ('red man' or 'red neck' syndrome) is caused by direct, non-IgE histamine release from mast cells. It is prevented by infusing over at least 60 minutes and can be eased with antihistamines.","p":"Other vancomycin adverse effects: nephrotoxicity and ototoxicity. Oral vancomycin is not absorbed and is used for C. difficile colitis."},{"s":"pm","t":"Chemotherapy","st":"Antitubercular","hy":3,"q":"Which first-line antitubercular drug causes optic neuritis with red-green colour blindness?","o":["Ethambutol","Isoniazid","Rifampicin","Pyrazinamide"],"a":0,"e":"Ethambutol causes dose-related retrobulbar optic neuritis. Visual acuity and colour vision should be checked, and it is used with caution in young children who cannot report visual symptoms.","p":"INH = peripheral neuropathy (give pyridoxine) and hepatitis. Rifampicin = orange urine and enzyme induction. Pyrazinamide = hyperuricaemia and hepatotoxicity."},{"s":"pm","t":"Cardiovascular & Renal","st":"Antiarrhythmics","hy":3,"q":"An antiarrhythmic drug that causes pulmonary fibrosis, hypo- or hyperthyroidism, corneal microdeposits and blue-grey skin discoloration is:","o":["Amiodarone","Sotalol","Flecainide","Verapamil"],"a":0,"e":"Amiodarone is iodine-rich and lipophilic with a very long half-life. It affects thyroid, lung, liver, cornea and skin. Baseline and periodic thyroid, liver and lung assessment is advised.","p":"Despite prolonging QT, amiodarone rarely causes torsades de pointes. It has class I, II, III and IV actions."},{"s":"pm","t":"Autonomic Nervous System","st":"Cholinergic drugs","hy":3,"q":"In organophosphate poisoning, the drug that regenerates acetylcholinesterase (if given before 'ageing' of the enzyme) is:","o":["Pralidoxime","Atropine","Physostigmine","Neostigmine"],"a":0,"e":"Oximes such as pralidoxime remove the phosphoryl group from the inhibited enzyme and reactivate it, mainly reversing nicotinic effects such as muscle weakness. Atropine blocks muscarinic effects but does not reactivate the enzyme.","p":"Titrate atropine to drying of bronchial secretions, not to pupil size or heart rate. Oximes are ineffective in carbamate poisoning."},{"s":"pm","t":"Endocrine","st":"Antidiabetics","hy":2,"q":"The principal mechanism by which metformin lowers blood glucose is:","o":["Reduction of hepatic gluconeogenesis","Stimulation of insulin secretion","Inhibition of intestinal alpha-glucosidase","Inhibition of renal SGLT2"],"a":0,"e":"Metformin activates AMP-activated protein kinase and mainly suppresses hepatic glucose output. It does not cause hypoglycaemia when used alone and is weight-neutral.","p":"Metformin causes lactic acidosis rarely; it is avoided when eGFR is below 30. Long-term use can cause vitamin B12 deficiency."},{"s":"mi","t":"Mycology","st":"Opportunistic mycoses","hy":3,"q":"On KOH mount of a sinus biopsy, thin septate hyphae with acute-angle (about 45 degrees) dichotomous branching are seen. The likely fungus is:","o":["Aspergillus","Mucor","Candida","Histoplasma"],"a":0,"e":"Aspergillus produces narrow, septate hyphae with regular acute-angle dichotomous branching. Mucorales produce broad, ribbon-like, pauci-septate hyphae branching at wide (often right) angles.","p":"Mucormycosis: think diabetic ketoacidosis and rhino-orbito-cerebral disease with a black eschar; treat with amphotericin B plus surgical debridement. Voriconazole is first-line for invasive aspergillosis."},{"s":"mi","t":"Mycology","st":"Systemic mycoses","hy":3,"q":"A capsulated yeast is seen with India ink staining of the CSF of an HIV-positive patient with meningitis. The organism is:","o":["Cryptococcus neoformans","Candida albicans","Histoplasma capsulatum","Coccidioides immitis"],"a":0,"e":"India ink (negative staining) shows the polysaccharide capsule of Cryptococcus as a clear halo around the yeast. Cryptococcal antigen testing of CSF or serum is more sensitive.","p":"Cryptococcus: urease-positive, grows on bird-seed (niger seed) agar with brown colonies, and is the commonest cause of fungal meningitis in AIDS."},{"s":"mi","t":"Bacteriology","st":"Gram-positive cocci","hy":2,"q":"A positive CAMP test is characteristic of:","o":["Streptococcus agalactiae","Streptococcus pyogenes","Enterococcus faecalis","Streptococcus pneumoniae"],"a":0,"e":"Group B Streptococcus produces CAMP factor, which enhances the beta-haemolysis of Staphylococcus aureus, producing an arrowhead-shaped zone of haemolysis.","p":"GBS is a leading cause of neonatal sepsis and meningitis. It is hippurate-hydrolysis positive and bacitracin-resistant. S. pyogenes is bacitracin-sensitive and PYR-positive."},{"s":"mi","t":"Virology","st":"Hepatitis viruses","hy":3,"q":"During the 'window period' of acute hepatitis B infection, the only detectable serological marker is:","o":["IgM anti-HBc","HBsAg","Anti-HBs","HBeAg"],"a":0,"e":"In the window period HBsAg has disappeared but anti-HBs is not yet detectable. IgM antibody to the core antigen is present throughout this phase.","p":"Anti-HBs alone = vaccinated. Anti-HBs plus IgG anti-HBc = recovered from past infection. HBsAg for more than 6 months = chronic infection."},{"s":"mi","t":"General Microbiology","st":"Sterilisation & disinfection","hy":3,"q":"The biological indicator used to check the efficiency of an autoclave is spores of:","o":["Geobacillus stearothermophilus","Bacillus atrophaeus","Clostridium tetani","Bacillus pumilus"],"a":0,"e":"Spores of Geobacillus (formerly Bacillus) stearothermophilus are highly resistant to moist heat, so their destruction confirms autoclave efficacy.","p":"Hot air oven = Bacillus atrophaeus (formerly B. subtilis var niger). Ionising radiation = Bacillus pumilus. Standard autoclave cycle = 121 degrees C at 15 psi for 15 minutes."},{"s":"mi","t":"Parasitology","st":"Protozoa","hy":3,"q":"Crescent (banana-shaped) gametocytes on a peripheral smear are characteristic of:","o":["Plasmodium falciparum","Plasmodium vivax","Plasmodium malariae","Plasmodium ovale"],"a":0,"e":"P. falciparum gametocytes are crescent-shaped. Other features include multiple ring forms per RBC, appliqué forms and Maurer's dots, with usually only rings and gametocytes seen in peripheral blood.","p":"P. vivax: enlarged RBCs with Schüffner's dots. P. malariae: band forms and quartan fever. P. vivax and ovale form hypnozoites, so primaquine or tafenoquine is needed for radical cure."},{"s":"mi","t":"Immunology","st":"Hypersensitivity","hy":3,"q":"The tuberculin (Mantoux) test is an example of which type of hypersensitivity?","o":["Type IV","Type I","Type II","Type III"],"a":0,"e":"The Mantoux reaction is a delayed-type (cell-mediated) hypersensitivity mediated by sensitised T cells and macrophages. It is read at 48-72 hours as induration.","p":"Type I = IgE (anaphylaxis). Type II = antibody against cell-surface antigen (transfusion reaction). Type III = immune complex (serum sickness, Arthus reaction). Type IV = T cell (contact dermatitis, Mantoux)."},{"s":"mi","t":"Bacteriology","st":"Gram-positive bacilli","hy":2,"q":"'Medusa head' colonies on nutrient agar are characteristic of:","o":["Bacillus anthracis","Clostridium perfringens","Corynebacterium diphtheriae","Listeria monocytogenes"],"a":0,"e":"B. anthracis forms rough colonies with curled outgrowths at the edge, described as Medusa-head colonies. Gelatin stab culture shows an 'inverted fir tree' pattern. It is non-motile, capsulated and spore-forming.","p":"McFadyean reaction (polychrome methylene blue) shows the capsule of B. anthracis. Cutaneous anthrax produces a painless black eschar ('malignant pustule')."},{"s":"fm","t":"Thanatology","st":"Postmortem changes","hy":3,"q":"Among the voluntary muscles, rigor mortis first appears in the:","o":["Eyelids","Lower limbs","Fingers and toes","Neck"],"a":0,"e":"Rigor mortis follows a proximal-to-distal sequence (Nysten's rule) in voluntary muscles: eyelids first, then face, jaw, neck, trunk and upper limbs, then lower limbs, with fingers and toes last. Involuntary muscle (myocardium) stiffens even earlier.","p":"Rigor typically starts 1-2 hours after death in temperate climates, is fully developed by about 12 hours and passes off in roughly the same order. Cadaveric spasm is instant stiffening without primary relaxation."},{"s":"fm","t":"Asphyxial Deaths","st":"Hanging & strangulation","hy":3,"q":"Which feature of a ligature mark favours hanging over ligature strangulation?","o":["Oblique, non-continuous mark above the thyroid cartilage","Horizontal, continuous mark","Mark at or below the thyroid cartilage","Multiple fractures of tracheal rings"],"a":0,"e":"In hanging the ligature mark runs obliquely upward towards the knot and is usually incomplete at the knot. A strangulation mark is horizontal, encircles the neck completely and usually lies at or below the thyroid cartilage.","p":"Fracture of the hyoid and thyroid cartilage, along with neck bruising, is more typical of throttling (manual strangulation). Dribbling of saliva from the angle of the mouth suggests antemortem hanging."},{"s":"fm","t":"Thanatology","st":"Postmortem changes","hy":2,"q":"Postmortem caloricity (a rise in body temperature after death) is classically seen in deaths from:","o":["Cholera","Massive haemorrhage","Drowning in cold water","Congestive heart failure"],"a":0,"e":"Postmortem caloricity occurs where heat production was raised before death or bacterial activity continues: cholera, septicaemia, tetanus, strychnine poisoning and heat stroke.","p":"Algor mortis = postmortem cooling. Livor mortis (hypostasis) begins at about 1-2 hours and becomes fixed at about 6-8 hours."},{"s":"fm","t":"Injuries","st":"Firearm injuries","hy":3,"q":"Tattooing around a firearm entry wound is caused by:","o":["Unburnt and partly burnt powder particles","Flame from the muzzle","Smoke deposition","Grease from the bullet"],"a":0,"e":"Powder grains embedded in the skin cause tattooing (stippling), which cannot be wiped off and indicates a close-range shot. Smoke blackening can be wiped off and indicates an even closer range. Burning and singeing come from the flame.","p":"Contact wounds show a muzzle imprint, and on bone may show a cherry-red track from carboxyhaemoglobin. Exit wounds are usually larger and everted, without soot or tattooing."},{"s":"fm","t":"Toxicology","st":"Alcohols","hy":3,"q":"The preferred antidote in methanol poisoning is:","o":["Fomepizole","Naloxone","Flumazenil","N-acetylcysteine"],"a":0,"e":"Fomepizole inhibits alcohol dehydrogenase, preventing conversion of methanol to formaldehyde and formic acid, which cause metabolic acidosis and optic nerve damage. Ethanol is an alternative competitive substrate. Haemodialysis removes methanol and formate.","p":"Methanol attacks the optic nerve and retina (blindness, 'snowfield' vision). Folinic acid speeds formate clearance."},{"s":"fm","t":"Toxicology","st":"Metallic poisons","hy":2,"q":"Transverse white lines across the nails (Aldrich-Mees lines) in chronic poisoning are classically associated with:","o":["Arsenic","Lead","Mercury","Copper"],"a":0,"e":"Chronic arsenic poisoning causes Mees lines, raindrop pigmentation, palmoplantar hyperkeratosis and peripheral neuropathy. Arsenic deposits in hair and nails, which can be analysed long after exposure.","p":"Lead = Burton's (blue) gum line, basophilic stippling, wrist and foot drop. Mercury = erethism, acrodynia, and 'mad hatter' tremor."},{"s":"fm","t":"Identification","st":"Dental & DNA","hy":2,"q":"Gustafson's method of age estimation is based on:","o":["Changes in adult teeth","Ossification centres of the wrist","Fusion of skull sutures","Pubic symphysis changes"],"a":0,"e":"Gustafson described six regressive changes in teeth for estimating age in adults: attrition, periodontosis, secondary dentine, cementum apposition, root resorption and root transparency.","p":"Root transparency is considered the most reliable of Gustafson's criteria. Pubic symphysis changes (Todd's method) also estimate adult age."},{"s":"fm","t":"Identification","st":"Trace evidence","hy":2,"q":"'Every contact leaves a trace' is the basis of:","o":["Locard's exchange principle","Daubert standard","McNaughten rule","Durham rule"],"a":0,"e":"Locard's principle holds that the perpetrator and the scene or victim exchange material such as fibres, hair, soil or blood. This underpins the collection of trace evidence.","p":"The McNaughten rule concerns the legal test of insanity. Chain of custody must be documented for every item of trace evidence."},{"s":"cm","t":"Epidemiology","st":"Screening","hy":3,"q":"Sensitivity of a screening test is calculated as:","o":["TP / (TP + FN)","TN / (TN + FP)","TP / (TP + FP)","TN / (TN + FN)"],"a":0,"e":"Sensitivity is the proportion of people with the disease who test positive, i.e. true positives out of all who truly have the disease.","p":"Specificity = TN/(TN+FP). PPV = TP/(TP+FP). NPV = TN/(TN+FN). SnNout: a highly Sensitive test that is Negative rules disease out."},{"s":"cm","t":"Epidemiology","st":"Study designs","hy":3,"q":"A study starts with people who have a disease and people who do not, then looks back at their past exposure. The measure of association used is:","o":["Odds ratio","Relative risk","Attributable risk","Incidence rate"],"a":0,"e":"This is a case-control study. Because incidence cannot be calculated, the odds ratio is used to estimate relative risk, a good approximation when the disease is rare.","p":"Cohort study: starts with exposure, measures incidence, gives relative and attributable risk. Case-control studies are good for rare diseases; cohort studies are good for rare exposures."},{"s":"cm","t":"Epidemiology","st":"Screening","hy":3,"q":"If disease prevalence in the screened population increases while the test itself stays the same, which value rises?","o":["Positive predictive value","Sensitivity","Specificity","Negative predictive value"],"a":0,"e":"Sensitivity and specificity are properties of the test and do not change with prevalence. A higher prevalence raises the positive predictive value and lowers the negative predictive value.","p":"This is why screening targeted at high-risk groups yields fewer false positives per true case."},{"s":"cm","t":"Communicable Diseases","st":"Vaccine-preventable","hy":3,"q":"Herd immunity does NOT protect unvaccinated people against:","o":["Tetanus","Measles","Diphtheria","Poliomyelitis"],"a":0,"e":"Tetanus is not transmitted from person to person; infection comes from spores in the environment. Immunising others therefore gives no indirect protection.","p":"Each person must be protected individually against tetanus. Elimination of maternal and neonatal tetanus depends on immunising pregnant women and on clean delivery practices."},{"s":"cm","t":"Nutrition","st":"Nutritional programmes","hy":2,"q":"Under India's vitamin A prophylaxis programme, a child aged 9-12 months receives:","o":["1 lakh IU orally","2 lakh IU orally","50,000 IU orally","2 lakh IU intramuscularly"],"a":0,"e":"The first dose of 1,00,000 IU is given at 9 months with measles-rubella vaccination. Doses of 2,00,000 IU follow every 6 months up to 5 years of age, making 9 doses in total.","p":"Vitamin A deficiency eye signs: night blindness is the earliest symptom, Bitot spots are seen on the conjunctiva, and keratomalacia is a medical emergency."},{"s":"cm","t":"Environment & Occupational Health","st":"Water & sanitation","hy":2,"q":"The Horrocks apparatus is used to estimate:","o":["The chlorine demand of water","Hardness of water","Residual chlorine","Bacterial contamination of water"],"a":0,"e":"The Horrocks apparatus uses bleaching powder solution and starch-iodide indicator to estimate the amount of bleaching powder needed to disinfect a given volume of water, such as a well.","p":"Residual chlorine is tested with the orthotolidine (OT) test. The recommended free residual chlorine is 0.5 mg/L after a contact time of 1 hour."},{"s":"cm","t":"Epidemiology","st":"Concepts","hy":2,"q":"In the 'iceberg phenomenon' of disease, the submerged part of the iceberg represents:","o":["Undiagnosed and subclinical cases in the community","Cases seen by clinicians","Deaths due to the disease","Carriers alone"],"a":0,"e":"The visible tip is the clinical cases a doctor sees. The submerged portion is the hidden mass of undiagnosed, subclinical and carrier states, which is what screening tries to detect.","p":"Diseases with a large hidden portion (e.g. hypertension, diabetes, anaemia) are good candidates for screening programmes."},{"s":"cm","t":"Immunisation & Cold Chain","st":"Cold chain","hy":2,"q":"Which vaccine is most sensitive to heat?","o":["Oral polio vaccine","Tetanus toxoid","Hepatitis B vaccine","Pentavalent vaccine"],"a":0,"e":"OPV is the most heat-sensitive vaccine in routine use. It is stored frozen at district level and above and kept at +2 to +8 degrees C at the point of use. The vaccine vial monitor shows heat exposure.","p":"Freeze-sensitive vaccines that must never be frozen include hepatitis B, pentavalent, DPT, TT/Td and PCV. The shake test detects freeze damage in adsorbed vaccines."},{"s":"en","t":"Ear","st":"Inner ear & hearing tests","hy":3,"q":"In the left ear, Rinne test is negative and the Weber test lateralises to the left. The most likely diagnosis is:","o":["Left conductive hearing loss","Left sensorineural hearing loss","Right conductive hearing loss","Bilateral normal hearing"],"a":0,"e":"Negative Rinne means bone conduction is better than air conduction, which indicates conductive loss. In conductive loss, Weber lateralises to the affected ear.","p":"Weber goes to the worse ear in conductive loss and to the better ear in sensorineural loss. A false-negative Rinne occurs with severe unilateral SNHL due to transcranial transfer of sound to the other ear."},{"s":"en","t":"Nose & Paranasal Sinuses","st":"Nasal septum & epistaxis","hy":3,"q":"The most common site of epistaxis is:","o":["Little's area on the anteroinferior nasal septum","Woodruff's plexus","Middle turbinate","Roof of the nasal cavity"],"a":0,"e":"Little's area contains Kiesselbach's plexus, an anastomosis of the anterior ethmoidal, sphenopalatine, greater palatine and superior labial (septal branch) arteries. It is exposed to drying and trauma.","p":"Woodruff's plexus (posterior, beneath the inferior turbinate) is a source of posterior epistaxis in older, hypertensive adults."},{"s":"en","t":"Ear","st":"Otosclerosis","hy":3,"q":"In otosclerosis, the Carhart notch on bone-conduction audiometry is seen at:","o":["2000 Hz","500 Hz","4000 Hz","8000 Hz"],"a":0,"e":"Stapes fixation produces an artefactual dip in bone conduction, maximal at 2000 Hz. It disappears after successful stapes surgery.","p":"Noise-induced hearing loss shows a notch at 4000 Hz. Otosclerosis typically shows paracusis Willisii (hearing better in noise) and a Schwartze sign (flamingo-pink flush on the promontory)."},{"s":"en","t":"Ear","st":"Middle ear & CSOM","hy":3,"q":"Gradenigo syndrome consists of ear discharge, deep retro-orbital pain and:","o":["Lateral rectus palsy","Facial nerve palsy","Hoarseness of voice","Vertigo"],"a":0,"e":"Gradenigo syndrome results from petrous apicitis. The inflammation involves the abducens nerve in Dorello's canal (lateral rectus palsy and diplopia) and the trigeminal ganglion (retro-orbital pain).","p":"Petrous apicitis is a complication of otitis media; CT or MRI confirms it."},{"s":"en","t":"Pharynx","st":"Tonsils & adenoids","hy":3,"q":"Quinsy is a collection of pus in the:","o":["Peritonsillar space","Parapharyngeal space","Retropharyngeal space","Tonsillar crypts"],"a":0,"e":"Quinsy (peritonsillar abscess) lies between the tonsillar capsule and the superior constrictor muscle. It causes trismus, a 'hot potato' voice, and displacement of the uvula to the opposite side.","p":"Incise at the most bulging point or where a line along the base of the uvula meets a line along the anterior pillar. Interval tonsillectomy is usually done about 6 weeks later."},{"s":"en","t":"Ear","st":"Middle ear & CSOM","hy":2,"q":"An abscess deep to the sternocleidomastoid following mastoiditis is called:","o":["Bezold abscess","Citelli abscess","Luc abscess","Zygomatic abscess"],"a":0,"e":"Pus breaks through the medial surface of the mastoid tip and tracks deep to the sternocleidomastoid, producing a Bezold abscess.","p":"Citelli = along the posterior belly of digastric. Luc = deep to temporalis via the external auditory canal. Postauricular abscess is the most common mastoid abscess."},{"s":"en","t":"Nose & Paranasal Sinuses","st":"Tumours","hy":3,"q":"Anterior bowing of the posterior wall of the maxillary antrum on imaging (Holman-Miller sign) is characteristic of:","o":["Juvenile nasopharyngeal angiofibroma","Inverted papilloma","Antrochoanal polyp","Carcinoma of the maxilla"],"a":0,"e":"JNA arises near the sphenopalatine foramen and expands into the pterygopalatine fossa, pushing the posterior antral wall forward. It occurs in adolescent boys with recurrent profuse epistaxis and nasal obstruction.","p":"Biopsy is avoided in suspected JNA because of the risk of torrential bleeding. Diagnosis is by contrast CT or MRI. Treatment is surgical excision after preoperative embolisation."},{"s":"en","t":"Ear","st":"Facial nerve","hy":3,"q":"A 35-year-old develops sudden onset unilateral lower motor neuron facial weakness with no other findings. The most appropriate initial management within 72 hours is:","o":["Oral corticosteroids","Immediate facial nerve decompression","Intravenous acyclovir alone","Botulinum toxin injection"],"a":0,"e":"For Bell's palsy, oral prednisolone started within 72 hours improves recovery. Eye care (lubricants, taping at night) prevents exposure keratitis. Antivirals alone are not recommended.","p":"About 70-85% of patients recover fully. Forehead sparing suggests an upper motor neuron (central) lesion, not Bell's palsy."},{"s":"op","t":"Glaucoma","st":"Angle closure","hy":3,"q":"The definitive treatment for acute primary angle-closure glaucoma, once the pressure has been controlled, is:","o":["Laser peripheral iridotomy","Trabeculectomy as the first step","Long-term oral acetazolamide","Topical atropine"],"a":0,"e":"After medical lowering of IOP (IV acetazolamide, topical beta-blocker, pilocarpine, hyperosmotic agents), laser peripheral iridotomy relieves pupillary block. A prophylactic iridotomy is also done in the fellow eye.","p":"Mydriatics such as atropine can precipitate angle closure in an eye with a narrow angle."},{"s":"op","t":"Retina","st":"Retinal vascular disease","hy":3,"q":"Sudden painless loss of vision with a pale, oedematous retina and a cherry-red spot at the macula suggests:","o":["Central retinal artery occlusion","Central retinal vein occlusion","Retinal detachment","Vitreous haemorrhage"],"a":0,"e":"In CRAO the ischaemic inner retina becomes opaque and white, while the fovea, which is thin and supplied by the choroid, keeps its red colour.","p":"Central retinal vein occlusion has a 'blood and thunder' fundus. A cherry-red spot also occurs in Tay-Sachs and Niemann-Pick disease."},{"s":"op","t":"Uvea","st":"Uveitis","hy":2,"q":"Koeppe nodules at the pupillary margin are a sign of:","o":["Granulomatous anterior uveitis","Acute angle-closure glaucoma","Bacterial keratitis","Allergic conjunctivitis"],"a":0,"e":"Granulomatous uveitis shows mutton-fat keratic precipitates and iris nodules: Koeppe nodules at the pupillary margin and Busacca nodules on the iris surface.","p":"Causes of granulomatous uveitis include sarcoidosis, tuberculosis, syphilis and Vogt-Koyanagi-Harada disease."},{"s":"op","t":"Community Ophthalmology","st":"Blindness","hy":3,"q":"The most common cause of blindness in India is:","o":["Cataract","Refractive error","Glaucoma","Corneal opacity"],"a":0,"e":"National blindness surveys in India have consistently found cataract to be the leading cause of blindness. Uncorrected refractive error is the leading cause of visual impairment.","p":"India's blindness programme (NPCBVI) prioritises cataract surgery with intraocular lens implantation."},{"s":"op","t":"Neuro-ophthalmology","st":"Pupil","hy":3,"q":"A relative afferent pupillary defect is best detected by:","o":["Swinging flashlight test","Cover-uncover test","Schirmer test","Ishihara chart"],"a":0,"e":"When the light swings from the normal eye to the affected eye, both pupils dilate (Marcus Gunn pupil), because less light signal reaches the midbrain from the damaged optic nerve or retina.","p":"RAPD indicates an optic nerve lesion (e.g. optic neuritis) or extensive retinal disease. It does not occur with cataract or refractive error."},{"s":"op","t":"Conjunctiva & Cornea","st":"Conjunctivitis & trachoma","hy":3,"q":"Herbert's pits are a feature of:","o":["Trachoma","Vernal keratoconjunctivitis","Adenoviral conjunctivitis","Herpes simplex keratitis"],"a":0,"e":"Herbert's pits are depressions at the limbus left by healed limbal follicles, and are pathognomonic of trachoma (Chlamydia trachomatis serotypes A-C).","p":"WHO SAFE strategy: Surgery for trichiasis, Antibiotics (azithromycin), Facial cleanliness, Environmental improvement. Arlt's line is scarring of the upper tarsal conjunctiva."},{"s":"op","t":"Uvea","st":"Uveitis","hy":3,"q":"A young man has a painful red eye with photophobia, circumcorneal (ciliary) congestion, a small sluggish pupil and normal intraocular pressure. The most likely diagnosis is:","o":["Acute anterior uveitis","Acute angle-closure glaucoma","Acute bacterial conjunctivitis","Subconjunctival haemorrhage"],"a":0,"e":"Anterior uveitis produces ciliary flush, photophobia and a miosed pupil from iris sphincter spasm. Angle closure gives a mid-dilated fixed pupil with high IOP. Conjunctivitis gives superficial congestion with a normal pupil.","p":"Treat with topical steroids and cycloplegics (which relieve pain and prevent posterior synechiae). Recurrent acute anterior uveitis in a young man suggests HLA-B27 disease, e.g. ankylosing spondylitis."},{"s":"op","t":"Optics & Refraction","st":"Visual acuity","hy":2,"q":"The standard testing distance for a Snellen chart is:","o":["6 metres","3 metres","1 metre","10 metres"],"a":0,"e":"At 6 metres the light rays from the chart are practically parallel, so accommodation is not needed.","p":"Each Snellen letter subtends 5 minutes of arc at its specified distance, and each limb of the letter subtends 1 minute."},{"s":"me","t":"Cardiology","st":"Arrhythmias","hy":3,"q":"A haemodynamically stable patient has a regular narrow-complex tachycardia at 180/min that persists after vagal manoeuvres. The drug of choice is:","o":["Intravenous adenosine","Intravenous amiodarone","Oral digoxin","Intravenous lignocaine"],"a":0,"e":"Adenosine briefly blocks AV nodal conduction, terminating re-entrant supraventricular tachycardias that involve the AV node. It is given as a rapid IV bolus with a saline flush.","p":"Adenosine causes transient chest discomfort and flushing. Its effect is reduced by theophylline and increased by dipyridamole. Use with caution in severe asthma."},{"s":"me","t":"Respiratory","st":"Pneumonia","hy":3,"q":"The most common cause of community-acquired pneumonia in adults is:","o":["Streptococcus pneumoniae","Mycoplasma pneumoniae","Klebsiella pneumoniae","Staphylococcus aureus"],"a":0,"e":"Pneumococcus remains the most frequently identified bacterial cause of CAP. It typically causes lobar consolidation with rusty sputum.","p":"Klebsiella: alcoholics, 'red currant jelly' sputum, bulging fissure. Staph aureus: post-influenza, cavities and pneumatoceles. CURB-65 grades CAP severity."},{"s":"me","t":"Nephrology","st":"Electrolytes","hy":3,"q":"Which set of findings fits SIADH?","o":["Hyponatraemia, euvolaemia, inappropriately concentrated urine with urine sodium >30 mmol/L","Hyponatraemia, hypovolaemia, urine sodium <20 mmol/L","Hypernatraemia with dilute urine","Hyponatraemia with oedema and low urine sodium"],"a":0,"e":"In SIADH excess ADH retains water, causing dilutional hypotonic hyponatraemia in a clinically euvolaemic patient. Urine is inappropriately concentrated and urinary sodium remains high.","p":"Treat with fluid restriction first. Correct chronic hyponatraemia slowly (generally ≤10 mmol/L in 24 hours) to avoid osmotic demyelination. Small cell lung cancer is a classic cause."},{"s":"me","t":"Endocrinology","st":"Diabetes","hy":3,"q":"In adult diabetic ketoacidosis, the first step in management is usually:","o":["IV isotonic (0.9%) saline","IV insulin bolus before any fluids","IV sodium bicarbonate","Oral fluids and subcutaneous insulin"],"a":0,"e":"Patients with DKA are markedly fluid-depleted. Initial resuscitation with isotonic saline restores volume and lowers glucose. Fixed-rate IV insulin follows. Check potassium before insulin, because insulin drives K+ into cells.","p":"If serum potassium is below 3.3 mmol/L, replace it before starting insulin. Add dextrose when glucose falls to about 250 mg/dL. Bicarbonate is reserved for severe acidosis (pH below about 6.9)."},{"s":"me","t":"Neurology","st":"Spinal cord","hy":3,"q":"Hemisection of the spinal cord (Brown-Séquard syndrome) produces below the lesion:","o":["Ipsilateral weakness and loss of proprioception, with contralateral loss of pain and temperature","Contralateral weakness with ipsilateral loss of pain and temperature","Bilateral loss of pain and temperature only","Ipsilateral loss of all sensory modalities only"],"a":0,"e":"Corticospinal and dorsal column fibres cross in the medulla, so their loss is ipsilateral. Spinothalamic fibres cross within one or two segments of entry, so pain and temperature loss is contralateral.","p":"Anterior cord syndrome: loss of motor function and pain/temperature with preserved proprioception. Central cord syndrome: arms weaker than legs, often after a hyperextension injury."},{"s":"me","t":"Rheumatology","st":"Arthritis","hy":3,"q":"Which antibody is most specific for rheumatoid arthritis?","o":["Anti-cyclic citrullinated peptide (anti-CCP)","Rheumatoid factor","Antinuclear antibody","Anti-dsDNA"],"a":0,"e":"Anti-CCP has specificity above 95% for RA and predicts erosive disease. Rheumatoid factor is less specific; it occurs in other conditions and in
