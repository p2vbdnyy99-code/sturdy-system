<!-- bundle:start --><script type="application/json" id="bundle">{"data":{"enrich-1.json":{"s1-0":{"pyq":1,"ref":"BD Chaurasia's Human Anatomy (Upper Limb); Gray's Anatomy","w":["Correct. The axillary nerve winds round the surgical neck, supplies deltoid and teres minor, and gives the upper lateral cutaneous nerve of the arm (the 'badge' area).","Suprascapular nerve supplies supraspinatus and infraspinatus. Injury weakens the first 15° of abduction and lateral rotation, and causes no skin loss over the deltoid.","Radial nerve is injured in the spiral groove (midshaft fracture), causing wrist drop. Shoulder abduction is spared.","Musculocutaneous nerve injury weakens elbow flexion and supination, with sensory loss on the lateral forearm, not over the deltoid."],"mm":{"c":"Axillary nerve (C5, C6)","n":[{"t":"Course","k":["Posterior cord","Quadrangular space","Winds round surgical neck"]},{"t":"Supplies","k":["Deltoid","Teres minor","Skin over lower deltoid"]},{"t":"Injured by","k":["Surgical neck fracture","Anterior shoulder dislocation","Wrong IM injection site"]},{"t":"Signs","k":["Abduction lost beyond ~15°","Flattened shoulder contour","'Regimental badge' anaesthesia"]}]},"tb":{"h":["Humerus site","Nerve at risk","Sign"],"r":[["Surgical neck","Axillary","Loss of abduction 15-90°"],["Spiral groove (midshaft)","Radial","Wrist drop"],["Supracondylar","Median (AIN)","Cannot make 'OK' sign"],["Medial epicondyle","Ulnar","Claw hand"]]},"steps":["Fracture site given: surgical neck of humerus.","Ask which nerve hugs that site: the axillary nerve.","Check motor: deltoid paralysed, so abduction stops after supraspinatus starts it.","Check sensory: lower deltoid skin = upper lateral cutaneous nerve of arm, a branch of axillary. Diagnosis confirmed."],"mn":"Fracture-nerve pairs, top to bottom of the humerus: 'ARMU' = Axillary, Radial, Median, Ulnar."},"s1-1":{"ref":"BD Chaurasia's Human Anatomy (Upper Limb); Gray's Anatomy","w":["Correct. A wrist-level ulnar injury spares FDP to the ring and little fingers, so their distal joints flex more and the claw looks worse.","Froment sign tests adductor pollicis (ulnar): the patient flexes the thumb IP joint with FPL when gripping paper.","Wartenberg sign is persistent abduction of the little finger from weak palmar interossei. It is a sign, not the paradox.","Benediction attitude is seen when the median nerve is injured above the elbow and the patient tries to make a fist."],"mm":{"c":"Ulnar paradox","n":[{"t":"High lesion (elbow)","k":["FDP medial half paralysed","Less DIP flexion","Milder claw"]},{"t":"Low lesion (wrist)","k":["FDP spared","Unopposed long flexors","Marked claw"]},{"t":"Claw mechanics","k":["Lumbricals 3-4 lost","MCP hyperextension","IP flexion"]}]},"steps":["Clawing = MCP hyperextension + IP flexion of the ring and little fingers.","IP flexion needs a working FDP (medial half = ulnar nerve in the forearm).","A wrist lesion keeps FDP working, so flexion is stronger and the claw more obvious.","A higher lesion paralyses FDP too, so the claw is milder: this is the paradox."],"mn":"'Higher lesion, lesser claw.'"},"s1-2":{"ref":"Gray's Anatomy (Thorax); BD Chaurasia","w":["Correct. The SA nodal artery arises from the RCA in about 60% of people.","LAD supplies the anterior septum and anterior LV wall. It is not the usual origin of the SA nodal artery.","The circumflex gives the SA nodal artery in the remaining ~40%, so it is not the most common origin.","The posterior interventricular artery supplies the posterior septum and, in right dominance, comes from the RCA. It does not give the SA nodal artery."],"mm":{"c":"Coronary supply of conduction system","n":[{"t":"SA node","k":["RCA ~60%","LCx ~40%"]},{"t":"AV node","k":["Dominant artery","RCA in ~80-90% (right dominance)"]},{"t":"Clinical","k":["Inferior MI (RCA) → bradycardia, AV block"]}]},"steps":["Recall the SA nodal artery runs up to the crista terminalis area.","Most often it is a branch of the RCA.","Contrast with the AV nodal artery, which follows dominance.","Link: RCA occlusion (inferior MI) causes sinus bradycardia or AV block."]},"s1-3":{"pyq":1,"ref":"Harrison's Principles of Internal Medicine (neuro-ophthalmology); Vishram Singh Neuroanatomy","w":["Correct. Right MLF lesion: the right eye cannot adduct on left gaze, and the abducting left eye shows nystagmus. Convergence is preserved.","An abducens nucleus lesion causes ipsilateral horizontal gaze palsy (both eyes cannot look to that side), not isolated failure of adduction.","An oculomotor nerve palsy would also impair convergence, cause ptosis and a 'down and out' eye, and often a dilated pupil.","A PPRF lesion causes conjugate gaze palsy to the same side, again affecting both eyes."],"mm":{"c":"Internuclear ophthalmoplegia","n":[{"t":"Lesion","k":["Medial longitudinal fasciculus","Named for side that fails to adduct"]},{"t":"Findings","k":["No adduction on lateral gaze","Nystagmus of abducting eye","Convergence intact"]},{"t":"Causes","k":["Young: multiple sclerosis","Old: brainstem infarct"]},{"t":"Variants","k":["Bilateral INO = MS","One-and-a-half syndrome = PPRF/VI nucleus + MLF"]}]},"steps":["Abnormal eye: the right eye fails to adduct.","Adduction works on convergence, so the III nerve and medial rectus are fine.","The lesion must be in the pathway linking the left VI nucleus to the right III nucleus: the right MLF.","Young woman + INO = think multiple sclerosis."],"mn":"'MLF = MS Loves Fasciculus': bilateral INO in a young adult is MS until proven otherwise."},"s1-4":{"pyq":1,"ref":"Dhingra's Diseases of Ear, Nose and Throat; Gray's Anatomy","w":["Correct. Cricothyroid is the only intrinsic laryngeal muscle supplied by the external laryngeal nerve.","Posterior cricoarytenoid (the only abductor) is supplied by the recurrent laryngeal nerve.","Lateral cricoarytenoid (adductor) is supplied by the recurrent laryngeal nerve.","Thyroarytenoid (relaxes cords) is supplied by the recurrent laryngeal nerve."],"mm":{"c":"Nerve supply of the larynx","n":[{"t":"External laryngeal nerve","k":["Cricothyroid only","Tenses the cords","Runs with superior thyroid artery"]},{"t":"Recurrent laryngeal nerve","k":["All other intrinsic muscles","Sensation below the cords"]},{"t":"Internal laryngeal nerve","k":["Sensation above the cords","Piriform fossa"]}]},"steps":["Remember the rule: the recurrent laryngeal nerve supplies all intrinsic muscles except one.","The exception is cricothyroid, on the outside of the larynx.","Its nerve is the external laryngeal branch of the superior laryngeal nerve.","Clinical link: injury in thyroidectomy gives voice fatigue and loss of high pitch."],"mn":"'Cricothyroid is the outsider': on the outside, with the outside (external) nerve."},"s1-5":{"ref":"BD Chaurasia's Human Anatomy (Abdomen); Gray's Anatomy","w":["Correct. The free border of the lesser omentum, containing the portal triad, lies in front of the foramen.","The IVC forms the posterior boundary.","The caudate process of the liver forms the superior boundary.","The first part of the duodenum forms the inferior boundary."],"mm":{"c":"Epiploic foramen (of Winslow)","n":[{"t":"Anterior","k":["Free border of lesser omentum","Portal vein (behind)","Hepatic artery (left)","CBD (right)"]},{"t":"Posterior","k":["IVC"]},{"t":"Superior","k":["Caudate process"]},{"t":"Inferior","k":["1st part of duodenum"]}]},"steps":["The foramen connects the greater sac to the lesser sac.","Put a finger in it: in front is the hepatoduodenal ligament.","Behind is the IVC, above the caudate process, below the duodenum.","Surgical use: the Pringle manoeuvre compresses the anterior boundary."],"mn":"Hepatoduodenal ligament contents, right to left: 'DAVe' = Duct (CBD) right, Artery left, Vein behind."},"s1-6":{"pyq":1,"ref":"Langman's Medical Embryology; Inderbir Singh's Human Embryology","w":["Correct. The second arch (Reichert cartilage) forms the stapes, styloid process and lesser horn of the hyoid.","The first arch (Meckel cartilage) forms the malleus and incus, not the stapes.","The third arch forms the greater horn and lower body of the hyoid.","The fourth arch forms laryngeal cartilages (thyroid), not ear ossicles."],"mm":{"c":"Pharyngeal arch derivatives","n":[{"t":"1st arch (V3)","k":["Malleus, incus","Muscles of mastication","Meckel cartilage"]},{"t":"2nd arch (VII)","k":["Stapes, styloid","Lesser horn of hyoid","Muscles of facial expression"]},{"t":"3rd arch (IX)","k":["Greater horn of hyoid","Stylopharyngeus"]},{"t":"4th & 6th (X)","k":["Laryngeal cartilages","Pharyngeal and laryngeal muscles"]}]},"tb":{"h":["Arch","Nerve","Key skeletal derivative"],"r":[["1st","Mandibular (V3)","Malleus, incus"],["2nd","Facial (VII)","Stapes, styloid, lesser horn of hyoid"],["3rd","Glossopharyngeal (IX)","Greater horn of hyoid"],["4th & 6th","Vagus (X)","Thyroid, cricoid, arytenoid cartilages"]]},"steps":["Ear ossicles come from the first two arches.","Malleus and incus: first arch.","Stapes: second arch (a stapes 'S' for second).","Match the nerve: the 2nd arch nerve is the facial nerve, which also supplies stapedius."],"mn":"'S for Stapes, S for Second (and Styloid).'"},"s1-7":{"pyq":1,"ref":"BD Chaurasia's Human Anatomy (Lower Limb); Gray's Anatomy","w":["Correct. Standing on the right leg, the right gluteus medius and minimus (superior gluteal nerve) must hold the pelvis level. When they are weak, the left side drops.","The left superior gluteal nerve would cause a drop on the right when standing on the left leg.","The inferior gluteal nerve supplies gluteus maximus. Its loss affects rising from sitting and climbing stairs, not pelvic tilt.","The femoral nerve supplies quadriceps (knee extension), which does not stabilise the pelvis in single-leg stance."],"mm":{"c":"Trendelenburg sign","n":[{"t":"Muscles","k":["Gluteus medius","Gluteus minimus","Hip abductors"]},{"t":"Nerve","k":["Superior gluteal (L4-S1)"]},{"t":"Finding","k":["Pelvis drops on unsupported side","Lesion on stance side"]},{"t":"Other causes","k":["Hip dislocation (DDH)","Coxa vara","Neck of femur non-union"]}]},"steps":["Identify the stance leg: right.","Hip abductors of the stance leg keep the opposite side of the pelvis up.","If the left side drops, the right abductors are weak.","The right hip abductors are supplied by the right superior gluteal nerve."],"mn":"'The Sound Side Sags': the pelvis drops on the healthy side."},"s1-8":{"pyq":1,"ref":"Guyton and Hall Textbook of Medical Physiology; Harrison's","w":["Correct. In AV dissociation the atrium sometimes contracts against a closed tricuspid valve, giving large intermittent cannon waves.","Atrial fibrillation has no organised atrial contraction, so the 'a' wave is absent.","Tricuspid regurgitation gives large 'v' (cv) waves, not cannon 'a' waves.","Constrictive pericarditis gives a steep 'y' descent (and Kussmaul sign)."],"mm":{"c":"JVP waveform","n":[{"t":"a wave","k":["Atrial contraction","Absent: AF","Large: TS, PAH","Cannon: CHB, VT"]},{"t":"c wave","k":["Tricuspid bulging into RA"]},{"t":"x descent","k":["Atrial relaxation"]},{"t":"v wave","k":["Venous filling","Large: TR"]},{"t":"y descent","k":["Tricuspid opening","Steep: constriction"]}]},"tb":{"h":["JVP change","Condition"],"r":[["Absent a","Atrial fibrillation"],["Giant a (regular)","Tricuspid stenosis, pulmonary hypertension"],["Cannon a (irregular)","Complete heart block"],["Large v","Tricuspid regurgitation"],["Steep y","Constrictive pericarditis"]]},"steps":["'a' = atrial contraction.","Cannon = atrium contracts against a closed valve.","This happens when atria and ventricles beat independently.","Complete heart block causes AV dissociation, so cannon waves appear."]},"s1-9":{"ref":"Guyton and Hall Textbook of Medical Physiology; West's Respiratory Physiology","w":["Correct. Perfusion falls more steeply than ventilation towards the apex, so V/Q is highest there (about 3).","The base has the lowest V/Q (about 0.6) because perfusion is greatest there.","The mid-zone has an intermediate ratio.","V/Q is not uniform; gravity creates a gradient from apex to base."],"mm":{"c":"V/Q in the upright lung","n":[{"t":"Apex","k":["V/Q ~3","High PO2","Favoured by TB"]},{"t":"Base","k":["V/Q ~0.6","Most ventilation and perfusion"]},{"t":"Extremes","k":["Dead space: V/Q = ∞","Shunt: V/Q = 0"]}]},"steps":["Both ventilation and perfusion increase towards the base.","Perfusion increases much more steeply.","So the ratio is highest where perfusion is least: the apex.","Clinical link: high apical PO2 suits reactivated TB."],"mn":"'Apex has Air, Base has Blood.'"},"s1-10":{"pyq":1,"ref":"Guyton and Hall Textbook of Medical Physiology","w":["Correct. Inulin is freely filtered and neither reabsorbed nor secreted, so its clearance equals GFR.","PAH clearance measures effective renal plasma flow; it is almost completely secreted.","Creatinine is slightly secreted, so it overestimates GFR, though it is used clinically.","Urea is partly reabsorbed, so its clearance underestimates GFR."],"mm":{"c":"Renal clearance","n":[{"t":"GFR markers","k":["Inulin (gold standard)","Creatinine (clinical)","Cystatin C"]},{"t":"RPF marker","k":["PAH"]},{"t":"Formula","k":["C = UV / P"]},{"t":"Clearance = 0","k":["Glucose (normal)","Amino acids"]}]},"tb":{"h":["Substance","Clearance compared with GFR"],"r":[["Inulin","= GFR"],["Creatinine","Slightly > GFR"],["Urea","< GFR"],["PAH","≈ renal plasma flow"],["Glucose","0 (normally)"]]},"steps":["Ideal GFR marker: freely filtered, not reabsorbed, not secreted, not metabolised.","Only inulin meets all four.","Creatinine is practical but slightly secreted.","PAH is for plasma flow, not GFR."]},"s1-11":{"ref":"Guyton and Hall Textbook of Medical Physiology; Lippincott Biochemistry","w":["Correct. GH binds a cytokine-type receptor that activates JAK2, which phosphorylates STAT proteins.","Insulin acts through a receptor tyrosine kinase (intrinsic kinase activity), not JAK-STAT.","Glucagon acts through a Gs-coupled receptor that raises cAMP.","Aldosterone is a steroid acting on an intracellular nuclear receptor."],"mm":{"c":"Hormone receptor types","n":[{"t":"JAK-STAT","k":["GH","Prolactin","EPO","Cytokines (IL, G-CSF)"]},{"t":"Receptor tyrosine kinase","k":["Insulin","IGF-1","Growth factors"]},{"t":"cAMP","k":["Glucagon","ACTH","TSH","PTH"]},{"t":"Nuclear","k":["Steroids","Thyroid hormone","Vitamin D"]}]},"steps":["Classify each option by receptor type.","Insulin: receptor tyrosine kinase.","Glucagon: G protein → cAMP. Aldosterone: nuclear receptor.","GH: cytokine receptor family → JAK-STAT."],"mn":"JAK-STAT hormones: 'PIGEonhole' = Prolactin, Interleukins, GH, EPO."},"s1-12":{"ref":"Guyton and Hall Textbook of Medical Physiology","w":["Correct. Na+ channel inactivation gates stay closed until the membrane repolarises, so no new spike is possible.","K+ channel opening repolarises the membrane and contributes to the relative refractory period, not the absolute.","The Na+/K+ pump maintains gradients over the long term; it does not cause refractoriness.","Chloride channels do not determine the refractory period of nerve."],"mm":{"c":"Refractory periods","n":[{"t":"Absolute","k":["Na+ channels inactivated","No stimulus can fire"]},{"t":"Relative","k":["Some Na+ channels recovered","K+ conductance high","Stronger stimulus needed"]},{"t":"Purpose","k":["One-way conduction","Limits firing frequency"]}]},"steps":["Voltage-gated Na+ channels have three states: closed, open and inactivated.","After opening they become inactivated and cannot reopen at once.","While most are inactivated, no stimulus can trigger a spike: the absolute refractory period.","As they recover, a stronger stimulus can fire the nerve: the relative refractory period."]},"s1-13":{"ref":"Guyton and Hall Textbook of Medical Physiology; Ganong's Review of Medical Physiology","w":["Correct. I cells in the duodenum and jejunum release CCK in response to fat and protein.","S cells release secretin (bicarbonate-rich pancreatic juice).","G cells in the antrum release gastrin (acid secretion).","K cells release GIP (glucose-dependent insulinotropic peptide)."],"mm":{"c":"GI hormones and their cells","n":[{"t":"CCK","k":["I cells","Gallbladder contraction","Pancreatic enzymes"]},{"t":"Secretin","k":["S cells","Bicarbonate"]},{"t":"Gastrin","k":["G cells (antrum)","Acid"]},{"t":"GIP / GLP-1","k":["K cells / L cells","Incretins"]},{"t":"Somatostatin","k":["D cells","Inhibits all"]}]},"tb":{"h":["Hormone","Cell","Main stimulus"],"r":[["CCK","I","Fat, amino acids"],["Secretin","S","Acid in duodenum"],["Gastrin","G","Peptides, vagal stimulation"],["GIP","K","Glucose, fat"],["GLP-1","L","Glucose"]]},"steps":["The letter of the cell often matches: G for gastrin, S for secretin, K for GIP.","CCK is the exception to remember: I cells.","I cells sit in the duodenum and jejunum.","Fat in the duodenum → CCK → gallbladder empties."],"mn":"'I See Cholecystokinin': I cells."},"s1-14":{"pyq":1,"ref":"Guyton and Hall Textbook of Medical Physiology","w":["Correct. CO increases haemoglobin's oxygen affinity, shifting the curve left and blocking unloading to tissues.","Increased 2,3-BPG lowers affinity and shifts the curve to the right.","Hypercapnia (and acidosis) shifts the curve right (Bohr effect).","Fever (raised temperature) shifts the curve right."],"mm":{"c":"O2 dissociation curve","n":[{"t":"Right shift (easy unloading)","k":["↑ CO2","↑ H+ (acid)","↑ 2,3-BPG","↑ Temperature","Exercise"]},{"t":"Left shift (holds O2)","k":["Fetal Hb","Carbon monoxide","Methaemoglobin","Alkalosis","Hypothermia"]},{"t":"P50","k":["Normal ~26-27 mmHg","Right shift ↑ P50"]}]},"steps":["Right shift = tissues get O2 more easily (exercise conditions).","CO2, acid, BPG and heat all occur in working tissue, so they shift right.","CO binds Hb and makes the other haem sites hold O2 tighter: left shift.","So CO harms twice: less O2 carried and less O2 released."],"mn":"Right shift: 'CADET, face Right' = CO2, Acid, 2,3-DPG, Exercise, Temperature."},"s1-15":{"ref":"Guyton and Hall Textbook of Medical Physiology; Ganong","w":["Correct. Sleep spindles and K-complexes define stage N2.","N1 is light sleep with theta waves and vertex sharp waves.","N3 (slow-wave sleep) shows high-amplitude delta waves.","REM shows low-voltage mixed frequency and sawtooth waves, with rapid eye movements and muscle atonia."],"mm":{"c":"Sleep stages","n":[{"t":"Awake","k":["Beta (alert)","Alpha (eyes closed)"]},{"t":"N1","k":["Theta"]},{"t":"N2","k":["Spindles","K-complexes","Most of the night"]},{"t":"N3","k":["Delta","Night terrors, sleepwalking"]},{"t":"REM","k":["Sawtooth waves","Dreams, nightmares","Atonia"]}]},"steps":["Spindles and K-complexes are unique EEG markers.","They appear only in stage N2.","N3 is defined by delta waves instead.","Remember the parasomnias: N3 = night terrors and sleepwalking; REM = nightmares."],"mn":"'At Night, BATS Drink Blood': Beta, Alpha, Theta, Spindles/K (N2), Delta (N3), Beta-like REM."},"s1-16":{"pyq":1,"ref":"Harper's Illustrated Biochemistry; Lippincott Illustrated Reviews: Biochemistry","w":["Correct. Glucose-6-phosphatase deficiency (von Gierke) blocks free glucose release from both glycogenolysis and gluconeogenesis.","Acid maltase deficiency (Pompe) causes cardiomegaly and hypotonia, not fasting hypoglycaemia with lactic acidosis.","Muscle phosphorylase deficiency (McArdle) causes exercise cramps and myoglobinuria, not liver features.","Debranching enzyme deficiency (Cori) causes milder hypoglycaemia with normal lactate, because gluconeogenesis still works."],"mm":{"c":"Von Gierke (GSD I)","n":[{"t":"Enzyme","k":["Glucose-6-phosphatase"]},{"t":"Features","k":["Severe fasting hypoglycaemia","Hepatomegaly, doll face","Lactic acidosis","Hyperuricaemia","Hyperlipidaemia"]},{"t":"Why","k":["G6P can't become glucose","Diverted to lactate, urate, TG"]},{"t":"Treatment","k":["Frequent feeds","Uncooked cornstarch"]}]},"tb":{"h":["GSD","Enzyme","Hallmark"],"r":[["I von Gierke","Glucose-6-phosphatase","Hypoglycaemia + lactic acidosis"],["II Pompe","Acid maltase","Cardiomegaly"],["III Cori","Debranching enzyme","Milder, normal lactate"],["V McArdle","Muscle phosphorylase","Exercise cramps, myoglobinuria"]]},"steps":["Fasting hypoglycaemia + hepatomegaly = a liver GSD.","Add lactic acidosis, urate and lipids: the block is at the very last step.","The last step of both glycogenolysis and gluconeogenesis is glucose-6-phosphatase.","So the diagnosis is von Gierke disease."],"mn":"GSD names in order: 'Very Poor Carbohydrate Metabolism' = Von Gierke, Pompe, Cori, McArdle (I, II, III, V)."},"s1-17":{"ref":"Harper's Illustrated Biochemistry; KD Tripathi (statins)","w":["Correct. HMG-CoA reductase (HMG-CoA → mevalonate) is the regulated, committed step and the statin target.","HMG-CoA synthase forms HMG-CoA; it is not rate-limiting for cholesterol.","Squalene epoxidase is a later step and is not the main regulatory point.","Mevalonate kinase acts after the committed step."],"mm":{"c":"Cholesterol synthesis","n":[{"t":"Path","k":["Acetyl-CoA","HMG-CoA","Mevalonate","Squalene","Cholesterol"]},{"t":"Rate-limiting","k":["HMG-CoA reductase","Statins inhibit"]},{"t":"Regulation","k":["Insulin ↑","Glucagon, cholesterol ↓"]}]},"steps":["The committed step of a pathway is usually the regulated one.","For cholesterol it is HMG-CoA → mevalonate.","The enzyme is HMG-CoA reductase.","Statins competitively inhibit it and so lower LDL."]},"s1-18":{"pyq":1,"ref":"Harper's Illustrated Biochemistry; Nelson Textbook of Pediatrics","w":["Correct. OTC deficiency: carbamoyl phosphate accumulates and spills into pyrimidine synthesis, producing orotic acid.","CPS-I deficiency causes hyperammonaemia without orotic aciduria (no carbamoyl phosphate is made).","Argininosuccinate synthetase deficiency (citrullinaemia) causes high citrulline.","Arginase deficiency causes high arginine and spastic diplegia, with milder hyperammonaemia."],"mm":{"c":"Urea cycle defects","n":[{"t":"OTC (commonest)","k":["X-linked","↑ Orotic acid","↓ Citrulline"]},{"t":"CPS-I","k":["No orotic aciduria","↓ Citrulline"]},{"t":"ASS / ASL","k":["↑ Citrulline","ASL: ↑ argininosuccinate, brittle hair"]},{"t":"Arginase","k":["↑ Arginine","Spasticity"]}]},"steps":["Hyperammonaemia in a neonate: think urea cycle.","Low citrulline places the block before citrulline: CPS-I or OTC.","Orotic aciduria separates them: present in OTC deficiency.","Male infant fits X-linked OTC deficiency."],"mn":"'OTC = Orotic, Toxic ammonia, Chromosome X.'"},"s1-19":{"ref":"Harper's Illustrated Biochemistry","w":["Correct. Transketolase needs TPP; its activity in RBCs reflects thiamine status.","Erythrocyte glutathione reductase assesses riboflavin (B2).","Erythrocyte aminotransferase assesses pyridoxine (B6).","Pyruvate kinase deficiency is a red cell enzymopathy, not a vitamin test."],"mm":{"c":"Functional vitamin tests","n":[{"t":"B1 thiamine","k":["RBC transketolase"]},{"t":"B2 riboflavin","k":["RBC glutathione reductase"]},{"t":"B6 pyridoxine","k":["RBC aminotransferase","Tryptophan load"]},{"t":"Folate / B12","k":["FIGLU (folate)","Methylmalonic acid (B12)"]}]},"steps":["Find the enzyme that needs the vitamin as a cofactor.","Thiamine pyrophosphate is the cofactor for transketolase.","Measure RBC transketolase with and without added TPP.","A big rise with TPP means thiamine deficiency."]},"s1-20":{"pyq":1,"ref":"Harper's Illustrated Biochemistry; Nelson Textbook of Pediatrics","w":["Correct. HGPRT deficiency (Lesch-Nyhan) causes purine overproduction, gout and self-mutilation.","ADA deficiency causes severe combined immunodeficiency, not self-mutilation.","Xanthine oxidase deficiency lowers uric acid (xanthinuria), the opposite.","PRPP synthetase overactivity causes gout but not the neurological self-injury picture."],"mm":{"c":"Lesch-Nyhan syndrome","n":[{"t":"Defect","k":["HGPRT absent","X-linked recessive"]},{"t":"Biochemistry","k":["Salvage fails","↑ PRPP","↑ De novo purines","↑ Uric acid"]},{"t":"Clinical","k":["Self-mutilation","Choreoathetosis","Gout, urate stones","Orange crystals in diaper"]},{"t":"Treatment","k":["Allopurinol (urate only)"]}]},"steps":["Self-mutilation + gout in a boy = Lesch-Nyhan.","Its enzyme is HGPRT, of the purine salvage pathway.","Without salvage, PRPP builds up and drives de novo synthesis.","Excess purines become uric acid."],"mn":"HGPRT = 'He's Got Purine Recovery Trouble.'"},"s1-21":{"ref":"Harper's Illustrated Biochemistry; Lippincott Biochemistry","w":["Correct. Western blot separates proteins and detects them with antibodies.","Southern blot detects DNA.","Northern blot detects RNA.","Lipids are not detected by Western blotting."],"mm":{"c":"Blotting techniques","n":[{"t":"Southern","k":["DNA","Probe: DNA"]},{"t":"Northern","k":["RNA","Probe: DNA/RNA"]},{"t":"Western","k":["Protein","Probe: antibody","Confirms HIV (historically)"]},{"t":"South-Western","k":["DNA-binding proteins"]}]},"steps":["Match target molecule to blot name.","Southern was named after Edwin Southern (DNA); the others were named by analogy.","Northern = RNA; Western = protein.","Western blots use antibodies as probes."],"mn":"SNoW DRoP: Southern-DNA, Northern-RNA, Western-Protein."},"s1-22":{"ref":"Harper's Illustrated Biochemistry; Robbins Basic Pathology","w":["Correct. Gaucher disease: glucocerebrosidase deficiency, with 'crumpled tissue paper' macrophages.","Sphingomyelinase deficiency (Niemann-Pick) gives foamy cells and a cherry-red spot.","Hexosaminidase A deficiency (Tay-Sachs) gives a cherry-red spot without hepatosplenomegaly.","Alpha-galactosidase A deficiency (Fabry) gives angiokeratomas and painful neuropathy."],"mm":{"c":"Lysosomal storage disorders","n":[{"t":"Gaucher","k":["Glucocerebrosidase","Crumpled tissue paper cells","Bone crises, splenomegaly","Most common"]},{"t":"Niemann-Pick","k":["Sphingomyelinase","Foam cells, cherry-red spot","HSM"]},{"t":"Tay-Sachs","k":["Hexosaminidase A","Cherry-red spot","No HSM"]},{"t":"Fabry","k":["α-galactosidase A","X-linked","Angiokeratomas"]}]},"tb":{"h":["Disease","Enzyme","Clue"],"r":[["Gaucher","Glucocerebrosidase","Crumpled tissue paper cells"],["Niemann-Pick","Sphingomyelinase","Foam cells + HSM + cherry-red spot"],["Tay-Sachs","Hexosaminidase A","Cherry-red spot, no HSM"],["Fabry","α-galactosidase A","Angiokeratoma, X-linked"],["Krabbe","Galactocerebrosidase","Globoid cells"]]},"steps":["'Crumpled tissue paper' cytoplasm is a pathognomonic image clue.","It belongs to Gaucher cells.","Gaucher = glucocerebrosidase deficiency.","Note: enzyme replacement therapy is available."]},"s1-23":{"pyq":1,"ref":"Lippincott Illustrated Reviews: Biochemistry; Harper's","w":["Correct. Competitive inhibition raises apparent Km; Vmax is reached with enough substrate.","Lower Vmax with unchanged Km describes non-competitive inhibition.","Lower Km and Vmax together describe uncompetitive inhibition.","Inhibitors never increase Vmax."],"mm":{"c":"Enzyme inhibition","n":[{"t":"Competitive","k":["Binds active site","Km ↑","Vmax same","Lines meet on y-axis"]},{"t":"Non-competitive","k":["Binds elsewhere","Km same","Vmax ↓","Lines meet on x-axis"]},{"t":"Uncompetitive","k":["Binds ES complex","Km ↓, Vmax ↓","Parallel lines"]}]},"tb":{"h":["Type","Km","Vmax"],"r":[["Competitive","↑","No change"],["Non-competitive","No change","↓"],["Uncompetitive","↓","↓"]]},"steps":["Competitive inhibitor competes with substrate for the same site.","Add lots of substrate and it wins: Vmax is still reached.","But more substrate is needed for half-maximal speed: Km rises.","On a Lineweaver-Burk plot the lines cross on the y-axis (same 1/Vmax)."],"mn":"'Competitive = Km Climbs; Non-competitive = Vmax Nosedives.'"},"s1-24":{"ref":"Robbins & Cotran Pathologic Basis of Disease; Guyton","w":["Correct. PGE2 made in the hypothalamus (induced by IL-1, TNF) raises the set point.","Bradykinin causes pain and vasodilation, not fever.","Histamine causes early increased vascular permeability.","Leukotriene B4 is a neutrophil chemoattractant."],"mm":{"c":"Fever pathway","n":[{"t":"Exogenous pyrogens","k":["LPS","Microbial products"]},{"t":"Endogenous pyrogens","k":["IL-1","TNF","IL-6"]},{"t":"Hypothalamus","k":["COX-2 ↑","PGE2 ↑","Set point ↑"]},{"t":"Antipyretics","k":["NSAIDs, paracetamol block PG synthesis"]}]},"steps":["Pyrogens act through cytokines (IL-1, TNF).","Cytokines induce COX in the hypothalamus.","The resulting PGE2 resets the thermostat upward.","NSAIDs lower fever by blocking that step."]},"s1-25":{"pyq":1,"ref":"Robbins & Cotran Pathologic Basis of Disease","w":["Correct. Follicular thyroid carcinoma lacks papillary structures and psammoma bodies.","Papillary thyroid carcinoma typically has psammoma bodies.","Serous cystadenocarcinoma of the ovary commonly shows psammoma bodies.","Meningioma classically contains psammoma bodies."],"mm":{"c":"Psammoma bodies","n":[{"t":"What","k":["Laminated calcified bodies","Dystrophic calcification"]},{"t":"Seen in","k":["Papillary thyroid Ca","Serous ovarian tumours","Meningioma","Mesothelioma"]},{"t":"Not in","k":["Follicular thyroid Ca"]}]},"steps":["Psammoma bodies form in papillary growth patterns.","List the classic four (PSaMMoma).","Follicular carcinoma is follicular, not papillary.","So it is the exception."],"mn":"PSaMMoma: Papillary thyroid, Serous ovary, Meningioma, Mesothelioma."},"s1-26":{"ref":"Robbins & Cotran Pathologic Basis of Disease; Wintrobe's Clinical Hematology","w":["Correct. Ankyrin mutations are the most common cause of hereditary spherocytosis.","Glycophorin is not a common cause of HS.","Band 3 is the second most common, not 'only'.","Spectrin (more often beta) is involved in a minority; 'alpha only' is wrong."],"mm":{"c":"Hereditary spherocytosis","n":[{"t":"Proteins","k":["Ankyrin (most common)","Band 3","Spectrin","Protein 4.2"]},{"t":"Lab","k":["↑ MCHC","Spherocytes","↑ Osmotic fragility","EMA binding ↓"]},{"t":"Clinical","k":["Haemolysis, jaundice","Splenomegaly","Gallstones","Aplastic crisis (parvovirus B19)"]},{"t":"Treatment","k":["Splenectomy"]}]},"steps":["HS is a vertical-linkage defect of the RBC membrane.","Several proteins can be involved.","The single commonest is ankyrin.","Spherical cells are trapped and destroyed in the spleen."]},"s1-27":{"pyq":1,"ref":"Robbins & Cotran Pathologic Basis of Disease; Harrison's","w":["Correct. t(15;17) PML-RARA defines acute promyelocytic leukaemia.","CML has t(9;22) BCR-ABL.","Burkitt lymphoma has t(8;14) involving MYC.","Follicular lymphoma has t(14;18) involving BCL2."],"mm":{"c":"APL (AML-M3)","n":[{"t":"Genetics","k":["t(15;17)","PML-RARA"]},{"t":"Morphology","k":["Abnormal promyelocytes","Faggot cells, Auer rods"]},{"t":"Danger","k":["DIC at presentation"]},{"t":"Treatment","k":["ATRA","Arsenic trioxide","Differentiation syndrome risk"]}]},"tb":{"h":["Translocation","Disease","Gene"],"r":[["t(15;17)","APL","PML-RARA"],["t(9;22)","CML (also some ALL)","BCR-ABL"],["t(8;14)","Burkitt","MYC"],["t(14;18)","Follicular lymphoma","BCL2"],["t(11;14)","Mantle cell","Cyclin D1"]]},"steps":["Translocation questions are pure recall: build the table.","15;17 = promyelocytic.","It creates PML-RARA, which blocks maturation.","Retinoic acid (ATRA) releases the block."],"mn":"'APL is 15-17 years old and needs vitamin A (ATRA).'"},"s1-28":{"pyq":1,"ref":"Robbins & Cotran Pathologic Basis of Disease","w":["Correct. Congo red gives apple-green birefringence under polarised light.","PAS stains glycogen and mucins; it is not specific for amyloid.","Prussian blue stains iron (haemosiderin).","Masson trichrome stains collagen."],"mm":{"c":"Amyloidosis","n":[{"t":"Stain","k":["Congo red","Apple-green birefringence"]},{"t":"Structure","k":["Cross-β-pleated sheet"]},{"t":"Types","k":["AL: light chains, myeloma","AA: chronic inflammation","Aβ: Alzheimer","ATTR: transthyretin"]},{"t":"Biopsy","k":["Abdominal fat pad","Rectal mucosa"]}]},"steps":["Amyloid is a protein with β-pleated sheet structure.","Congo red binds it.","Under polarised light it shines apple-green.","Fat pad aspiration is an easy biopsy site."]},"s1-29":{"ref":"Robbins & Cotran Pathologic Basis of Disease","w":["Correct. Flocculent mitochondrial densities indicate irreversible mitochondrial damage.","Cellular swelling is the earliest, reversible change.","Ribosome detachment from the ER is reversible.","Membrane blebbing is reversible."],"mm":{"c":"Cell injury","n":[{"t":"Reversible","k":["Cell swelling","Fatty change","Blebs","Ribosome detachment","Small mitochondrial densities"]},{"t":"Irreversible","k":["Large flocculent mitochondrial densities","Membrane rupture","Lysosomal rupture","Nuclear changes"]},{"t":"Nuclear changes","k":["Pyknosis","Karyorrhexis","Karyolysis"]}]},"steps":["Separate reversible from irreversible findings.","Irreversibility = mitochondria cannot recover + membranes are destroyed.","Flocculent (amorphous) densities in mitochondria mark this point.","The other options are early, reversible changes."]},"s1-30":{"pyq":1,"ref":"Robbins & Cotran Pathologic Basis of Disease; Nelson Textbook of Pediatrics","w":["Correct. Minimal change disease shows normal light microscopy and diffuse foot process effacement on EM.","Spike and dome deposits are characteristic of membranous nephropathy.","Wire-loop subendothelial deposits are seen in lupus nephritis class IV.","GBM splitting ('basket-weave') is Alport syndrome."],"mm":{"c":"Glomerular disease on EM","n":[{"t":"Minimal change","k":["Foot process effacement","Children","Steroid-responsive"]},{"t":"Membranous","k":["Subepithelial spikes","Adults","Anti-PLA2R"]},{"t":"Lupus class IV","k":["Subendothelial wire loops"]},{"t":"Alport","k":["Split GBM","Deafness, eye lesions"]},{"t":"PSGN","k":["Subepithelial humps"]}]},"steps":["Nephrotic child = minimal change disease until proven otherwise.","Light microscopy is normal.","Electron microscopy shows effaced podocyte foot processes.","Excellent steroid response."]},"s1-31":{"pyq":1,"ref":"Robbins & Cotran Pathologic Basis of Disease","w":["Correct. Classical RS cells are CD15+ and CD30+.","CD20 and CD45 are typically negative on classical RS cells (positive on LP cells of NLPHL for CD20).","CD3 and CD4 are T-cell markers.","CD10 and BCL6 are germinal centre markers (e.g. follicular lymphoma)."],"mm":{"c":"Hodgkin lymphoma","n":[{"t":"Classical RS cell","k":["CD15+","CD30+","CD45−","Owl-eye nuclei"]},{"t":"NLPHL","k":["Popcorn (LP) cells","CD20+","CD15−, CD30−"]},{"t":"Subtypes","k":["Nodular sclerosis: commonest","Mixed cellularity: EBV","Lymphocyte depleted: worst"]}]},"steps":["RS cells are the malignant cells of classical Hodgkin lymphoma.","Their immunophenotype is CD15 and CD30 positive.","They usually lose B-cell markers like CD20.","Popcorn cells of NLPHL flip this pattern."],"mn":"'Reed-Sternberg is 15-30': CD15 and CD30."},"s1-32":{"pyq":1,"ref":"KD Tripathi's Essentials of Medical Pharmacology; NICE epilepsy guidance","w":["Correct. Ethosuximide (T-type Ca2+ channel blocker) is first-line for isolated typical absence.","Carbamazepine can worsen absence seizures.","Phenytoin can worsen absence seizures.","Gabapentin is ineffective and may worsen absences."],"mm":{"c":"Absence seizures","n":[{"t":"EEG","k":["3 Hz spike-and-wave"]},{"t":"First line","k":["Ethosuximide","Valproate (if GTCS too)","Lamotrigine"]},{"t":"Avoid","k":["Carbamazepine","Phenytoin","Gabapentin","Vigabatrin"]},{"t":"Mechanism","k":["Thalamic T-type Ca2+ channels"]}]},"steps":["3 Hz spike-and-wave = typical absence.","Absence seizures start in the thalamus via T-type calcium channels.","Ethosuximide blocks these channels.","Avoid sodium-channel drugs, which can worsen absences."]},"s1-33":{"pyq":1,"ref":"KD Tripathi's Essentials of Medical Pharmacology","w":["Correct. Protamine, strongly basic, neutralises acidic heparin.","Vitamin K reverses warfarin.","Idarucizumab reverses dabigatran.","FFP replaces clotting factors but does not neutralise heparin."],"mm":{"c":"Anticoagulant antidotes","n":[{"t":"Heparin","k":["Protamine (full for UFH)","Partial for LMWH"]},{"t":"Warfarin","k":["Vitamin K","PCC / FFP if urgent"]},{"t":"Dabigatran","k":["Idarucizumab"]},{"t":"Xa inhibitors","k":["Andexanet alfa"]}]},"tb":{"h":["Drug","Antidote"],"r":[["Unfractionated heparin","Protamine sulfate"],["Warfarin","Vitamin K ± PCC"],["Dabigatran","Idarucizumab"],["Rivaroxaban / apixaban","Andexanet alfa"],["Thrombolytics","Tranexamic acid"]]},"steps":["Heparin is strongly negatively charged.","Protamine is strongly positively charged.","They bind and form an inactive complex.","About 1 mg protamine neutralises ~100 units of heparin."]},"s1-34":{"pyq":1,"ref":"KD Tripathi's Essentials of Medical Pharmacology; Goodman & Gilman","w":["Correct. Phenytoin metabolism saturates near therapeutic levels, so kinetics become zero-order.","Gentamicin follows first-order kinetics (renal excretion).","Digoxin follows first-order kinetics.","Lithium follows first-order kinetics (renal)."],"mm":{"c":"Zero-order kinetics","n":[{"t":"Definition","k":["Fixed AMOUNT eliminated per time","Half-life not constant"]},{"t":"Drugs","k":["Phenytoin","Ethanol","High-dose aspirin"]},{"t":"Danger","k":["Small dose ↑ → big level ↑","Needs TDM"]}]},"steps":["First-order: a fixed fraction is eliminated.","Zero-order: enzymes are saturated, so a fixed amount is eliminated.","Phenytoin saturates its enzymes at therapeutic doses.","So small dose changes cause large changes in level."],"mn":"Zero-order drugs: 'PEA' = Phenytoin, Ethanol, Aspirin (high dose)."},"s1-35":{"pyq":1,"ref":"KD Tripathi's Essentials of Medical Pharmacology","w":["Correct. Rapid vancomycin infusion releases histamine directly (red man syndrome).","Ceftriaxone can cause biliary sludge and allergy but not this infusion reaction.","Gentamicin causes nephrotoxicity and ototoxicity.","Metronidazole causes metallic taste and a disulfiram-like reaction."],"mm":{"c":"Vancomycin","n":[{"t":"Mechanism","k":["Binds D-Ala-D-Ala","Blocks cell wall synthesis"]},{"t":"Uses","k":["MRSA","Oral: C. difficile"]},{"t":"Adverse effects","k":["Red man syndrome","Nephrotoxicity","Ototoxicity"]},{"t":"Prevention","k":["Infuse over ≥60 min","Antihistamine"]}]},"steps":["Flushing of the upper body during an infusion = histamine release.","The classic drug is vancomycin given too fast.","It is not IgE-mediated allergy.","Slow the infusion; antihistamines help."]},"s1-36":{"pyq":1,"ref":"KD Tripathi's Essentials of Medical Pharmacology; National TB Elimination Programme guidelines","w":["Correct. Ethambutol causes dose-related optic neuritis with red-green colour loss.","Isoniazid causes peripheral neuropathy and hepatitis.","Rifampicin causes orange secretions and enzyme induction.","Pyrazinamide causes hyperuricaemia and hepatotoxicity."],"mm":{"c":"ATT adverse effects","n":[{"t":"Isoniazid","k":["Neuropathy (give B6)","Hepatitis"]},{"t":"Rifampicin","k":["Orange urine","Enzyme induction","Flu-like syndrome"]},{"t":"Pyrazinamide","k":["Gout","Hepatotoxicity"]},{"t":"Ethambutol","k":["Optic neuritis","Red-green colour blindness"]}]},"tb":{"h":["Drug","Signature toxicity"],"r":[["Isoniazid","Peripheral neuropathy"],["Rifampicin","Orange secretions"],["Pyrazinamide","Hyperuricaemia"],["Ethambutol","Optic neuritis"],["Streptomycin","Ototoxicity"]]},"steps":["Vision complaint on ATT = ethambutol.","It causes retrobulbar optic neuritis.","Colour vision (red-green) is affected first.","Check vision at baseline and during therapy."],"mn":"'Ethambutol = Eyes'."},"s1-37":{"pyq":1,"ref":"KD Tripathi's Essentials of Medical Pharmacology","w":["Correct. Amiodarone causes lung fibrosis, thyroid dysfunction, corneal deposits and blue-grey skin.","Sotalol (beta-blocker + class III) causes torsades, not these organ toxicities.","Flecainide (class IC) is proarrhythmic, especially after MI.","Verapamil causes constipation, bradycardia and AV block."],"mm":{"c":"Amiodarone toxicity","n":[{"t":"Lung","k":["Pulmonary fibrosis"]},{"t":"Thyroid","k":["Hypo- or hyperthyroidism (iodine)"]},{"t":"Eye","k":["Corneal microdeposits","Optic neuropathy"]},{"t":"Skin","k":["Photosensitivity","Blue-grey colour"]},{"t":"Liver","k":["Hepatitis"]}]},"steps":["Multi-organ toxicity from one antiarrhythmic = amiodarone.","It is rich in iodine, which explains the thyroid effects.","It is lipophilic, with a very long half-life, so it deposits in tissues.","Monitor thyroid, liver and lung function."],"mn":"Amiodarone checks: 'TLC + eyes + skin' = Thyroid, Liver, Chest X-ray."},"s1-38":{"pyq":1,"ref":"KD Tripathi's Essentials of Medical Pharmacology","w":["Correct. Pralidoxime removes the phosphate group and reactivates acetylcholinesterase.","Atropine blocks muscarinic receptors but does not reactivate the enzyme.","Physostigmine is itself an anticholinesterase; it would worsen poisoning.","Neostigmine is also an anticholinesterase."],"mm":{"c":"Organophosphate poisoning","n":[{"t":"Muscarinic (DUMBELS)","k":["Diarrhoea, urination","Miosis, bradycardia","Bronchorrhoea","Lacrimation, salivation"]},{"t":"Nicotinic","k":["Fasciculations","Weakness, paralysis"]},{"t":"Atropine","k":["Muscarinic block","Titrate to dry chest"]},{"t":"Pralidoxime","k":["Reactivates AChE","Before ageing","Not for carbamates"]}]},"steps":["OP compounds phosphorylate acetylcholinesterase.","Atropine only blocks the effect at muscarinic receptors.","Oximes pull the phosphate off and restore the enzyme.","This works only before 'ageing' makes the bond permanent."],"mn":"Muscarinic features: DUMBELS."},"s1-39":{"ref":"KD Tripathi's Essentials of Medical Pharmacology; ADA Standards of Care","w":["Correct. Metformin mainly suppresses hepatic gluconeogenesis via AMPK.","Stimulating insulin secretion describes sulfonylureas.","Alpha-glucosidase inhibition describes acarbose.","SGLT2 inhibition describes gliflozins."],"mm":{"c":"Metformin","n":[{"t":"Mechanism","k":["Activates AMPK","↓ Hepatic glucose output","↑ Insulin sensitivity"]},{"t":"Benefits","k":["No hypoglycaemia alone","Weight-neutral"]},{"t":"Adverse","k":["GI upset","B12 deficiency","Lactic acidosis (rare)"]},{"t":"Avoid","k":["eGFR <30","Contrast/surgery: hold"]}]},"steps":["Classify oral antidiabetics by mechanism.","Secretagogues = sulfonylureas; glucosidase = acarbose; SGLT2 = gliflozins.","Metformin is the sensitiser acting on the liver.","Its main effect is reduced gluconeogenesis."]},"s1-40":{"pyq":1,"ref":"Ananthanarayan and Paniker's Textbook of Microbiology; Jawetz","w":["Correct. Aspergillus: thin septate hyphae with acute-angle dichotomous branching.","Mucor: broad, ribbon-like, pauci-septate hyphae with wide-angle branching.","Candida: budding yeasts with pseudohyphae.","Histoplasma: small intracellular yeasts, not hyphae in tissue."],"mm":{"c":"Hyphae on KOH","n":[{"t":"Aspergillus","k":["Septate","Narrow","Acute angle (45°)"]},{"t":"Mucorales","k":["Pauci-septate","Broad, ribbon-like","Right-angle branching"]},{"t":"Candida","k":["Yeast + pseudohyphae"]},{"t":"Treatment","k":["Aspergillus: voriconazole","Mucor: amphotericin B + debridement"]}]},"tb":{"h":["Feature","Aspergillus","Mucor"],"r":[["Septa","Present","Few or none"],["Width","Narrow","Broad"],["Branching","Acute (~45°)","Wide (~90°)"],["Drug","Voriconazole","Amphotericin B"]]},"steps":["Note three features: septa, width, branch angle.","Septate + narrow + acute angle = Aspergillus.","Aseptate + broad + right angle = Mucor.","Treatment differs, so the distinction matters."],"mn":"'Aspergillus is Acute; Mucor is Massive (broad) and at right angles.'"},"s1-41":{"pyq":1,"ref":"Ananthanarayan and Paniker's Textbook of Microbiology","w":["Correct. India ink shows the thick polysaccharide capsule of Cryptococcus as a clear halo.","Candida is not capsulated.","Histoplasma is intracellular and not capsulated.","Coccidioides forms spherules, not capsulated yeasts."],"mm":{"c":"Cryptococcus neoformans","n":[{"t":"Identification","k":["India ink: capsule halo","Mucicarmine stain","Urease positive"]},{"t":"Culture","k":["Niger (bird) seed agar","Brown colonies"]},{"t":"Disease","k":["Meningitis in AIDS","Pigeon droppings"]},{"t":"Diagnosis","k":["CrAg (most sensitive)"]}]},"steps":["CSF + HIV + meningitis: think Cryptococcus.","India ink is a negative stain; the capsule stays unstained as a halo.","Antigen testing is more sensitive than India ink.","Treat with amphotericin B + flucytosine, then fluconazole."]},"s1-42":{"ref":"Ananthanarayan and Paniker's Textbook of Microbiology","w":["Correct. Group B Strep produces CAMP factor, enhancing S. aureus haemolysis.","S. pyogenes (Group A) is bacitracin-sensitive and PYR-positive.","Enterococcus grows in 6.5% NaCl and bile esculin.","Pneumococcus is optochin-sensitive and bile-soluble."],"mm":{"c":"Streptococcal identification","n":[{"t":"Group A","k":["Bacitracin sensitive","PYR +"]},{"t":"Group B","k":["CAMP +","Hippurate +","Bacitracin resistant"]},{"t":"Pneumococcus","k":["Optochin sensitive","Bile soluble"]},{"t":"Enterococcus","k":["6.5% NaCl","Bile esculin +"]}]},"steps":["CAMP = arrowhead haemolysis next to S. aureus.","It is produced by Streptococcus agalactiae (Group B).","GBS colonises the vagina.","It causes neonatal sepsis and meningitis."]},"s1-43":{"pyq":1,"ref":"Ananthanarayan and Paniker's Textbook of Microbiology; Harrison's","w":["Correct. IgM anti-HBc is positive throughout the window period.","HBsAg has already disappeared during the window period.","Anti-HBs has not yet appeared during the window period.","HBeAg is usually gone by the window period."],"mm":{"c":"HBV serology","n":[{"t":"Acute","k":["HBsAg +","IgM anti-HBc +"]},{"t":"Window","k":["HBsAg −","Anti-HBs −","IgM anti-HBc +"]},{"t":"Recovered","k":["Anti-HBs +","IgG anti-HBc +"]},{"t":"Vaccinated","k":["Anti-HBs only"]},{"t":"Chronic","k":["HBsAg >6 months"]}]},"tb":{"h":["State","HBsAg","Anti-HBs","Anti-HBc"],"r":[["Acute","+","−","IgM +"],["Window","−","−","IgM +"],["Recovered","−","+","IgG +"],["Vaccinated","−","+","−"],["Chronic","+","−","IgG +"]]},"steps":["Window = gap between HBsAg disappearing and anti-HBs appearing.","Only core antibody bridges this gap.","In acute infection it is the IgM type.","So IgM anti-HBc is the only marker."]},"s1-44":{"pyq":1,"ref":"Ananthanarayan and Paniker's Textbook of Microbiology","w":["Correct. Geobacillus stearothermophilus spores test autoclaves (moist heat).","Bacillus atrophaeus spores test hot-air ovens and ethylene oxide.","Clostridium tetani is not used as a sterilisation indicator.","Bacillus pumilus tests ionising radiation."],"mm":{"c":"Biological indicators","n":[{"t":"Autoclave","k":["G. stearothermophilus","121 °C, 15 psi, 15 min"]},{"t":"Hot air oven","k":["B. atrophaeus","160 °C for 2 h"]},{"t":"Radiation","k":["B. pumilus"]},{"t":"Ethylene oxide","k":["B. atrophaeus"]}]},"steps":["Indicators are the spores most resistant to that method.","Moist heat: G. stearothermophilus.","Dry heat: B. atrophaeus.","Radiation: B. pumilus."],"mn":"'Steam → Stearothermophilus'."},"s1-45":{"pyq":1,"ref":"Ananthanarayan and Paniker's Textbook of Microbiology; Paniker's Parasitology","w":["Correct. Crescent (banana-shaped) gametocytes are typical of P. falciparum.","P. vivax gametocytes are round, in enlarged RBCs with Schüffner's dots.","P. malariae shows band forms and rosette schizonts.","P. ovale shows oval, fimbriated RBCs."],"mm":{"c":"Plasmodium on smear","n":[{"t":"Falciparum","k":["Crescent gametocytes","Multiple rings","Maurer's dots","Accolé forms"]},{"t":"Vivax","k":["Enlarged RBC","Schüffner's dots","Hypnozoites"]},{"t":"Malariae","k":["Band forms","Quartan fever"]},{"t":"Ovale","k":["Oval fimbriated RBC","Hypnozoites"]}]},"steps":["Gametocyte shape is the clue.","Crescent or banana = falciparum.","Falciparum smears usually show only rings and gametocytes.","It is the most dangerous species (cerebral malaria)."]},"s1-46":{"pyq":1,"ref":"Ananthanarayan and Paniker's Textbook of Microbiology; Robbins","w":["Correct. Mantoux is delayed-type (Type IV) cell-mediated hypersensitivity.","Type I is immediate, IgE-mediated (anaphylaxis).","Type II involves antibodies against cell-surface antigens.","Type III involves immune complexes (Arthus, serum sickness)."],"mm":{"c":"Hypersensitivity","n":[{"t":"Type I","k":["IgE","Anaphylaxis, asthma"]},{"t":"Type II","k":["IgG/IgM on cells","Transfusion reaction, Graves"]},{"t":"Type III","k":["Immune complexes","SLE, serum sickness"]},{"t":"Type IV","k":["T cells","Mantoux, contact dermatitis"]}]},"steps":["The reaction appears at 48-72 hours, so it is delayed.","Delayed = T-cell mediated.","T-cell mediated hypersensitivity = Type IV.","Read as induration, not redness."],"mn":"'ACID': Anaphylactic, Cytotoxic, Immune complex, Delayed."},"s1-47":{"ref":"Ananthanarayan and Paniker's Textbook of Microbiology","w":["Correct. B. anthracis forms 'Medusa head' colonies.","Clostridium perfringens shows double-zone haemolysis.","C. diphtheriae shows black colonies on tellurite.","Listeria shows tumbling motility."],"mm":{"c":"Bacillus anthracis","n":[{"t":"Morphology","k":["Bamboo-stick chains","Capsule (McFadyean)","Spores"]},{"t":"Culture","k":["Medusa head colonies","Inverted fir tree (gelatin stab)","String of pearls"]},{"t":"Disease","k":["Cutaneous: black eschar","Inhalational (woolsorters')"]}]},"steps":["'Medusa head' colony = curled outgrowths at the edge.","Classic for B. anthracis.","Other clues: inverted fir tree, string of pearls, capsule.","Clinically, cutaneous anthrax gives a painless black eschar."]}},"enrich-2.json":{"s1-48":{"pyq":1,"ref":"Reddy's The Essentials of Forensic Medicine and Toxicology","w":["Correct. Following Nysten's rule, rigor in voluntary muscle appears first in the eyelids.","Lower limbs stiffen late in the sequence.","Fingers and toes are the last to stiffen.","The neck stiffens after the eyelids, face and jaw."],"mm":{"c":"Rigor mortis","n":[{"t":"Mechanism","k":["ATP depletion","Actin-myosin locked"]},{"t":"Order (Nysten)","k":["Myocardium first","Eyelids → face → neck","Trunk → upper → lower limbs","Fingers, toes last"]},{"t":"Timing","k":["Starts 1-2 h","Full ~12 h","Passes off in same order"]},{"t":"Mimics","k":["Cadaveric spasm","Heat stiffening","Cold stiffening"]}]},"steps":["Rigor follows a fixed order in voluntary muscles.","It starts in small muscles of the head.","The eyelids are first.","It spreads downward and leaves in the same order."],"mn":"Nysten's order: 'Eyes, Face, Neck, Trunk, Arms, Legs, Toes'."},"s1-49":{"pyq":1,"ref":"Reddy's The Essentials of Forensic Medicine and Toxicology","w":["Correct. Hanging gives an oblique, incomplete mark above the thyroid cartilage.","A horizontal, continuous mark suggests ligature strangulation.","A mark at or below the thyroid cartilage suggests strangulation.","Tracheal ring fractures point to violent compression such as throttling."],"mm":{"c":"Hanging vs strangulation","n":[{"t":"Hanging","k":["Oblique mark","Incomplete at knot","Above thyroid cartilage","Saliva dribbling"]},{"t":"Strangulation","k":["Horizontal","Complete","At/below thyroid","More neck bruising"]},{"t":"Throttling","k":["Finger marks","Hyoid fracture common"]}]},"tb":{"h":["Feature","Hanging","Strangulation"],"r":[["Mark direction","Oblique","Horizontal"],["Continuity","Incomplete","Complete"],["Level","Above thyroid","At or below thyroid"],["Manner","Usually suicide","Usually homicide"]]},"steps":["Look at direction, continuity and level of the mark.","Body weight pulls the noose up towards the knot, so the mark is oblique.","At the knot the noose lifts off, so the mark is incomplete.","Above the thyroid cartilage, oblique and incomplete = hanging."]},"s1-50":{"ref":"Reddy's The Essentials of Forensic Medicine and Toxicology","w":["Correct. Cholera is a classic cause of postmortem caloricity.","Massive haemorrhage leads to rapid cooling.","Cold-water drowning speeds cooling.","Congestive heart failure is not a classic cause."],"mm":{"c":"Postmortem caloricity","n":[{"t":"Meaning","k":["Body temp rises after death"]},{"t":"Causes","k":["Cholera","Septicaemia","Tetanus","Strychnine","Heat stroke"]},{"t":"Why","k":["High heat production before death","Continuing bacterial activity"]}]},"steps":["Caloricity needs excess heat production or continuing bacterial activity.","Cholera, septicaemia and tetanus fit.","Strychnine convulsions and heat stroke also fit.","Haemorrhage and cold water do the opposite."]},"s1-51":{"pyq":1,"ref":"Reddy's The Essentials of Forensic Medicine and Toxicology","w":["Correct. Embedded powder grains cause tattooing, which marks close range.","Flame causes burning and singeing.","Smoke causes blackening, which can be wiped off.","Bullet grease causes a grease collar or abrasion collar, not tattooing."],"mm":{"c":"Firearm wound range","n":[{"t":"Contact","k":["Muzzle imprint","Cherry-red track (CO)"]},{"t":"Close","k":["Burning (flame)","Blackening (smoke)","Tattooing (powder)"]},{"t":"Distant","k":["Only abrasion collar"]},{"t":"Exit wound","k":["Larger, everted","No soot or tattooing"]}]},"steps":["Each discharge product travels a different distance.","Flame travels shortest, then smoke, then powder grains.","Powder embedded in skin cannot be wiped off: tattooing.","Its presence means the shot was fired at close range."]},"s1-52":{"pyq":1,"ref":"Reddy's Forensic Medicine and Toxicology; Harrison's (toxic alcohols)","w":["Correct. Fomepizole blocks alcohol dehydrogenase and stops toxic metabolites forming.","Naloxone reverses opioids.","Flumazenil reverses benzodiazepines.","N-acetylcysteine treats paracetamol poisoning."],"mm":{"c":"Methanol poisoning","n":[{"t":"Metabolism","k":["Methanol → formaldehyde → formic acid"]},{"t":"Effects","k":["High anion gap acidosis","Optic nerve damage","'Snowfield' vision"]},{"t":"Antidote","k":["Fomepizole","Ethanol (alternative)"]},{"t":"Other","k":["Haemodialysis","Folinic acid"]}]},"steps":["Methanol itself is not very toxic; its metabolites are.","Alcohol dehydrogenase starts the conversion.","Block it with fomepizole (or saturate it with ethanol).","Dialysis removes methanol and formate."]},"s1-53":{"pyq":1,"ref":"Reddy's The Essentials of Forensic Medicine and Toxicology","w":["Correct. Arsenic causes Mees lines on the nails.","Lead causes Burton's lines on the gums and basophilic stippling.","Mercury causes erethism and acrodynia.","Copper causes blue-green vomitus and haemolysis."],"mm":{"c":"Chronic arsenic poisoning","n":[{"t":"Skin","k":["Raindrop pigmentation","Palmoplantar keratosis"]},{"t":"Nails","k":["Mees lines"]},{"t":"Nerves","k":["Peripheral neuropathy"]},{"t":"Evidence","k":["Hair and nails retain arsenic"]},{"t":"Antidote","k":["BAL (dimercaprol)"]}]},"steps":["Transverse white nail lines = Mees lines.","They are classic for arsenic (thallium too).","Look for skin pigmentation and neuropathy.","Hair and nail analysis can confirm exposure months later."]},"s1-54":{"ref":"Reddy's The Essentials of Forensic Medicine and Toxicology","w":["Correct. Gustafson's method uses six regressive changes in adult teeth.","Wrist ossification is used for age in children and adolescents.","Skull suture fusion is a rough method for older adults.","Pubic symphysis changes are Todd's method."],"mm":{"c":"Gustafson's method","n":[{"t":"Six criteria","k":["Attrition","Periodontosis","Secondary dentine","Cementum apposition","Root resorption","Root transparency"]},{"t":"Best criterion","k":["Root transparency"]},{"t":"Use","k":["Adult age estimation"]}]},"steps":["Gustafson = teeth.","It applies to adults after eruption is complete.","It scores six degenerative changes.","Root transparency is considered the most reliable."]},"s1-55":{"ref":"Reddy's The Essentials of Forensic Medicine and Toxicology","w":["Correct. Locard's principle: every contact leaves a trace.","Daubert standard governs admissibility of expert scientific evidence (US).","McNaughten rule is a legal test of insanity.","Durham rule is another (product) test of insanity."],"mm":{"c":"Locard's exchange principle","n":[{"t":"Idea","k":["Contact leaves a trace","Both ways"]},{"t":"Trace evidence","k":["Hair, fibres","Blood, semen","Soil, glass, paint"]},{"t":"Handling","k":["Chain of custody","Proper packaging"]}]},"steps":["The phrase 'every contact leaves a trace' is a direct quote of the idea.","It is attributed to Edmond Locard.","It is the basis of trace evidence.","The other options relate to law and insanity."]},"s1-56":{"pyq":1,"ref":"Park's Textbook of Preventive and Social Medicine","w":["Correct. Sensitivity = true positives / all who have the disease.","TN/(TN+FP) is specificity.","TP/(TP+FP) is positive predictive value.","TN/(TN+FN) is negative predictive value."],"mm":{"c":"Screening test values","n":[{"t":"Sensitivity","k":["TP/(TP+FN)","Detects disease","SnNout"]},{"t":"Specificity","k":["TN/(TN+FP)","Detects health","SpPin"]},{"t":"PPV","k":["TP/(TP+FP)","↑ with prevalence"]},{"t":"NPV","k":["TN/(TN+FN)","↓ with prevalence"]}]},"tb":{"h":["","Disease +","Disease −"],"r":[["Test +","TP (a)","FP (b)"],["Test −","FN (c)","TN (d)"],["Formula","Sensitivity = a/(a+c)","Specificity = d/(b+d)"]]},"steps":["Draw the 2×2 table.","Sensitivity looks only at the diseased column.","Of those diseased, what fraction tested positive?","a/(a+c) = TP/(TP+FN)."],"mn":"SnNout: Sensitive test, Negative result, rules disease out. SpPin: Specific test, Positive result, rules disease in."},"s1-57":{"pyq":1,"ref":"Park's Textbook of Preventive and Social Medicine","w":["Correct. Case-control studies compare odds of exposure, giving the odds ratio.","Relative risk needs incidence, which comes from cohort studies.","Attributable risk also needs incidence (cohort).","Incidence cannot be measured when you start with cases."],"mm":{"c":"Study designs","n":[{"t":"Case-control","k":["Starts with outcome","Looks back","Odds ratio","Good for rare diseases"]},{"t":"Cohort","k":["Starts with exposure","Follows forward","Relative and attributable risk","Good for rare exposures"]},{"t":"RCT","k":["Intervention randomised","Strongest evidence"]},{"t":"Cross-sectional","k":["Snapshot","Prevalence"]}]},"steps":["The study starts with disease status: case-control.","You cannot calculate incidence in a case-control study.","So relative risk is not possible directly.","The odds ratio estimates it (well, when disease is rare)."]},"s1-58":{"pyq":1,"ref":"Park's Textbook of Preventive and Social Medicine","w":["Correct. Higher prevalence raises PPV.","Sensitivity is a fixed property of the test.","Specificity is also fixed.","NPV falls as prevalence rises."],"mm":{"c":"Prevalence and predictive values","n":[{"t":"Fixed","k":["Sensitivity","Specificity"]},{"t":"Rises with prevalence","k":["PPV"]},{"t":"Falls with prevalence","k":["NPV"]},{"t":"Practical","k":["Screen high-risk groups"]}]},"steps":["Separate test properties from population-dependent values.","Sensitivity and specificity belong to the test.","Predictive values depend on how common the disease is.","More disease means a positive result is more likely real: PPV rises."]},"s1-59":{"pyq":1,"ref":"Park's Textbook of Preventive and Social Medicine","w":["Correct. Tetanus comes from soil spores, not from people, so herd immunity cannot help.","Measles spreads person to person, so herd immunity protects.","Diphtheria spreads person to person.","Polio spreads person to person."],"mm":{"c":"Herd immunity","n":[{"t":"Needs","k":["Person-to-person spread","Human reservoir"]},{"t":"Works for","k":["Measles","Diphtheria","Polio"]},{"t":"Not for","k":["Tetanus (soil spores)"]},{"t":"Tetanus prevention","k":["Individual immunisation","TT/Td in pregnancy","Clean delivery"]}]},"steps":["Herd immunity blocks chains of transmission between people.","Tetanus has no human chain: infection comes from the environment.","So vaccinating others gives no indirect protection.","Every person must be vaccinated individually."]},"s1-60":{"ref":"Park's Textbook of Preventive and Social Medicine; MoHFW National Vitamin A prophylaxis guidance","w":["Correct. 1 lakh IU orally at 9 months, with MR vaccine.","2 lakh IU is the dose from 12 months onwards, every 6 months.","50,000 IU is not the programme dose for this age.","Vitamin A is given orally, not intramuscularly, in the programme."],"mm":{"c":"Vitamin A prophylaxis (India)","n":[{"t":"9 months","k":["1 lakh IU","With MR vaccine"]},{"t":"16-18 months","k":["2 lakh IU","With DPT booster"]},{"t":"Then","k":["2 lakh IU every 6 months","Up to 5 years","9 doses total"]},{"t":"Deficiency signs","k":["Night blindness first","Bitot spots","Keratomalacia"]}]},"steps":["The first dose comes at 9 months.","Infants get the half dose: 1 lakh IU.","From the second dose onwards it is 2 lakh IU every 6 months.","Nine doses in total by age 5."]},"s1-61":{"ref":"Park's Textbook of Preventive and Social Medicine","w":["Correct. Horrocks apparatus estimates bleaching powder needed (chlorine demand).","Water hardness is measured by titration methods.","Residual chlorine is measured by the orthotolidine (OT) test.","Bacterial contamination is assessed by coliform counts."],"mm":{"c":"Water chlorination","n":[{"t":"Horrocks apparatus","k":["Chlorine demand","Dose of bleaching powder"]},{"t":"OT test","k":["Residual chlorine"]},{"t":"Target","k":["0.5 mg/L free residual","After 1 h contact"]},{"t":"Breakpoint","k":["Point where free chlorine appears"]}]},"steps":["Horrocks = how much bleaching powder.","It uses starch-iodide to show the colour change.","OT test then checks residual chlorine.","Target: 0.5 mg/L free chlorine after 1 hour."]},"s1-62":{"ref":"Park's Textbook of Preventive and Social Medicine","w":["Correct. The submerged part is the hidden, undiagnosed and subclinical disease.","Cases seen by clinicians are the visible tip.","Deaths are part of the visible picture.","Carriers are only one part of the submerged portion."],"mm":{"c":"Iceberg of disease","n":[{"t":"Tip","k":["Clinical cases","What doctors see"]},{"t":"Submerged","k":["Undiagnosed","Subclinical","Carriers","Latent"]},{"t":"Use","k":["Justifies screening"]},{"t":"Big hidden part","k":["Hypertension","Diabetes","Anaemia"]}]},"steps":["The visible tip = diagnosed clinical cases.","Below the water lies the larger hidden burden.","That burden includes undiagnosed and subclinical cases.","Screening aims to uncover it."]},"s1-63":{"pyq":1,"ref":"Park's Textbook of Preventive and Social Medicine; MoHFW Immunisation Handbook","w":["Correct. OPV is the most heat-sensitive routine vaccine.","Tetanus toxoid is heat-stable but freeze-sensitive.","Hepatitis B vaccine is freeze-sensitive.","Pentavalent vaccine is freeze-sensitive."],"mm":{"c":"Cold chain","n":[{"t":"Heat sensitive","k":["OPV (most)","Measles/MR (reconstituted)","BCG"]},{"t":"Freeze sensitive","k":["Hep B","Pentavalent, DPT","TT/Td","PCV"]},{"t":"Checks","k":["VVM for heat","Shake test for freezing"]},{"t":"Storage","k":["+2 to +8 °C at use"]}]},"steps":["Split vaccines into heat-sensitive and freeze-sensitive.","Heat-sensitive live vaccines: OPV tops the list.","Adsorbed (alum) vaccines are freeze-sensitive.","VVM shows heat exposure; the shake test shows freezing."]},"s1-64":{"pyq":1,"ref":"Dhingra's Diseases of Ear, Nose and Throat","w":["Correct. Negative Rinne + Weber to the same ear = conductive loss in that ear.","Sensorineural loss would give a positive Rinne and Weber to the opposite (better) ear.","Right conductive loss would lateralise Weber to the right.","Normal hearing gives a positive Rinne and a central Weber."],"mm":{"c":"Tuning fork tests","n":[{"t":"Rinne","k":["AC > BC = positive (normal or SNHL)","BC > AC = negative (conductive)"]},{"t":"Weber","k":["Conductive: to worse ear","SNHL: to better ear"]},{"t":"Fork","k":["512 Hz"]},{"t":"Trap","k":["False-negative Rinne in dead ear"]}]},"tb":{"h":["","Rinne","Weber"],"r":[["Normal","Positive","Central"],["Conductive loss","Negative","To affected ear"],["Sensorineural loss","Positive","To normal ear"]]},"steps":["Rinne negative: bone conduction beats air conduction, so conductive loss.","Weber goes to the side of conductive loss.","Both point to the left ear.","Diagnosis: left conductive hearing loss."]},"s1-65":{"pyq":1,"ref":"Dhingra's Diseases of Ear, Nose and Throat","w":["Correct. Little's area on the anteroinferior septum is the commonest bleeding site.","Woodruff's plexus is a posterior bleeding site in older adults.","The middle turbinate is not a common source.","The roof of the nose is rarely the source."],"mm":{"c":"Epistaxis","n":[{"t":"Anterior (commonest)","k":["Little's area","Kiesselbach plexus","Young people"]},{"t":"Posterior","k":["Woodruff's plexus","Elderly, hypertensive"]},{"t":"Arteries in Kiesselbach","k":["Anterior ethmoidal","Sphenopalatine","Greater palatine","Superior labial"]},{"t":"First aid","k":["Lean forward","Pinch soft nose"]}]},"steps":["Most nosebleeds are anterior.","Anterior septal vessels meet in Little's area.","It is exposed to dry air and nose-picking.","Posterior bleeds (Woodruff's) are rarer and more serious."]},"s1-66":{"pyq":1,"ref":"Dhingra's Diseases of Ear, Nose and Throat","w":["Correct. Carhart notch is a dip in bone conduction at 2000 Hz.","500 Hz is not where the notch occurs.","A 4000 Hz notch is typical of noise-induced hearing loss.","8000 Hz is not typical of otosclerosis."],"mm":{"c":"Otosclerosis","n":[{"t":"Pathology","k":["Stapes footplate fixation","Young women, often bilateral"]},{"t":"Signs","k":["Paracusis Willisii","Schwartze sign"]},{"t":"Audiogram","k":["Conductive loss","Carhart notch at 2 kHz"]},{"t":"Treatment","k":["Stapedotomy","Hearing aid"]}]},"steps":["Otosclerosis = conductive loss from stapes fixation.","The fixed stapes alters bone conduction mechanics.","This produces an apparent BC dip at 2 kHz.","It disappears after stapes surgery."],"mn":"'Carhart at 2K; Noise at 4K'."},"s1-67":{"pyq":1,"ref":"Dhingra's Diseases of Ear, Nose and Throat","w":["Correct. Petrous apicitis involves the abducens nerve (lateral rectus palsy).","Facial palsy is a complication of otitis media but not part of Gradenigo triad.","Hoarseness relates to vagus/recurrent laryngeal nerve, not part of the triad.","Vertigo can occur with labyrinthitis but is not in the triad."],"mm":{"c":"Gradenigo syndrome","n":[{"t":"Cause","k":["Petrous apicitis"]},{"t":"Triad","k":["Ear discharge","Retro-orbital pain (V)","Lateral rectus palsy (VI)"]},{"t":"Why VI","k":["Dorello's canal near apex"]},{"t":"Diagnosis","k":["CT/MRI temporal bone"]}]},"steps":["Ear infection spreading to the petrous apex.","The abducens nerve passes through Dorello's canal there.","The trigeminal ganglion lies close by, causing pain.","Triad: discharge, pain, diplopia from lateral rectus palsy."]},"s1-68":{"pyq":1,"ref":"Dhingra's Diseases of Ear, Nose and Throat","w":["Correct. Quinsy is a peritonsillar abscess.","Parapharyngeal abscess lies lateral to the superior constrictor, with neck swelling.","Retropharyngeal abscess lies behind the pharynx, often in young children.","Pus in tonsillar crypts is follicular tonsillitis."],"mm":{"c":"Quinsy","n":[{"t":"Location","k":["Between tonsil capsule and superior constrictor"]},{"t":"Features","k":["Trismus","Hot potato voice","Uvula pushed to opposite side"]},{"t":"Treatment","k":["Incision and drainage","Antibiotics","Interval tonsillectomy ~6 weeks"]}]},"steps":["Quinsy = peritonsillar abscess.","Pus sits outside the tonsil capsule.","It causes trismus and displaces the uvula.","Drain at the point of maximum bulge."]},"s1-69":{"ref":"Dhingra's Diseases of Ear, Nose and Throat","w":["Correct. Bezold abscess lies deep to the sternocleidomastoid.","Citelli abscess tracks along the posterior belly of digastric.","Luc abscess lies deep to temporalis via the external canal.","Zygomatic abscess lies over the zygoma."],"mm":{"c":"Mastoid abscesses","n":[{"t":"Postauricular","k":["Commonest"]},{"t":"Bezold","k":["Deep to SCM"]},{"t":"Citelli","k":["Along digastric posterior belly"]},{"t":"Luc","k":["Deep to temporalis"]},{"t":"Zygomatic","k":["Over zygoma"]}]},"steps":["Pus breaks out of the mastoid tip.","The tip gives attachment to the SCM.","Pus tracking deep to SCM = Bezold.","Learn each abscess by its route."]},"s1-70":{"pyq":1,"ref":"Dhingra's Diseases of Ear, Nose and Throat; Scott-Brown's Otorhinolaryngology","w":["Correct. JNA pushes the posterior antral wall forward: Holman-Miller sign.","Inverted papilloma arises on the lateral nasal wall, with unilateral mass and risk of malignancy.","Antrochoanal polyp is a smooth, pale polyp from the maxillary antrum extending to the choana.","Maxillary carcinoma destroys bone rather than bowing it."],"mm":{"c":"Juvenile nasopharyngeal angiofibroma","n":[{"t":"Who","k":["Adolescent boys"]},{"t":"Presentation","k":["Recurrent profuse epistaxis","Nasal obstruction"]},{"t":"Imaging","k":["Holman-Miller (antral) sign","Widened pterygopalatine fossa"]},{"t":"Management","k":["No biopsy","Embolise then excise"]}]},"steps":["Bowing of the posterior maxillary wall = Holman-Miller sign.","It means a mass in the pterygopalatine fossa.","In a teenage boy with nosebleeds, that mass is JNA.","Do not biopsy: torrential bleeding risk."]},"s1-71":{"pyq":1,"ref":"Dhingra's Diseases of Ear, Nose and Throat; AAO-HNS Bell's palsy guideline","w":["Correct. Oral steroids started within 72 hours improve recovery in Bell's palsy.","Surgical decompression is not first-line in Bell's palsy.","Antivirals alone are not recommended; they may be added to steroids.","Botulinum toxin is used later for synkinesis, not acute treatment."],"mm":{"c":"Bell's palsy","n":[{"t":"Type","k":["LMN facial palsy","Forehead involved"]},{"t":"Cause","k":["Idiopathic (HSV-1 suspected)"]},{"t":"Treatment","k":["Oral prednisolone ≤72 h","Eye care"]},{"t":"Prognosis","k":["70-85% full recovery"]},{"t":"UMN lesion","k":["Forehead spared"]}]},"steps":["Sudden isolated LMN facial weakness = Bell's palsy.","Steroids reduce nerve swelling in the bony canal.","Start them within 72 hours.","Protect the eye from exposure keratitis."]},"s1-72":{"pyq":1,"ref":"Khurana's Comprehensive Ophthalmology; Parsons' Diseases of the Eye","w":["Correct. Laser peripheral iridotomy relieves pupillary block and is definitive.","Trabeculectomy is for uncontrolled glaucoma, not the first step.","Long-term acetazolamide is not definitive and has side effects.","Atropine dilates the pupil and can worsen angle closure."],"mm":{"c":"Acute angle closure","n":[{"t":"Symptoms","k":["Severe eye pain, headache","Haloes, vomiting"]},{"t":"Signs","k":["Fixed mid-dilated pupil","Corneal oedema","High IOP"]},{"t":"Medical","k":["IV acetazolamide","Topical β-blocker","Pilocarpine","Mannitol"]},{"t":"Definitive","k":["Laser PI (both eyes)"]}]},"steps":["First lower IOP medically.","The cause is pupillary block, so make a new path for aqueous.","Laser peripheral iridotomy does this.","Treat the fellow eye prophylactically."]},"s1-73":{"pyq":1,"ref":"Khurana's Comprehensive Ophthalmology","w":["Correct. CRAO: pale retina with a cherry-red spot.","CRVO gives a 'blood and thunder' fundus with haemorrhages.","Retinal detachment gives a grey, billowing retina and field loss.","Vitreous haemorrhage obscures the fundus view."],"mm":{"c":"CRAO","n":[{"t":"Symptom","k":["Sudden painless loss of vision"]},{"t":"Fundus","k":["Pale oedematous retina","Cherry-red spot","Box-carring of vessels"]},{"t":"Why red spot","k":["Fovea thin","Choroid shows through"]},{"t":"Other cherry-red spots","k":["Tay-Sachs","Niemann-Pick"]}]},"steps":["Sudden painless visual loss: think vascular.","A white retina means arterial ischaemia.","The fovea stays red because choroid shows through.","So: central retinal artery occlusion."]},"s1-74":{"ref":"Khurana's Comprehensive Ophthalmology","w":["Correct. Koeppe nodules at the pupillary margin indicate granulomatous uveitis.","Acute angle closure does not cause iris nodules.","Bacterial keratitis affects the cornea, not the iris
